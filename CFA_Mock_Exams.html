<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFA Level III Offline Practice</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#ffffff; --border:#dfe3e8; --text:#1f2937; --muted:#6b7280;
    --accent:#1d4ed8; --accent-light:#e8efff; --green:#16a34a; --red:#dc2626; --amber:#b45309;
    --cfa-green:#6f9c44; --cfa-green-dark:#4f7530; --cfa-dark:#43464d; --cfa-dark2:#3a3d43;
    --cfa-yellow:#fdf3d0; --cfa-yellow-border:#d8cfa0;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;overflow:hidden;}
  body{display:flex;flex-direction:column;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  header.topbar{flex:none;background:var(--panel);border-bottom:1px solid var(--border);padding:5px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:0;}
  header.topbar h1{font-size:12.5px;font-weight:600;margin:0;margin-right:4px;white-space:nowrap;color:var(--muted);}
  .examTabs{display:flex;gap:4px;flex-wrap:wrap;}
  .examTab{padding:3px 9px;border:1px solid var(--border);border-radius:5px;background:#fff;cursor:pointer;font-size:12px;}
  .examTab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .spacer{flex:1;}
  .scoreBadge{font-size:12px;font-weight:600;padding:3px 8px;border-radius:5px;background:var(--accent-light);color:var(--accent);}
  button.btn{padding:4px 10px;border-radius:5px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:12px;}
  button.btn.danger{color:var(--red);border-color:var(--red);}
  main.content{flex:1;min-height:0;width:100%;padding:6px 14px;display:flex;flex-direction:column;}
  body.is-fullscreen header.topbar{display:none;}
  body.is-fullscreen main.content{padding:0;}
  body.is-fullscreen .cfaShell{border-radius:0;border:none;box-shadow:none;}
  .examPanel{display:none;min-height:0;}
  .examPanel.active{display:flex;flex-direction:column;flex:1;min-height:0;}

  /* ---- CFA-style exam shell ---- */
  .cfaShell{flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .cfaTopRow{display:flex;align-items:center;gap:0;background:var(--cfa-dark);color:#fff;border-bottom:1px solid var(--cfa-dark2);padding:10px 16px;flex-wrap:wrap;}
  .cfaQInfo{padding-right:16px;border-right:1px solid rgba(255,255,255,.18);margin-right:16px;min-width:100px;}
  .cfaQNum{font-weight:700;font-size:14px;white-space:nowrap;color:#fff;}
  .cfaSection{font-size:12.5px;color:rgba(255,255,255,.75);margin-top:2px;}
  .cfaTimerWrap{display:flex;align-items:center;gap:8px;padding-right:16px;border-right:1px solid rgba(255,255,255,.18);margin-right:16px;}
  .cfaClockIcon{font-size:18px;}
  .cfaTimerLabel{font-size:11.5px;color:rgba(255,255,255,.75);white-space:nowrap;}
  .cfaTimerVal{font-variant-numeric:tabular-nums;font-weight:600;font-size:13.5px;color:#fff;}
  .cfaProgressWrap{flex:1;min-width:150px;display:flex;flex-direction:column;gap:4px;margin-right:16px;}
  .cfaProgressBar{height:8px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden;}
  .cfaProgressFill{height:100%;background:#fff;width:0%;transition:width .2s;}
  .cfaProgressLabel{font-size:11.5px;color:rgba(255,255,255,.75);}
  .cfaFinishBtn{background:var(--cfa-yellow);border:1px solid var(--cfa-yellow-border);color:#5c4d1a;font-weight:700;padding:9px 18px;border-radius:6px;cursor:pointer;font-size:13px;white-space:nowrap;}
  .cfaFinishBtn:disabled{opacity:.6;cursor:default;}
  .cfaGreenBar{flex:none;background:var(--cfa-green);color:#fff;padding:6px 16px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:12.5px;font-weight:600;}
  .cfaBody{flex:1;min-height:0;display:flex;}
  .casePanel{width:66.666%;flex:none;border-right:1px solid var(--border);display:flex;flex-direction:column;height:100%;}
  .casePanelHeader{flex:none;background:var(--cfa-dark);color:#fff;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;}
  .casePanelIcons{display:flex;gap:4px;}
  .iconBtn{background:transparent;border:none;color:inherit;cursor:pointer;font-size:14px;padding:2px 6px;border-radius:4px;}
  .casePanelIcons .iconBtn:hover{background:rgba(255,255,255,.15);}
  .casePanelBody{padding:14px 16px 24px;overflow-y:auto;flex:1;min-height:0;}
  .caseTopic{font-size:14.5px;text-align:center;text-transform:uppercase;margin:0 0 4px;font-weight:700;}
  .casePoints{font-size:12.5px;text-align:center;color:var(--muted);text-transform:uppercase;margin-bottom:12px;}
  .reopenCaseBtn{display:none;background:var(--cfa-dark);color:#fff;border:none;border-radius:6px;padding:8px 10px;cursor:pointer;font-size:12px;align-self:flex-start;margin:10px 0 10px 10px;}
  .qPane{flex:1;display:flex;min-width:0;height:100%;}
  .pillNav{width:104px;flex:none;background:#f4f6f4;border-right:1px solid var(--border);padding:10px 8px;overflow-y:auto;height:100%;display:flex;flex-direction:column;gap:4px;}
  .pill,.pillParent{background:var(--cfa-green);color:#fff;border:none;border-radius:5px;padding:6px 4px;font-size:12.5px;font-weight:600;cursor:pointer;text-align:center;position:relative;}
  .pillParent{display:flex;align-items:center;justify-content:center;gap:4px;}
  .pillArrow{font-size:10px;}
  .pillChildren{display:flex;flex-direction:column;gap:4px;margin:2px 0 6px 10px;}
  .pill.active{background:#fff;color:var(--cfa-green-dark);border:2px solid var(--cfa-green-dark);}
  .pill.active::after{content:'▶';position:absolute;right:-13px;top:50%;transform:translateY(-50%);color:var(--cfa-green-dark);font-size:11px;}
  .pill.answered:not(.active){box-shadow:inset 0 0 0 2px rgba(255,255,255,.55);}
  .pill.flagged::before{content:'🚩';margin-right:3px;font-size:10px;}
  .qCard{flex:1;padding:20px 26px 32px;overflow-y:auto;height:100%;min-width:0;}
  .qCardHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
  .qCardBadge{font-size:13px;color:var(--accent);cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border:1px solid var(--accent-light);border-radius:6px;background:var(--accent-light);}
  .qCardType{font-size:12.5px;color:var(--muted);font-style:italic;}

  .narrative p{line-height:1.6;font-size:15.5px;margin:0 0 10px;}
  .narrative ul{margin:0 0 10px 18px;font-size:15.5px;line-height:1.55;}
  .exhibit-title{font-weight:700;text-align:center;margin:12px 0 4px;font-size:14px;}
  table.exhibit-table{border-collapse:collapse;width:100%;margin:0 0 14px;font-size:13.5px;}
  table.exhibit-table td{border-top:1px solid var(--border);padding:6px 9px;}
  table.exhibit-table tr:first-child td{border-top:none;border-bottom:1.5px solid var(--text);font-weight:600;}

  .prompt p{font-size:15.5px;line-height:1.6;margin:0 0 8px;}

  .choicesCfa{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  .choiceRow{display:flex;align-items:stretch;gap:10px;cursor:pointer;}
  .choiceLetter{width:20px;flex:none;font-weight:700;padding-top:9px;text-align:center;}
  .choiceBox{flex:1;border:1.5px solid var(--border);border-radius:6px;padding:10px 14px;font-size:15px;line-height:1.5;transition:border-color .15s,background .15s;}
  .choiceRow:hover .choiceBox{border-color:var(--accent);}
  .choiceRow.selected .choiceBox{border-color:var(--accent);background:var(--accent-light);}

  .essayEditorWrap{border:1px solid var(--border);border-radius:8px;margin-top:10px;overflow:hidden;}
  .essayToolbar{display:flex;flex-wrap:wrap;gap:2px;background:#f4f5f6;border-bottom:1px solid var(--border);padding:5px 6px;}
  .essayToolbar button{border:none;background:transparent;padding:5px 8px;border-radius:4px;cursor:pointer;font-size:12.5px;}
  .essayToolbar button:hover{background:#e5e7eb;}
  .essayEditable{min-height:140px;padding:12px;font-size:13.5px;line-height:1.6;outline:none;}
  .essayEditable:empty:before{content:attr(data-placeholder);color:#9aa1ab;}
  .essayEditorWrap.locked .essayToolbar{opacity:.4;pointer-events:none;}
  .essayEditorWrap.locked .essayEditable{background:#fafbfc;}

  .cfaBottomBar{background:var(--cfa-dark2);padding:8px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
  .cfaBottomBar .iconBtn{color:#fff;font-size:16px;}
  .bottomLeftIcons{display:flex;gap:6px;}
  .bottomRightNav{display:flex;align-items:center;gap:8px;}
  .flagBtn.flaggedOn{filter:drop-shadow(0 0 3px #fbbf24);}
  .navBtn{background:var(--cfa-green);color:#fff;border:none;border-radius:5px;padding:7px 16px;font-size:13px;font-weight:600;cursor:pointer;}
  .navBtn:disabled{opacity:.4;cursor:default;}

  .reviewHolder{margin-top:4px;}
  .reviewBlock{margin-top:10px;padding:10px 12px;background:#fafbfc;border:1px solid var(--border);border-radius:8px;}
  .reviewChoice{display:flex;align-items:center;gap:8px;padding:4px 6px;font-size:13.5px;border-radius:5px;}
  .reviewChoice.correctChoice{background:#eafaf0;color:var(--green);}
  .reviewChoice.wrongChoice{background:#fef2f2;color:var(--red);}
  .tag{font-size:11px;padding:1px 7px;border-radius:10px;margin-left:6px;font-weight:600;}
  .tag.correct{background:#dcfce7;color:var(--green);}
  .tag.yours{background:#e0e7ff;color:var(--accent);}
  .tag.yourswrong{background:#fee2e2;color:var(--red);}
  .selfScoreRow{display:flex;align-items:center;gap:10px;margin-top:8px;}
  .selfScoreRow input[type=number]{width:70px;padding:5px 7px;border:1px solid var(--border);border-radius:6px;}
  .feedback{margin-top:8px;font-size:13.5px;line-height:1.55;color:#374151;}
  .feedback p{margin:0 0 8px;}
  .feedback-label{font-weight:700;font-size:12px;color:var(--amber);text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px;}
  .qScoreTag{font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:10px;}
  .qScoreTag.full{background:#dcfce7;color:var(--green);}
  .qScoreTag.zero{background:#fee2e2;color:var(--red);}
  .qScoreTag.partial{background:#fef3c7;color:var(--amber);}

  mark.hl{background:#fff59d;padding:0 1px;border-radius:2px;cursor:pointer;}
  mark.hl:hover{background:#ffe066;}
  #hlToolbar{position:absolute;z-index:300;background:#1f2937;color:#fff;padding:4px;border-radius:6px;font-size:12px;display:none;box-shadow:0 2px 10px rgba(0,0,0,.3);}
  #hlToolbar button{background:transparent;border:none;color:#fff;cursor:pointer;font-size:12.5px;padding:4px 8px;border-radius:4px;}
  #hlToolbar button:hover{background:rgba(255,255,255,.15);}

  #overviewModal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:400;}
  .overviewCard{background:#fff;border-radius:10px;max-width:560px;width:92%;max-height:80vh;overflow-y:auto;padding:16px 18px;}
  .overviewCard h3{margin:0 0 10px;font-size:15px;}
  .overviewRow{margin-bottom:10px;}
  .overviewVTitle{font-size:12.5px;color:var(--muted);margin-bottom:4px;}
  .overviewCells{display:flex;flex-wrap:wrap;gap:6px;}
  .overviewCell{border:1px solid var(--border);background:#f4f6f4;border-radius:5px;padding:5px 9px;font-size:12px;cursor:pointer;}
  .overviewCell.done{background:#dcfce7;border-color:#86e0ab;}
  .overviewCell.flag::after{content:' 🚩';}
  .overviewCloseBtn{margin-top:12px;}

  @media (max-width: 900px){
    html,body{overflow:auto;}
    .cfaBody{flex-direction:column;height:auto;}
    .casePanel{width:100%;border-right:none;border-bottom:1px solid var(--border);height:320px;}
    .qPane{height:auto;}
    .qCard,.pillNav{height:auto;max-height:none;}
  }
</style>
</head>
<body>

<header class="topbar">
  <h1>CFA L3</h1>
  <div class="examTabs" id="examTabs"></div>
  <div class="spacer"></div>
  <span class="scoreBadge" id="scoreBadge">Chưa nộp bài</span>
  <button class="btn" id="fullscreenBtn" title="Toàn màn hình">⛶ Toàn màn hình</button>
  <button class="btn danger" id="resetBtn">Làm lại từ đầu</button>
</header>

<main class="content" id="content"></main>

<div id="hlToolbar"><button id="hlBtn">🖍 Highlight</button></div>

<div id="overviewModal">
  <div class="overviewCard">
    <h3>Tổng quan bài làm</h3>
    <div class="overviewBody"></div>
    <button class="btn overviewCloseBtn" id="overviewCloseBtn">Đóng</button>
  </div>
</div>

<script>
const EXAM_DATA = [{"id": "M1S1", "title": "Module 1 - Session 1", "totalPoints": 84, "vignettes": [{"topic": "PORTFOLIO MANAGEMENT", "points": 12, "narrative": "<p>John Robinson is an investment consultant specializing in fixed-income credit strategies. He meets with his client, Ana Smith, a pension fund portfolio manager.</p>\n<p>Robinson describes a credit valuation model based on default probability and recovery rate that he uses to estimate credit spreads. Using ExtraWire Inc. as an example, he notes that the company has an outstanding second lien bank loan maturing in three years with a spread of 208 bps. ExtraWire is considering issuing a new senior unsecured bank loan with the same maturity. The average historical corporate debt recovery rate is 29% for second lien loans and 44% for senior unsecured bank loans. Robinson estimates the credit spread for the new loan.</p>\n<p>Next, Robinson shows how credit default swap (CDS) contracts of the same issuer can be used for portfolio strategies given a specific credit spread view. As an example, he structures a long–short duration-neutral strategy starting with a $20 million notional, 10-year CDS contract. He estimates the return of the strategy where the 5-year CDS spread decreases by 5 bps and the 10-year CDS spread increases by 10 bps from their current levels shown in Exhibit 1.</p>\n<div class=\"exhibit-title\">Exhibit 1</div>\n<table class=\"exhibit-table\"><tr><td></td><td>Current CDS Spread</td><td>CDS Effective Spread Duration</td></tr><tr><td>5 years</td><td>125 bps</td><td>4.889</td></tr><tr><td>10 years</td><td>170 bps</td><td>8.375</td></tr></table>\n<p>Smith and Robinson discuss tail risk management and value-at-risk (VaR) models in the context of a defined benefit pension fund. The fund's portfolio contains embedded options, and Smith asks Robinson how to estimate the expected 1-month loss on the portfolio if losses exceed the VaR threshold.</p>\n<p>Smith considers buying a bond issued by LotsaStorage Inc. that has an effective spread duration of 7 and a credit spread of 250 bps. She wants to understand the impact of a change in the credit spread on the bond's expected return. Assuming a 40% recovery rate and a 1.5% annualized probability of default, Robinson computes the expected excess spread return if the bond is held for one year and the credit spread falls to 225 bps.</p>", "questions": [{"type": "mc", "points": 1, "prompt": "<p>The credit spread for ExtraWire's new senior unsecured bank loan is closest to:</p>", "choices": ["1.08%.", "1.37%.", "1.64%."], "num": 1, "correctIndex": 2, "correctText": "1.64%.", "feedback": ["Correct because using the probability of default (POD) approximation, the current second lien bank loan recovery rate (RR) is used to estimate ExtraWire's POD:<br>POD = Spread / LGD, and<br>LGD = (1 – RR)<br>POD = 208 bps / (1 – 29%) = 292.96 bps", "With the POD estimated, the expected credit spread of the new senior unsecured bank loan is calculated as follows:<br>Credit spread = POD × LGD = POD × (1 – RR) = 292.96 bps × 0.56 = 164.06 bps = 1.64%"]}, {"type": "mc", "points": 1, "prompt": "<p>The net return of the long–short duration-neutral strategy in Robinson's CDS spread example is closest to:</p>", "choices": ["$83,750.", "$251,250.", "$370,682."], "num": 2, "correctIndex": 1, "correctText": "$251,250.", "feedback": ["Correct because, under Robinson's CDS spread scenario, the appropriate long–short strategy is to short protection on the 5-year bond (where the spread is expected to decrease by 5 bps) and go long protection on the 10-year bond (where the spread is expected to increase by 10 bps). The return is calculated as follows:", "Step 1: Calculate the 5-year CDS contract notional that matches the basis point value (BPV) of a $20 million notional as follows:", "BPV 5y CDS = EffSpreadDur 10y / EffSpreadDur 5y × $20,000,000<br>BPV 5y CDS = 8.375 / 4.889 × $20,000,000 = $34,260,585", "Step 2: Calculate portfolio net return", "5y short protection = –$34,260,585 × (–5 bps × 4.889) = $83,750 10y long protection = +$20,000,000 × (10 bps × 8.375) = $167,500<br>Net return = $83,750 + $167,500 = $251,250"]}, {"type": "mc", "points": 1, "prompt": "<p>Robinson's response to Smith regarding how to best estimate the loss for the defined benefit pension fund is that she should use:</p>", "choices": ["relative VaR based on historical simulation.", "conditional VaR based on Monte Carlo analysis.", "incremental VaR based on the parametric method."], "num": 3, "correctIndex": 1, "correctText": "conditional VaR based on Monte Carlo analysis.", "feedback": ["Correct because conditional value at risk (CVaR), also referred to as expected shortfall or expected tail loss, measures the average loss over a specific time period conditional on that loss exceeding the VaR threshold. The pension plan also holds bonds with embedded options, which can be best analyzed for return using a Monte Carlo analysis."]}, {"type": "mc", "points": 1, "prompt": "<p>The expected excess spread return on the LotsaStorage bond is closest to:</p>", "choices": ["165 bps.", "335 bps.", "365 bps."], "num": 4, "correctIndex": 1, "correctText": "335 bps.", "feedback": ["Correct because the expected excess spread return is calculated with the following equation:<br>E[ExcessSpread] = Spread0 – (EffSpreadDur × Delta spread) – (POD × LGD)<br>where:<br>E[ExcessSpread] = Expected excess spread<br>Spread0 = Initial credit spread (250 bps)<br>EffSpreadDur = Effective spread duration (7 years)<br>Delta spread = Change in spread (–25 bps = 225 bps – 250 bps)<br>POD = Probability of default (150 bps)<br>LGD = Loss given default (60% = 1 – 40% Recovery rate)<br>Therefore:<br>E[ExcessSpread] = Spread0 – (EffSpreadDur × Delta spread) – (POD × LGD)<br>E[ExcessSpread] = 250 bps – (7 × (–25 bps)) – (150 bps × 60%) = 335 bps"]}]}, {"topic": "PORTFOLIO CONSTRUCTION", "points": 12, "narrative": "<p>Kayla Maxwell is an investment consultant serving insurance companies and banks.</p>\n<p>Maxwell meets with Jason Brown, who is the chief financial officer of a publicly traded life insurance company, Safety Inc. Brown expects a significant change in the composition of total product revenue in the next two years as shown in Exhibit 1. Maxwell evaluates the effect of these changes on Safety's risk tolerance.</p>\n<div class=\"exhibit-title\">Exhibit 1</div>\n<table class=\"exhibit-table\"><tr><td>Product</td><td>Current Composition (% of Total Product Revenue)</td><td>Expected Composition (% of Total Product Revenue)</td></tr><tr><td>Whole and term life insurance</td><td>28%</td><td>16%</td></tr><tr><td>Universal life insurance</td><td>31%</td><td>23%</td></tr><tr><td>Variable life insurance</td><td>7%</td><td>19%</td></tr><tr><td>Fixed annuities</td><td>19%</td><td>13%</td></tr><tr><td>Variable annuities</td><td>15%</td><td>29%</td></tr><tr><td>Total</td><td>100%</td><td>100%</td></tr></table>\n<p>Brown asks Maxwell to review Safety's strategic financial plan for the next three years. Brown is interested whether certain items on the plan might be viewed as contributing factors to systemic risk by Safety's regulator. He asks Maxwell to review the following three items:</p>\n<p>Item 1: Safety will liquidate 5% of its high-yield bond holdings and use the proceeds to buy short-term US Treasuries in the next three months.</p>\n<p>Item 2: Safety will reduce off-balance-sheet guarantees by 25% by the end of next year.</p>\n<p>Item 3: Safety plans to increase the amount of repurchases of common equity by 5% annually.</p>\n<p>Maxwell next prepares a presentation for another client, Affiliate Bancorp, a publicly-traded bank. Maxwell calculates the interest rate sensitivity and volatility of Affiliate's equity capital using the information shown in Exhibit 2.</p>\n<div class=\"exhibit-title\">Exhibit 2</div>\n<table class=\"exhibit-table\"><tr><td>Equity capital ratio</td><td>10%</td></tr><tr><td>Modified duration of assets</td><td>2.2</td></tr><tr><td>Modified duration of liabilities</td><td>1.6</td></tr><tr><td>Change in yield on liabilities per 1% change in yield on asset portfolio</td><td>75 bps</td></tr><tr><td>Market capitalization ($ billion)</td><td>8</td></tr></table>\n<p>Affiliate's CFO is evaluating a recent proposal that increases the prepayment penalties on new commercial loans made by the bank. Maxwell researches the effect of this proposal on the volatility of Affiliate's equity capital.</p>", "questions": [{"type": "essay", "points": 3, "prompt": "<p><strong>Determine</strong> the most likely effect on Safety's risk tolerance of the expected change in the composition of total product revenue. (Decrease, No effect, Increase) <strong>Justify</strong> your response.</p>", "num": 5, "feedback": ["Exhibit 1 shows that Brown expects the total contribution of variable-rate products will increase from 22% to 48% (or implicitly the contribution of fixed-rate products will decrease). Since variable-rate products shifts the investment risk from the insurance company to policyholders through separate accounts, the insurance company’s risk burden should decline resulting in higher risk tolerance. A similar argument uses the mathematical framework of equity capital volatility. Variable annuities increase the correlation between changes in liabilities and assets while diminishing the relevance of volatilities of changes in liabilities and assets. This results in lower equity volatility and greater investment flexibility provided by the insurance regulators."]}, {"type": "essay", "points": 3, "prompt": "<p><strong>Determine</strong> the item from Safety's strategic financial plan that its regulator should view as a factor contributing to systemic risk. (Item 1, Item 2, Item 3) <strong>Justify</strong> your response.</p>", "num": 6, "feedback": ["Regulators are intensely focused on capital adequacy, liquidity and leverage to mitigate systemic or contagion risk. Item 3 is the only item in the strategic financial plan that will most likely to contribute to systemic risk because larger repurchase amounts imply lower liquidity (since repurchases reduce the cash balance of the firm) and higher leverage (due to lower equity capital). Consistently, one of the requirements that regulators have imposed to bolster the financial system post 2008–2009 is limiting payout of dividends and repurchases of common equity.", "Other items are unlikely to be contributing risk factors from Safety’s regulator's perspective because Item 1 increases the quality of Safety’s holdings, implying higher liquidity and capital adequacy, and Item 2 implies lower leverage."]}, {"type": "essay", "points": 3, "prompt": "<p><strong>Calculate</strong> the market value (in $) of Affiliate's equity capital if the yield on its asset portfolio immediately declines by 20 bps.</p>", "num": 7, "feedback": ["Maxwell needs to calculate the modified duration of Affiliate’s equity capital (DE*) using the equation below:<br>DE* = (A/E) DA* – (A/E – 1) DL*(Δi/Δy)<br>where<br>DA*: modified duration of assets DL*: modified duration of liabilities Δi/Δy: % change in yield on liabilities to 1% change in yield on asset portfolio A/E: ratio of assets to equity<br>The vignette provides that DA* = 2.2, DL*= 1.6 and Δi/Δy = 0.75. Also, 10% equity capital ratio (E/A),<br>implies 10 for ratio of assets to equity (1/10% = 10).<br>Therefore<br>DE* = (A/E) DA* – (A/E – 1) DL*(Δi/Δy)<br>DE* = 10*2.2 – 9*1.6*0.75 = 11.2<br>For a 20 bps decline in the yield of asset portfolio, the market value of expected to increase by 2.24% (11.2*0.2%= 2.24%). Therefore, the market value of Affiliate’s equity will become $8,179,200,000 ($8b*1.0224 = $8.1792b)"]}, {"type": "essay", "points": 3, "prompt": "<p><strong>Determine</strong> the most likely effect of the prepayment penalty proposal on the volatility of Affiliate's equity capital. (Decrease, No effect, Increase) <strong>Justify</strong> your response.</p>", "num": 8, "feedback": ["Loan prepayments accelerate when interest rates decline. All else constant, declining interest rates will increase the value of fixed-rate liabilities of the bank and reduce the value of the bank’s equity. Banks can offset this reduction by requiring prepayment penalties on its loans. In other words, increase in the value of liabilities will be offset (at least partially) by an increase in assets of the bank (prepayment penalty). Imposing prepayment penalties strengthens the correlation between the value of Affiliate’s assets and the value of its liabilities, which will lower the volatility of Affiliate’s equity.", "Vignette", "TOPIC: ETHICAL AND PROFESSIONAL STANDARDS TOTAL POINT VALUE OF THIS QUESTION SET IS 12 POINTS", "Adrianne Grayson, CFA, is an equity analyst covering the energy sector for Ellivro Bank. Grayson writes both company research reports and industry sector reports. She is recognized as an expert on the sustainable energy industry. An energy industry trade group that publishes a newsletter on sustainable energy offers Grayson an assignment to write articles, independent of her work at Ellivro. Grayson would receive compensation for each article she writes but the articles would not include stock recommendations. Ellivro allows each equity analyst to trade the securities of the companies they individually cover, provided the analyst does not trade during a 5-day blackout period beginning at the time the analyst's research report on the company is published. Employees are also required to submit all securities holdings for compliance review at the end of each quarter. Moclon Power is a large-cap company covered by Grayson's colleague, Scott Meero, a widely respected analyst. Meero publishes a report in which he changes his recommendation on Moclon to \"sell\". Two days after Meero's report is published, Grayson purchases shares of Moclon in her personal account. Grayson decides to leave Ellivro to start her own independent research firm. At her new firm, Grayson is approached separately by three energy companies to author issuer-paid research reports. The companies make the following compensation offers: Company A: €6,000 per quarter for publishing a minimum of one report each quarter Company B: €1,000 per published report, provided the report is approved by the energy company Company C: €3,000 plus company stock warrants per published report, regardless of the recommendation Grayson notices that there is a lack of coverage on penny stocks in the energy sector, and she wants to increase the visibility of such lesser-known and cheaply priced companies. She creates a weekly newsletter for paid subscribers, providing both fundamental and technical analysis of penny stocks. In the newsletter, Grayson also provides facts and opinions about \"hot\" penny stock picks and other topics that are commonly discussed on popular online trading forums. She notices that, as her subscriber numbers grow, the trading volume of the penny stocks she covers increases."]}]}, {"topic": "ETHICAL AND PROFESSIONAL STANDARDS", "points": 12, "narrative": "<p>Adrianne Grayson, CFA, is an equity analyst covering the energy sector for Ellivro Bank. Grayson writes both company research reports and industry sector reports. She is recognized as an expert on the sustainable energy industry.</p>\n<p>An energy industry trade group that publishes a newsletter on sustainable energy offers Grayson an assignment to write articles, independent of her work at Ellivro. Grayson would receive compensation for each article she writes but the articles would not include stock recommendations.</p>\n<p>Ellivro allows each equity analyst to trade the securities of the companies they individually cover, provided the analyst does not trade during a 5-day blackout period beginning at the time the analyst's research report on the company is published. Employees are also required to submit all securities holdings for compliance review at the end of each quarter.</p>\n<p>Moclon Power is a large-cap company covered by Grayson's colleague, Scott Meero, a widely respected analyst. Meero publishes a report in which he changes his recommendation on Moclon to “sell”. Two days after Meero's report is published, Grayson purchases shares of Moclon in her personal account.</p>\n<p>Grayson decides to leave Ellivro to start her own independent research firm. At her new firm, Grayson is approached separately by three energy companies to author issuer-paid research reports. The companies make the following compensation offers:</p>\n<p>Company A: €6,000 per quarter for publishing a minimum of one report each quarter</p>\n<p>Company B: €1,000 per published report, provided the report is approved by the energy company</p>\n<p>Company C: €3,000 plus company stock warrants per published report, regardless of the recommendation</p>\n<p>Grayson notices that there is a lack of coverage on penny stocks in the energy sector, and she wants to increase the visibility of such lesser-known and cheaply priced companies. She creates a weekly newsletter for paid subscribers, providing both fundamental and technical analysis of penny stocks. In the newsletter, Grayson also provides facts and opinions about “hot” penny stock picks and other topics that are commonly discussed on popular online trading forums. She notices that, as her subscriber numbers grow, the trading volume of the penny stocks she covers increases.</p>", "questions": [{"type": "mc", "points": 1, "prompt": "<p>According to the Standards, must Grayson obtain written consent from Ellivro to accept the offer from the industry trade group?</p>", "choices": ["Yes", "No, because the industry trade group is not a competitor of Ellivro", "No, because she will not make stock recommendations in the articles"], "num": 9, "correctIndex": 0, "correctText": "Yes", "feedback": ["Correct because, according to Standard IV(B) Additional Compensation Arrangements, Members and Candidates must not accept gifts, benefits, compensation, or consideration that competes with or might reasonably be expected to create a conflict of interest with their employer's interest unless they obtain written consent from all parties involved. The assignment for the industry trade group would create a conflict of interest with Ellivro's interest because Grayson would be compensated and the time spent writing articles could detract from her ability to fulfill her responsibilities at Ellivro. Therefore, Grayson must obtain written consent from Ellivro before she can accept the offer."]}, {"type": "mc", "points": 1, "prompt": "<p>Did Grayson comply with the Standards with regard to her recent purchase of Moclon Power shares?</p>", "choices": ["Yes", "No, because her trade was contrary to Ellivro's recommendation", "No, because she purchased the shares less than five days after Meero's report was published"], "num": 10, "correctIndex": 0, "correctText": "Yes", "feedback": ["Correct because, according to Standard VI(B) Priority of Transactions, investment transactions for clients and employers must have priority over investment transactions in which a member or candidate is the beneficial owner. In the case, as per Ellivro's policy, Grayson does not cover Moclon and therefore the blackout period does not apply to her. Furthermore, clients are not disadvantaged by Grayson's purchase when the firm's recommendation is changing to sell."]}, {"type": "mc", "points": 1, "prompt": "<p>According to the Standards, which company's issuer-paid research offer is Grayson permitted to accept?</p>", "choices": ["Company A", "Company B", "Company C"], "num": 11, "correctIndex": 0, "correctText": "Company A", "feedback": ["Correct because, according to Standard I(B) Independence and Objectivity, members and candidates must not offer, solicit, or accept any gift, benefit, compensation, or consideration that reasonably could be expected to compromise their own or another's independence and objectivity. Independent analysts must strictly limit the type of compensation that they accept for conducting issuer-paid research. Best practice is for independent analysts, prior to writing their reports, to negotiate only a flat fee for their work that is not linked to their conclusions or recommendations. In the case, the offer from Company A of a flat quarterly fee has no direct or indirect influence on the conclusions or recommendations of the report."]}, {"type": "mc", "points": 1, "prompt": "<p>With respect to her newsletter covering penny stocks, does Grayson violate the Standard relating to market manipulation?</p>", "choices": ["No", "Yes, because she engages in transaction-based manipulation", "Yes, because she engages in information-based manipulation"], "num": 12, "correctIndex": 0, "correctText": "No", "feedback": ["Correct because, according to Standard II(B) Market Manipulation, members and candidates must not engage in practices that distort prices or artificially inflate trading volume with the intent to mislead market participants. In the case, Grayson does not have an intent to mislead market participants. She does not disseminate false or misleading information (information-based manipulation), as she only provides facts and opinions on the stock picks and related topics found on the trading forums. She also does not engage in transactions that deceive or would be likely to mislead market participants (transaction-based manipulation), even though her newsletter may have led subscribers to trade more in penny stocks."]}]}, {"topic": "PORTFOLIO MANAGEMENT", "points": 12, "narrative": "<p>Shubhi Dash advises institutional investors on index-based equity strategies. She meets with two clients: Sonir Insurance and Kasmi Asset Management.</p>\n<p>Sonir Insurance is a company with incorporation and operations in a jurisdiction that requires realized capital gains and losses in pooled investment vehicles to be passed through to investors. Sonir would like to add a pooled investment vehicle to their investment portfolio that would offer high tax efficiency. Dash considers Sonir using either a mutual fund or an ETF.</p>\n<p>Kasmi Asset Management manages several developed and emerging market index-based equity funds. Dash reviews the performance of Fund 1 and Fund 2. Both use full replication and are benchmarked to the S&P 500. The S&P 500 index had a return of –0.54% over the last 12-month period. Dash gathers the relevant information regarding the two funds in Exhibit 1 to evaluate the outperformance of Fund 2 relative to Fund 1.</p>\n<div class=\"exhibit-title\">Exhibit 1</div>\n<table class=\"exhibit-table\"><tr><td></td><td>Fund 1</td><td>Fund 2</td></tr><tr><td>12-month total return</td><td>–0.60%</td><td>–0.52%</td></tr><tr><td>Cash holdings</td><td>0.12%</td><td>2.13%</td></tr><tr><td>Expense ratio</td><td>0.05%</td><td>0.08%</td></tr></table>\n<p>Kasmi would like to create a new global fund benchmarked to the FTSE Global All Cap Index. The index has over 9,000 constituents and Dash models a full replication of the index. He observes that the tracking error has a pattern where it initially decreases as more stocks are added to the fund, but increases as the fund's portfolio approaches full replication.</p>\n<p>Kasmi's emerging markets index-based equity fund is benchmarked to the MSCI Emerging Markets Index and has built up a cash surplus. The portfolio's beta has drifted away from its target and Dash proposes using one of the following derivatives overlay strategies to fix this deviation:</p>\n<p>Strategy 1: A futures contract on the MSCI Emerging Markets Index</p>\n<p>Strategy 2: An equity index swap, tailored to the MSCI Emerging Markets Index</p>", "questions": [{"type": "essay", "points": 3, "prompt": "<p><strong>Determine</strong> the most suitable pooled investment vehicle for Sonir. (Mutual fund, ETF) <strong>Justify</strong> your response.</p>", "num": 13, "feedback": ["All else equal, for jurisdictions that require capital gains and losses to be passed through to investors like the US, an ETF has greater tax efficiency than a similarly managed mutual fund. Managers of mutual funds must sell their portfolio holdings to fulfill shareholder redemptions, creating a taxable event where gains and losses are realized. ETFs have the advantage of accommodating those redemptions through an in-kind delivery of stock, which is the redemption process. Capital gains are not recorded when a redemption is fulfilled through an in-kind delivery of securities, so the taxable gain/loss passed to the investor becomes smaller."]}, {"type": "essay", "points": 3, "prompt": "<p><strong>Explain</strong> the most likely reason for Fund 2 outperforming Fund 1.</p>", "num": 14, "feedback": ["Fund 2 holds significantly more cash (2.13%) compared to Fund 1 (0.12%). During a period where the S&P 500 generated a negative return (–0.54%), holding a larger proportion of cash would reduce the negative impact on the fund's performance. The effect of cash drag on portfolio value is negative when the market is rising and positive when it is falling. The difference in expense ratios between Fund 1 (0.05%) and Fund 2 (0.08%) is minimal and unlikely to significantly affect performance. The slightly higher expense ratio of Fund 2 would actually slightly reduce its returns, making it an unlikely reason for the outperformance."]}, {"type": "essay", "points": 3, "prompt": "<p><strong>Explain</strong> the most likely reason for the tracking error pattern observed in modeling Kasmi's global fund.</p>", "num": 15, "feedback": ["With respect to the choice between index replication versus sampling, as the number of securities held increases, tracking error decreases because the portfolio gets closer to replicating the index perfectly. Yet as the portfolio manager adds index constituent stocks that are smaller and more thinly traded than average, trading costs increase. The trading costs can take the form of brokerage fees and upward price pressure as a result of the portfolio’s purchases. These transaction costs can depress performance and start to impose a small negative effect on tracking effectiveness. As the portfolio manager moves to the least liquid stocks in the index, transaction costs begin to dominate and tracking error increases again. Thus, for an index that has some constituent securities that are relatively illiquid, the conceptual relationship between tracking error and the number of securities held is U-shaped. Despite their preference to realize the benefits of pure replication of an index, portfolio managers often find it impractical to hold all the constituent securities. Some equity indexes have a large number of constituents, and not all constituents offer high trading liquidity. This can make trading expensive, especially if a portfolio manager needs to scale up the portfolio. Brokerage fees can also become excessive if the number of constituents is large."]}, {"type": "essay", "points": 3, "prompt": "<p><strong>Determine</strong> which derivatives overlay strategy has the lowest liquidity risk. (Strategy 1, Strategy 2) <strong>Justify</strong> your response.</p>", "num": 16, "feedback": ["Equity index swaps are less liquid than futures contracts because they are customized OTC instruments. Equity swaps tend to be non-marketable instruments, so once the agreement is made there is not a highly liquid market that allows them to be sold to another party (though it is usually possible to go back to the dealer and enter into an offsetting position). Futures contracts are highly liquid, with active trading on public exchanges. Among other benefits of futures is the high degree of liquidity in the market, as evidenced by low bid–ask spreads.", "Vignette", "TOPIC: DERIVATIVES AND RISK MANAGEMENT TOTAL POINT VALUE OF THIS QUESTION SET IS 12 POINTS", "Anna Chen is a US-based private wealth advisor. She works with clients to see how they can use derivatives in managing their portfolios. Gary Swan is one of Chen's clients. Swan holds 100,000 shares of RLB Inc. The shares were bought at $53 per share and the stock is currently trading at that same level. Chen has a 3-month price target of $58 per share for RLB. The stock is not expected to pay dividends over the investment horizon. Chen gathers the information on 3-month European-style RLB options in Exhibit 1. Option premiums are stated on a per-share basis. Exhibit 1 Call       Call Implied Call Exercise         Put      Put Implied Put Premium Delta          Volatility    Price Premium Delta         Volatility $13.17 0.991            25%          $40       $0.31   −0.062     40% $8.45      0.913       26%          $45       $0.48   −0.116     30% $4.72      0.697       28%          $50       $1.26   −0.287     25% $2.59      0.448       32%          $55       $3.46   −0.593     23% $1.41      0.247       35%          $60       $7.14   −0.865     21%", "Chen would like to use RLB options to enhance income. She considers the following option strategies in conjunction with the Swan's position in RLB stock: Strategy 1: A short position in a 3-month call with an exercise price of $60 Strategy 2: A short position in a 3-month put with an exercise price of $50 Strategy 3: A short position in a 3-month put with an exercise price of $50 and a long position in a 3-month put with an exercise price of $40. Chen also works with Jennifer Long, a separate client that is interested in executing Strategy 3. Long does not hold any RLB stock and asks Chen to determines the breakeven point of the strategy. Long is also looking to establish a new option position on the stock of Yellow Spider Corp. Based on her expectations of the volatility of its stock price returns, she decides to buy a 3-month straddle on Yellow Spider stock."]}]}, {"topic": "DERIVATIVES AND RISK MANAGEMENT", "points": 12, "narrative": "<p>Anna Chen is a US-based private wealth advisor. She works with clients to see how they can use derivatives in managing their portfolios.</p>\n<p>Gary Swan is one of Chen's clients. Swan holds 100,000 shares of RLB Inc. The shares were bought at $53 per share and the stock is currently trading at that same level. Chen has a 3-month price target of $58 per share for RLB. The stock is not expected to pay dividends over the investment horizon. Chen gathers the information on 3-month European-style RLB options in Exhibit 1. Option premiums are stated on a per-share basis.</p>\n<div class=\"exhibit-title\">Exhibit 1</div>\n<table class=\"exhibit-table\"><tr><td>Call Premium</td><td>Call Delta</td><td>Call Implied Volatility</td><td>Exercise Price</td><td>Put Premium</td><td>Put Delta</td><td>Put Implied Volatility</td></tr><tr><td>$13.17</td><td>0.991</td><td>25%</td><td>$40</td><td>$0.31</td><td>$-0.062$</td><td>40%</td></tr><tr><td>$8.45</td><td>0.913</td><td>26%</td><td>$45</td><td>$0.48</td><td>$-0.116$</td><td>30%</td></tr><tr><td>$4.72</td><td>0.697</td><td>28%</td><td>$50</td><td>$1.26</td><td>$-0.287$</td><td>25%</td></tr><tr><td>$2.59</td><td>0.448</td><td>32%</td><td>$55</td><td>$3.46</td><td>$-0.593$</td><td>23%</td></tr><tr><td>$1.41</td><td>0.247</td><td>35%</td><td>$60</td><td>$7.14</td><td>$-0.865$</td><td>21%</td></tr></table>\n<p>Chen would like to use RLB options to enhance income. She considers the following option strategies in conjunction with the Swan's position in RLB stock:</p>\n<p>Strategy 1: A short position in a 3-month call with an exercise price of $60</p>\n<p>Strategy 2: A short position in a 3-month put with an exercise price of $50</p>\n<p>Strategy 3: A short position in a 3-month put with an exercise price of $50 and a long position in a 3-month put with an exercise price of $40.</p>\n<p>Chen also works with Jennifer Long, a separate client that is interested in executing Strategy 3. Long does not hold any RLB stock and asks Chen to determine the breakeven point of the strategy.</p>\n<p>Long is also looking to establish a new option position on the stock of Yellow Spider Corp. Based on her expectations of the volatility of its stock price returns, she decides to buy a 3-month straddle on Yellow Spider stock.</p>", "questions": [{"type": "mc", "points": 1, "prompt": "<p>Assuming RLB is at Chen's target price in three months, what is the gain to the Swan's position if he uses Strategy 1?</p>", "choices": ["$5.00", "$6.41", "$8.41"], "num": 17, "correctIndex": 1, "correctText": "$6.41", "feedback": ["Correct because the gain in Strategy 1 is calculated as:<br>Gain per share = $58 – $53 + $1.41 = $6.41<br>The gain consists of a premium of $1.41 on the short call option position plus the increase in the value of the stock. Since the value of the stock at expiration ($58) is lower than the call strike price of $60, the option expires worthless. The gain per share on the covered call is therefore $6.41. At expiration, Swan still holds the security and has been able to generate an additional $1.41 in cash proceeds from the option premium."]}, {"type": "mc", "points": 1, "prompt": "<p>Which strategy considered by Chen is most sensitive to changes in the price of RLB stock?</p>", "choices": ["Strategy 1", "Strategy 2", "Strategy 3"], "num": 18, "correctIndex": 1, "correctText": "Strategy 2", "feedback": ["Correct because of the three strategies, Strategy 2 (selling a put option on RLB shares) will maximize the sensitivity of the combined position to changes in the price of RLB, as represented by the delta of the combined position. The delta of the combined position can be calculated as: Delta RLB – Delta put option = 1 – (–0.287) = 1.287"]}, {"type": "mc", "points": 1, "prompt": "<p>What is the breakeven price per share at expiration if Long executes Strategy 3?</p>", "choices": ["$49.05", "$50.95", "$51.43"], "num": 19, "correctIndex": 0, "correctText": "$49.05", "feedback": ["Correct because a bull spread with put options consists of buying a put option with a lower strike price and writing a put option with a higher strike price. In this case, the bull spread consists of buying a put option with a strike price of $40 and writing a put option with a strike price of $50. The breakeven price of the combined position is calculated as: Breakeven price (correct) = $50 – 1.26 + $0.31 = $49.05"]}, {"type": "mc", "points": 1, "prompt": "<p>Chen's option strategy for Yellow Spider is consistent with an expectation that the volatility of its stock returns will be:</p>", "choices": ["below the market consensus.", "equal to the market consensus.", "above the market consensus."], "num": 20, "correctIndex": 2, "correctText": "above the market consensus.", "feedback": ["Correct because a straddle consists of an option combination in which one buys both puts and calls with the same exercise price and same expiration date, on the same underlying asset. A long straddle expresses the view that volatility will increase more than the market consensus. A long straddle would be an appropriate strategy if there is an expectation that underlying stock return volatility will increase more than the market consensus."]}]}, {"topic": "ASSET ALLOCATION", "points": 12, "narrative": "<p>Fabrice McNeal is an investment consultant. McNeal is meeting with representatives of two clients, DBF Foundation and JMK Endowment Fund.</p>\n<p><strong>DBF Foundation</strong></p>\n<p>DBF is a charitable foundation that uses external managers for investment management. McNeal evaluates the following three governance practices of the foundation:</p>\n<p>Practice 1: External managers provide input on the asset allocation policy; the policy is drafted by DBF's investment staff and approved by DBF's investment committee.</p>\n<p>Practice 2: External managers provide risk management infrastructure to DBF, including reporting of key indicators that show when risk limits are breached.</p>\n<p>Practice 3: For governance audit purposes, an external auditor evaluates the investment portfolio for its efficiency given any constraints within DBF's governing documents.</p>\n<p>DBF's investment objective is to achieve an expected nominal return of 7.50% per year, while minimizing the standard deviation of returns. The nominal risk-free rate is 3.00%. After separating out the risk-free asset, McNeal uses mean–variance optimization to determine an efficient frontier of risky assets. Corner portfolios on the risky-asset efficient frontier are shown in Exhibit 1.</p>\n<div class=\"exhibit-title\">Exhibit 1</div>\n<table class=\"exhibit-table\"><tr><td>Corner Portfolio</td><td>Expected Nominal Return</td><td>Standard Deviation</td></tr><tr><td>1</td><td>10.30%</td><td>21.75%</td></tr><tr><td>2</td><td>9.60%</td><td>17.50%</td></tr><tr><td>3</td><td>8.20%</td><td>15.25%</td></tr></table>\n<p><strong>JMK Endowment Fund</strong></p>\n<p>McNeal prepares a risk-budgeting analysis for JMK's investment portfolio. He calculates the marginal contribution to total risk (MCTR) and the absolute contribution to total risk (ACTR) for each asset class. Results are shown in Exhibit 2. The nominal risk-free rate is 3.00% and the Sharpe ratio of the tangency portfolio from a mean–variance optimization is 0.25.</p>\n<div class=\"exhibit-title\">Exhibit 2</div>\n<table class=\"exhibit-table\"><tr><td>Asset Class</td><td>Weight</td><td>Expected Return</td><td>MCTR</td><td>ACTR</td></tr><tr><td>Bonds</td><td>51%</td><td>5.00%</td><td>8.00%</td><td>4.08%</td></tr><tr><td>Domestic equities</td><td>35%</td><td>14.00%</td><td>44.00%</td><td>15.40%</td></tr><tr><td>International equities</td><td>14%</td><td>8.00%</td><td>20.00%</td><td>2.80%</td></tr></table>", "questions": [{"type": "essay", "points": 3, "prompt": "<p><strong>Determine</strong> one practice of DBF that is not consistent with effective investment governance. (Practice 1, Practice 2, Practice 3) <strong>Explain</strong> how this governance practice should be changed.</p>", "num": 21, "feedback": ["Practice 2 is not consistent with effective investment governance because DBF's investment staff, not external managers, should create the risk management infrastructure and design risk reporting. Regarding responsibility for risk management, effective investment governance is that a third-party resource (i.e., an external manager) manages the portfolio within established risk guidelines, consultants may provide input and support, and the investment staff should create the risk management infrastructure and design reporting. Practice 1 is consistent with effective investment governance because the governance layers are respected: investment staff drafts the asset allocation policy with input from external managers, and the investment committee approves the policy. Practice 3 is consistent with effective investment governance because the governance auditor examines the fund’s governing documents, assesses the capacity of the organization to execute effectively within the confines of those governing documents, and evaluates the existing portfolio for its efficiency given the governance constraints."]}, {"type": "essay", "points": 5, "prompt": "<p><strong>Determine</strong> the corner portfolio McNeal should use to meet DBF's investment objective. (Portfolio 1, Portfolio 2, Portfolio 3) <strong>Calculate</strong> the percentage of DBF's assets that should be allocated to this corner portfolio.</p>", "num": 22, "feedback": ["Portfolio 2 has the highest Sharpe ratio of the three corner portfolios in Exhibit 1:<br>Portfolio 1 = (10.3% – 3.0%) / 21.75% = 0.336<br>Portfolio 2 = (9.6% – 3.0%) / 17.50% = 0.377<br>Portfolio 3 = (8.2% – 3.0%) / 15.25% = 0.341<br>Therefore, Portfolio 2, when combined with the risk-free asset, will create an optimal portfolio which minimizes standard deviation at a given level of expected return. The allocation to Portfolio 2 is calculated as follows: 7.5% = 9.6% × w + 3.0% × (1 – w)<br>where<br>7.5% = the expected return objective 9.6% = the expected return on Portfolio 2<br>w = weight of Portfolio 2 in the optimal asset allocation<br>(1 – w) = weight of the risk-free asset in the optimal asset allocation<br>Therefore:<br>7.5 = 9.6w + 3.0 – 3.0w 4.5 = 6.6w<br>w = 4.5 / 6.6 = 0.6818 ≈ 0.682<br>The optimal portfolio will have a 68.2% allocation to Portfolio 2 and a 31.8% allocation to the risk-free asset (1 – 0.682). It will have an expected return of 7.5% and a standard deviation of 11.93% (0.6818 × 17.5%), as the risk-free asset has zero standard deviation."]}, {"type": "essay", "points": 4, "prompt": "<p><strong>Determine</strong> if the asset allocation of JMK's portfolio is optimal from a risk-budgeting perspective. (Optimal, Not optimal) <strong>Justify</strong> your response.</p>", "num": 23, "feedback": ["The ratio of excess return to MCTR is calculated for each asset class as follows: Bonds: (5.00% – 3.00%) / 0.08 = 0.25 Domestic equities: (14.00% – 3.00%) / 0.44 = 0.25 International equities: (8.00% – 3.00%) / 0.20 = 0.25 The vignette states that the Sharpe ratio of the tangency portfolio from a mean–variance optimization is also 0.25. Therefore, the asset allocation is optimal from a risk-budgeting perspective because the ratio of excess return to MCTR is the same for all three asset classes and matches the Sharpe ratio of the tangency portfolio. An asset allocation is optimal from a risk-budgeting perspective when the ratio of excess return (over the risk-free rate) to MCTR is the same for all assets and matches the Sharpe ratio of the tangency portfolio.", "Vignette", "TOPIC: PORTFOLIO CONSTRUCTION TOTAL POINT VALUE OF THIS QUESTION SET IS 12 POINTS", "Jim Wayne is a portfolio manager at Global Investment Advisors (GIA). Recently, Wayne hired Sara Brown, who just completed her 12-month rotational program. Wayne and Brown are meeting to discuss the fixed- income markets and how their team will be advising clients. During the meeting, Brown inquires about Wayne’s method for calculating the expected return of a bond portfolio. Wayne explains the various return components that contribute to the total expected return of a bond portfolio and then provides an example using the portfolio of a client, the EZ Company. Selected data for EZ Company’s bond portfolio is provided in Exhibit 1. Exhibit 1 Average bond coupon payment (per $100 par value)            $6.75 Coupon frequency                                            Annual Investment horizon                                          1 year Current average bond price                                  $94.20 Expected average bond price in one year (assuming $97.35 an unchanged yield curve)", "Average bond convexity in one year                           18 Average bond modified duration in one year                  3.70 Expected change in average benchmark YTM                   0.26% Expected change in spread                                 –0.10% Market volatility has increased over the past several months due to the expectation that the central bank will raise interest rates. Wayne wants to discuss a portfolio strategy he could use to best balance his clients’ portfolios against the two main sources of interest rate risk: cash flow reinvestment risk and market price risk. Wayne states that many of GIA’s clients have fixed-income portfolios that are constructed to immunize future liabilities. Brown tells Wayne that she recalls this topic from her rotational program and makes the following comments: Comment 1: Effective duration must be used to estimate the interest rate sensitivity of Type II, III, and IV liabilities. Comment 2: To maximize convexity, a manager should use a laddered strategy rather than a bullet or a barbell strategy to build a client's fixed-income portfolio."]}]}, {"topic": "PORTFOLIO CONSTRUCTION", "points": 12, "narrative": "<p>Jim Wayne is a portfolio manager at Global Investment Advisors (GIA). Recently, Wayne hired Sara Brown, who just completed her 12-month rotational program. Wayne and Brown are meeting to discuss the fixed-income markets and how their team will be advising clients.</p>\n<p>During the meeting, Brown inquires about Wayne's method for calculating the expected return of a bond portfolio. Wayne explains the various return components that contribute to the total expected return of a bond portfolio and then provides an example using the portfolio of a client, the EZ Company. Selected data for EZ Company's bond portfolio is provided in Exhibit 1.</p>\n<div class=\"exhibit-title\">Exhibit 1</div>\n<table class=\"exhibit-table\"><tr><td>Average bond coupon payment (per $100 par value)</td><td>$6.75</td></tr><tr><td>Coupon frequency</td><td>Annual</td></tr><tr><td>Investment horizon</td><td>1 year</td></tr><tr><td>Current average bond price</td><td>$94.20</td></tr><tr><td>Expected average bond price in one year (assuming an unchanged yield curve)</td><td>$97.35</td></tr><tr><td>Average bond convexity in one year</td><td>18</td></tr><tr><td>Average bond modified duration in one year</td><td>3.70</td></tr><tr><td>Expected change in average benchmark YTM</td><td>0.26%</td></tr><tr><td>Expected change in spread</td><td>–0.10%</td></tr></table>\n<p>Market volatility has increased over the past several months due to the expectation that the central bank will raise interest rates. Wayne wants to discuss a portfolio strategy he could use to best balance his clients' portfolios against the two main sources of interest rate risk: cash flow reinvestment risk and market price risk.</p>\n<p>Wayne states that many of GIA's clients have fixed-income portfolios that are constructed to immunize future liabilities. Brown tells Wayne that she recalls this topic from her rotational program and makes the following comments:</p>\n<p>Comment 1: Effective duration must be used to estimate the interest rate sensitivity of Type II, III, and IV liabilities.</p>\n<p>Comment 2: To maximize convexity, a manager should use a laddered strategy rather than a bullet or a barbell strategy to build a client's fixed-income portfolio.</p>", "questions": [{"type": "mc", "points": 1, "prompt": "<p>The expected rolling yield of EZ Company's bond portfolio over the one-year investment horizon is closest to:</p>", "choices": ["9.17%.", "10.09%.", "10.51%."], "num": 24, "correctIndex": 2, "correctText": "10.51%.", "feedback": ["Correct. The rolling yield is the sum of the coupon income (return) and the rolldown return:<br>Rolling yield = Coupon income (current yield) + Rolldown return<br>Coupon income = Annual coupon payment / Current bond price<br>= $6.75 / $94.20 = 7.17%<br>Rolldown return = Change in bond price over the one-year investment horizon (assuming an unchanged<br>yield curve) / Current bond price<br>= $97.35 – $94.20 / $94.20 = 3.34%<br>Rolling yield = 7.17% + 3.34% = 10.51%"]}, {"type": "mc", "points": 1, "prompt": "<p>The combined expected return for EZ Company's bond portfolio due to the expected changes in benchmark YTM and spread is closest to:</p>", "choices": ["–1.49%.", "–0.59%.", "0.60%."], "num": 25, "correctIndex": 1, "correctText": "–0.59%.", "feedback": ["Correct because the components of expected return due to the expected changes in benchmark YTM and spread are calculated as follows: Expected return due to change in benchmark YTM = (−ModDur × ΔYield) + [0.5 × Convexity × (ΔYield)2]", "= (−3.70 × 0.0026) + [0.5 × 18 × (0.0026)2]<br>= –0.96%<br>Expected return due to change in spread = (−ModDur × ΔSpread) + [0.5 × Convexity × (ΔSpread)2]<br>= (–3.70 × –0.0010) + [0.5 × 18 × (–0.0010)2]<br>= 0.37%<br>Combined expected return due to expected changes in benchmark YTM and spread = –0.96% + 0.37% = –0.59%"]}, {"type": "mc", "points": 1, "prompt": "<p>Given his objective related to the two main sources of interest rate risk, which of the following strategies should Wayne recommend to his clients?</p>", "choices": ["Bullet portfolio", "Barbell portfolio", "Laddered portfolio"], "num": 26, "correctIndex": 2, "correctText": "Laddered portfolio", "feedback": ["Correct. The benefit of using a laddered portfolio is the “diversification” that it provides over time. In comparison to a bullet or a barbell portfolio, the investor gains a balanced position between the two sources of interest rate risk: reinvestment risk (for interest and principal payments received) and market price risk."]}, {"type": "mc", "points": 1, "prompt": "<p>Is either of Brown's comments most likely correct?</p>", "choices": ["No", "Yes, Comment 1 is correct", "Yes, Comment 2 is correct"], "num": 27, "correctIndex": 1, "correctText": "Yes, Comment 1 is correct", "feedback": ["Correct because Comment 1 is correct. Effective duration must be used when modeling Type II, III, and IV liabilities."]}]}, {"topic": "DERIVATIVES AND RISK MANAGEMENT", "points": 12, "narrative": "<p>Jacob Smith is a financial advisor meeting with two US-based clients. Both clients have a global equity mandate and most of their non-US investments are denominated in EUR and GBP.</p>\n<p><strong>Client A</strong></p>\n<p>Client A has inherited USD 100,000 and wants to use these assets to invest in an emerging market. Smith tells the client that carry trades between the USD and certain emerging market countries currently appear attractive. He reviews the data for three emerging countries in Exhibit 1 and recommends implementing a carry trade between one of the countries' currencies and the USD. The 1-year US interest rate is 1%.</p>\n<div class=\"exhibit-title\">Exhibit 1</div>\n<table class=\"exhibit-table\"><tr><td></td><td>Country X</td><td>Country Y</td><td>Country Z</td></tr><tr><td>1-year interest rate</td><td>5%</td><td>6%</td><td>7%</td></tr><tr><td>Exchange rate Bid/Ask (number of USD per 1 unit of local currency)</td><td>0.5000 / 0.5100</td><td>0.2000 / 0.2100</td><td>0.0200 / 0.0220</td></tr><tr><td>Annual exchange rate volatility</td><td>15%</td><td>15%</td><td>20%</td></tr></table>\n<p>Smith and Client A next discuss the performance of the client's UK equity investments. The beginning and ending values of Client A's GBP-denominated investments for the most recent year, along with selected market data, are shown in Exhibit 2. There were no cash flows into or out of the portfolio during the year. Client A asks what his return would have been for the year if the GBP was unhedged.</p>\n<div class=\"exhibit-title\">Exhibit 2</div>\n<table class=\"exhibit-table\"><tr><td></td><td>Beginning of Year</td><td>End of Year</td></tr><tr><td>Value of investments</td><td>GBP 100,000</td><td>GBP 110,000</td></tr><tr><td>USD/GBP spot exchange rate</td><td>1.2500</td><td>1.4286</td></tr><tr><td>12-month forward points</td><td>10</td><td>9</td></tr></table>\n<p><strong>Client B</strong></p>\n<p>Client B has a GBP-denominated equity portfolio. Given the volatility of this portfolio, Smith rebalances the currency hedge each month using forward contracts. Smith chooses between hedge ratios of 90%, 100%, and 110% each month to best take advantage of his short-term USD/GBP forecast. Today, last month's hedge settles and the portfolio is valued at GBP 1,100,000. Smith believes that the GBP will appreciate against the USD over the next month and decides what new hedge to put in place.</p>", "questions": [{"type": "essay", "points": 5, "prompt": "<p><strong>Identify</strong> which emerging market's currency is most appropriate for Client A's carry trade with the USD. (Country X, Country Y, Country Z) <strong>Justify</strong> your response with two reasons. <em>Note: Each justification should be in a separate paragraph.</em></p>", "num": 28, "feedback": ["Smith should select Country X for the carry trade. With a US rate of 1% per year and a Country X rate of 5%, there is the potential for a 4% excess return on the carry trade (if the exchange rate does not change). Country X has the lowest bid/ask spread (0.50/0.51 or 0.01/0.50 = 2%) of the three", "countries, and there would still be a 2% potential excess return after deducting the spread from the interest rate differential. While the other two countries have higher potential returns from the carry trade (Country Y has a rate of 6% and a potential excess return of 5%, Country Z has a rate of 7% and a potential excess return of 6%), their respective bid-ask spreads of 5% and 10% would easily wipe out any potential profit on the trade – after accounting for the spread, the potential excess return would be 0% for Country Y and –4% for Country Z. Country X also has the lowest annual volatility (tied with Y and lower than Z), and this is important as a carry trade exposes Smith to currency risk."]}, {"type": "essay", "points": 3, "prompt": "<p><strong>Calculate</strong> the USD return of Client A's GBP-denominated investments for the most recent year if the GBP were unhedged.</p>", "num": 29, "feedback": ["In foreign currency (GBP) terms, the portfolio return is (110,000 – 100,000)/100,000 = 10%. The currency return (P/B), where the price currency, P, is the USD, and the base currency, B, is the GBP, is: (1.4286 – 1.25)/1.25 = 14.288%<br>RDC = (1 + RFC)(1+RFX) – 1<br>RDC = (1.10)(1.14288) – 1 = 0.257168 or 25.72%<br>Alternatively, candidates might add the currency return and the GBP asset return as follows: 14.288% + 10% = 24.288% ≈ 24.29%"]}, {"type": "essay", "points": 4, "prompt": "<p><strong>Determine</strong> which of the following hedge ratios Smith should use to rebalance Client B's GBP-denominated equity portfolio. (90%, 100%, 110%) <strong>Justify</strong> your response.</p>", "num": 30, "feedback": ["A hedge ratio of 90% (i.e., sell less than GBP 1,100,000 forward) will profit from an appreciating GBP. Client B is long GBP in his equity investment and a hedge ratio of 90% will lock in the current 1-month forward rate on only 90% × 1,100,000 = GBP 990,000, and the remaining exposure of GBP 110,000 will be valued at a higher exchange rate against the USD in one month if Smith’s forecast is correct. Relative to a full hedge (100% hedge ratio), Client B's equity portfolio will outperform. If Smith uses a hedge ratio of 100%, the entire portfolio would be locked in at the current 1-month forward rate and thus would not benefit from the appreciation in the GBP. A hedge ratio of 110% would lock in 110% of the portfolio value at the current 1-month forward rate, which would be lower than the rate Smith expects at the end of the month – so a 110% hedge ratio would underperform relative to a full hedge.", "Vignette", "TOPIC: PORTFOLIO MANAGEMENT TOTAL POINT VALUE OF THIS QUESTION SET IS 12 POINTS", "Leah Pham is a portfolio manager at a large UK-based asset management firm. She is reviewing the firm's long-only Equities Fund (the EQ Fund) and the new market-neutral Long/Short Fund (the LS Fund). The EQ Fund has €2.2 billion of assets under management (AUM). The maximum position size in an individual stock is determined by three independent constraints: Allocation: 0.4% of the fund's AUM Liquidity: 10% of the stock's average daily trading volume Index weight: 10 times the stock's weight in the benchmark index Pham is reviewing Slava Corporation, which has a market capitalization of €1.2 billion and a weight in the EQ Fund's benchmark index of 0.017%. The average daily trading volume is 1% of Slava's market capitalization. Pham determines the EQ Fund's maximum position size in Slava. Next, Pham examines the three companies in Exhibit 1 based on a growth-at-a-reasonable-price (GARP) approach. Exhibit 1 12-month       3-year Annual EPS Share Price Forward EPS        Growth Forecast Company A            €7                €1.0                 5% Company B            €6                €0.5                12% Company C           €16                €2.0                10% The EQ Fund is fully invested in equities, but is considering an allocation to cash. Pham collects in Exhibit 2 the absolute risk and active risk of the current portfolio and three alternative portfolios. Each alternative portfolio has the same relative weighting of individual equities and differs only in its allocation to cash. Exhibit 2 Current Allocation Portfolio 1             Portfolio 2       Portfolio 3 Absolute risk          9.5%                11.0%         7.5%            8.9% Active risk            2.5%                 1.7%         5.6%            2.1% Pham is preparing marketing materials for the LS Fund. She wishes to include investment characteristics that would be achieved by this fund, and considers the following list:", "Characteristic 1: A net exposure that is greater than 100% Characteristic 2: Lower implementation costs than for a long-only portfolio Characteristic 3: A greater ability to diversify across risk factors than with a long- only portfolio"]}]}, {"topic": "PORTFOLIO MANAGEMENT", "points": 12, "narrative": "<p>Leah Pham is a portfolio manager at a large UK-based asset management firm. She is reviewing the firm's long-only Equities Fund (the EQ Fund) and the new market-neutral Long/Short Fund (the LS Fund).</p>\n<p>The EQ Fund has €2.2 billion of assets under management (AUM). The maximum position size in an individual stock is determined by three independent constraints:</p>\n<p>Allocation: 0.4% of the fund's AUM</p>\n<p>Liquidity: 10% of the stock's average daily trading volume</p>\n<p>Index weight: 10 times the stock's weight in the benchmark index</p>\n<p>Pham is reviewing Slava Corporation, which has a market capitalization of €1.2 billion and a weight in the EQ Fund's benchmark index of 0.017%. The average daily trading volume is 1% of Slava's market capitalization. Pham determines the EQ Fund's maximum position size in Slava.</p>\n<p>Next, Pham examines the three companies in Exhibit 1 based on a growth-at-a-reasonable-price (GARP) approach.</p>\n<div class=\"exhibit-title\">Exhibit 1</div>\n<table class=\"exhibit-table\"><tr><td>Company</td><td>Share Price</td><td>12-month Forward EPS</td><td>3-year Annual EPS Growth Forecast</td></tr><tr><td>A</td><td>€7</td><td>€1.0</td><td>5%</td></tr><tr><td>B</td><td>€6</td><td>€0.5</td><td>12%</td></tr><tr><td>C</td><td>€16</td><td>€2.0</td><td>10%</td></tr></table>\n<p>The EQ Fund is fully invested in equities, but is considering an allocation to cash. Pham collects in Exhibit 2 the absolute risk and active risk of the current portfolio and three alternative portfolios. Each alternative portfolio has the same relative weighting of individual equities and differs only in its allocation to cash.</p>\n<div class=\"exhibit-title\">Exhibit 2</div>\n<table class=\"exhibit-table\"><tr><td></td><td>Current Allocation</td><td>Portfolio 1</td><td>Portfolio 2</td><td>Portfolio 3</td></tr><tr><td>Absolute risk</td><td>9.5%</td><td>11.0%</td><td>7.5%</td><td>8.9%</td></tr><tr><td>Active risk</td><td>2.5%</td><td>1.7%</td><td>5.6%</td><td>2.1%</td></tr></table>\n<p>Pham is preparing marketing materials for the LS Fund. She wishes to include investment characteristics that would be achieved by this fund, and considers the following list:</p>\n<p>Characteristic 1: A net exposure that is greater than 100%</p>\n<p>Characteristic 2: Lower implementation costs than for a long-only portfolio</p>\n<p>Characteristic 3: A greater ability to diversify across risk factors than with a long-only portfolio</p>", "questions": [{"type": "mc", "points": 1, "prompt": "<p>Given the three constraints, the EQ Fund's maximum position size in Slava is:</p>", "choices": ["€1.2 million.", "€3.7 million.", "€8.8 million."], "num": 31, "correctIndex": 0, "correctText": "€1.2 million.", "feedback": ["Correct because the liquidity condition (average daily volume or ADV) gives the lowest amount for the maximum position size. Under the conditions of each of the constraints, the maximum position size is determined as follows: Liquidity: 10% of the ADV. The ADV is 1% of Slava's market cap, i.e., 1% of EUR 1.2 billion, so EUR 12 million. 10% of the ADV is therefore EUR 1.2 million. Allocation: 0.4% of AUM. AUM is EUR 2.2 billion, and 0.4% of this amount is EUR 8.8 million. Index weight: The security's weight in the index is 0.017%. Therefore, the maximum is given by (10 times 0.017%) × EUR 2.2 billion = EUR 3.74 or approximately 3.7 million. Therefore, since liquidity gives the lowest amount, EUR 1.2 million is the correct answer."]}, {"type": "mc", "points": 1, "prompt": "<p>Based on the PEG ratio, which of the following stocks that Pham examines would be most attractive?</p>", "choices": ["Company A", "Company B", "Company C"], "num": 32, "correctIndex": 2, "correctText": "Company C", "feedback": ["Correct because Company C has the lowest P/E to growth (PEG) ratio of the three. The PEG ratio is the stock's P/E divided by the expected earnings growth rate. For Company C the P/E is 16/2 = 8. The expected earnings growth rate is 10%, so the PEG ratio is 8/10 = 0.8. The P/E ratio for Company A is 7/1 = 7. The expected earnings growth rate is 5%, so the PEG ratio is 7/5 = 1.4.", "The P/E ratio for Company B is 6/0.5 = 12. The expected earnings growth rate is 12%, so the PEG ratio is 12/12 = 1.0. Therefore, Company C has the lowest PEG ratio."]}, {"type": "mc", "points": 1, "prompt": "<p>Which of the alternative portfolios for the EQ Fund likely has the highest allocation to cash?</p>", "choices": ["Portfolio 1", "Portfolio 2", "Portfolio 3"], "num": 33, "correctIndex": 1, "correctText": "Portfolio 2", "feedback": ["Correct because cash has a low volatility and a low correlation of returns with any asset. Therefore, it will contribute to a reduction in absolute risk (as compared with the original allocation); however, because of the low correlation with the equity benchmark of the portfolio, it will contribute to higher active risk. Allocation 2 is the only of the three where the absolute risk has fallen and the active risk has risen, which is exactly what a significant new cash allocation would result in."]}, {"type": "mc", "points": 1, "prompt": "<p>Which of the characteristics from Pham's list would most likely be achieved by the LS Fund?</p>", "choices": ["Characteristic 1", "Characteristic 2", "Characteristic 3"], "num": 34, "correctIndex": 2, "correctText": "Characteristic 3", "feedback": ["Correct because, unlike a long-only manager, a long/short manager is able to profit from stocks which they believe will decline. Long/short strategies do not impose a limit to how much they can underweight stocks and sectors relative to a benchmark. Being able to take short positions enables a greater degree of freedom in underweighting. This ability to use both positive and negative insights more fully is a significant benefit. Advantages of long/short investing are:", "efficient use of leverage and of the benefits of diversification and the combination of long and short positions that allow for a greater diversification potential.", "The ability to tilt a portfolio in favor of these other factors (other than the Market factor) or diversify efficiently across factors is structurally restricted in a long-only portfolio. Because the average of cross correlations among rewarded factors is close to zero or even negative, efficiently allocating across factors could bring significant diversification benefits. But the ability to reduce overall risk and to distribute sources of risk more evenly cannot be optimally achieved without short selling. In addition, if the manager is able to use long and short positions to reduce the overall volatility of the portfolio, they would raise the information ratio (by lowering the denominator)."]}]}, {"topic": "PERFORMANCE MEASUREMENT", "points": 12, "narrative": "<p>Lucas Toldo is an investment consultant for an endowment that supports marine life research. He is evaluating two portfolios held by the endowment: an equity portfolio (Atlantic) and a fixed income portfolio (Pacific). Both are actively managed by external managers. Toldo prepares a macro attribution analysis for each portfolio to explain to the endowment's board how performance was achieved over the past year.</p>\n<p><strong>Atlantic Portfolio</strong></p>\n<p>Toldo uses the Carhart model to quantify the impact of investment decisions by considering the sensitivity of Atlantic to market (RMRF), size (SMB), value (HML), and momentum (WML) factors. He determines the active return for the portfolio was 3.12%. Toldo presents factor attribution results in Exhibit 1 to the endowment's board.</p>\n<div class=\"exhibit-title\">Exhibit 1</div>\n<table class=\"exhibit-table\"><tr><td>Factor</td><td>Portfolio Sensitivity</td><td>Benchmark Sensitivity</td><td>Difference</td><td>Return</td></tr><tr><td>RMRF</td><td>1.04</td><td>1.00</td><td>0.04</td><td>3.40%</td></tr><tr><td>SMB</td><td>0.17</td><td>0.28</td><td>–0.11</td><td>–4.90%</td></tr><tr><td>HML</td><td>–0.12</td><td>–0.07</td><td>–0.05</td><td>5.02%</td></tr><tr><td>WML</td><td>–0.10</td><td>0.21</td><td>–0.31</td><td>–7.08%</td></tr></table>\n<p>Toldo explains that the Atlantic manager's strategy relies on a market pricing inefficiency. The board asks whether the inefficiency can last long enough to support future investment performance. To address the board's question, Toldo considers what characteristics he should evaluate in assessing the manager's capacity to use the market pricing inefficiency in its strategy.</p>\n<p><strong>Pacific Portfolio</strong></p>\n<p>Next, Toldo analyzes the interest rate and sector allocation decisions made by Pacific's manager during a period when the yield curve was upward sloping. During the evaluation period:</p>\n<p>The portfolio held only government and corporate bonds.</p>\n<p>The manager was overweight the short end of the curve and the corporate sector.</p>\n<p>The portfolio benchmark had positive returns in each duration bucket.</p>\n<p>The portfolio's duration is 8.32 and the benchmark's duration is 9.15. Toldo presents the attribution results in Exhibit 2.</p>\n<div class=\"exhibit-title\">Exhibit 2</div>\n<table class=\"exhibit-table\"><tr><td>Duration Effect</td><td>Curve Effect</td><td>Total Interest Rate Allocation
