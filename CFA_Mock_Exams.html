ll in predicting and timing short-term market moves away from the expected outcome for each asset class that is embedded in the strategic asset allocation (SAA) policy portfolio. In practice, discretionary TAA is typically used in an attempt to mitigate or hedge risk in distressed markets while enhancing return in positive return markets (i.e., an asymmetric return distribution).", "Retake"]}]}]}];
</script>
<script>
(function(){
  "use strict";

  let currentExamId = EXAM_DATA[0].id;
  let timerInterval = null;
  const expandState = {}; // examId -> { vi: boolean(expanded) }

  function stateKey(examId){ return 'cfaExamState_' + examId; }

  function loadState(examId){
    try{
      const raw = localStorage.getItem(stateKey(examId));
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return { answers: {}, submitted: false, startTime: Date.now(), elapsed: 0, highlights: [], pos: {vi:0, qi:0} };
  }
  function saveState(examId, state){
    localStorage.setItem(stateKey(examId), JSON.stringify(state));
  }

  const states = {};
  EXAM_DATA.forEach(e => {
    states[e.id] = loadState(e.id);
    if(!states[e.id].highlights) states[e.id].highlights = [];
    if(!states[e.id].answers) states[e.id].answers = {};
    if(!states[e.id].pos) states[e.id].pos = {vi:0, qi:0};
    expandState[e.id] = {};
  });

  function getAnswer(examId, qnum){
    const st = states[examId];
    if(!st.answers[qnum]) st.answers[qnum] = {};
    return st.answers[qnum];
  }

  function getItems(exam){
    if(exam._items) return exam._items;
    const items = [];
    exam.vignettes.forEach((v, vi) => {
      v.questions.forEach((q, qi) => items.push({ vi, qi, q }));
    });
    exam._items = items;
    return items;
  }

  function isAnswered(examId, q){
    const ans = getAnswer(examId, q.num);
    if(q.type === 'mc') return ans.selected !== undefined && ans.selected !== null;
    const txt = (ans.essayText || '').replace(/<[^>]*>/g,'').trim();
    return txt.length > 0;
  }

  function buildTabs(){
    const tabWrap = document.getElementById('examTabs');
    EXAM_DATA.forEach(exam => {
      const b = document.createElement('button');
      b.className = 'examTab' + (exam.id === currentExamId ? ' active' : '');
      b.textContent = exam.id;
      b.dataset.examId = exam.id;
      b.addEventListener('click', () => switchExam(exam.id));
      tabWrap.appendChild(b);
    });
  }

  function pauseTimer(examId){
    const st = states[examId];
    if(!st.submitted){
      st.elapsed += Math.floor((Date.now()-st.startTime)/1000);
    }
    st.startTime = Date.now();
    saveState(examId, st);
  }
  function resumeTimer(examId){
    states[examId].startTime = Date.now();
  }

  function switchExam(examId){
    if(currentExamId !== examId) pauseTimer(currentExamId);
    currentExamId = examId;
    resumeTimer(examId);
    document.querySelectorAll('.examTab').forEach(b=>{
      b.classList.toggle('active', b.dataset.examId === examId);
    });
    document.querySelectorAll('.examPanel').forEach(p=>{
      p.classList.toggle('active', p.dataset.examId === examId);
    });
    updateTopBar(examId);
    updateScoreBadge();
  }

  function fmtTime(sec){
    const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = Math.floor(sec%60);
    const pad = n => String(n).padStart(2,'0');
    return pad(h)+':'+pad(m)+':'+pad(s);
  }

  function startTimer(){
    if(timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(()=>{
      const st = states[currentExamId];
      const elapsed = st.submitted ? st.elapsed : st.elapsed + Math.floor((Date.now()-st.startTime)/1000);
      const el = document.querySelector('.examPanel[data-exam-id="'+currentExamId+'"] [data-role="timerVal"]');
      if(el) el.textContent = fmtTime(elapsed);
    }, 1000);
  }

  function clampScore(v, max){
    v = parseFloat(v);
    if(isNaN(v)) v = 0;
    if(v < 0) v = 0;
    if(v > max) v = max;
    return v;
  }

  function computeExamScore(examId){
    const exam = EXAM_DATA.find(e=>e.id===examId);
    const st = states[examId];
    let earned = 0, total = 0;
    exam.vignettes.forEach(v=>{
      v.questions.forEach(q=>{
        total += q.points;
        const ans = st.answers[q.num] || {};
        if(q.type === 'mc'){
          if(q.correctIndex !== null && q.correctIndex !== undefined && ans.selected === q.correctIndex){
            earned += q.points;
          }
        } else {
          earned += clampScore(ans.essayScore || 0, q.points);
        }
      });
    });
    return {earned, total};
  }

  function updateScoreBadge(){
    const badge = document.getElementById('scoreBadge');
    const st = states[currentExamId];
    if(!st.submitted){
      badge.textContent = 'Chưa nộp bài';
      return;
    }
    const {earned, total} = computeExamScore(currentExamId);
    badge.textContent = 'Điểm tự chấm: ' + round1(earned) + ' / ' + total;
  }

  function round1(v){
    return Math.round(v*10)/10;
  }

  // ---------------- CFA-style exam shell ----------------

  function panelEl(examId){
    return document.querySelector('.examPanel[data-exam-id="'+examId+'"]');
  }

  function renderExamShell(exam){
    const panel = document.createElement('section');
    panel.className = 'examPanel' + (exam.id === currentExamId ? ' active' : '');
    panel.dataset.examId = exam.id;

    panel.innerHTML =
      '<div class="cfaShell">' +
        '<div class="cfaTopRow">' +
          '<div class="cfaQInfo"><div class="cfaQNum">Question: <span data-role="qnum">1</span></div><div class="cfaSection">Section: 1</div></div>' +
          '<div class="cfaTimerWrap"><span class="cfaClockIcon">🕐</span><div><div class="cfaTimerLabel">Section Time Elapsed:</div><div class="cfaTimerVal" data-role="timerVal">00:00:00</div></div></div>' +
          '<div class="cfaProgressWrap"><div class="cfaProgressBar"><div class="cfaProgressFill" data-role="progressFill"></div></div><div class="cfaProgressLabel" data-role="progressLabel">Progress 0%</div></div>' +
          '<button class="cfaFinishBtn" data-role="finishBtn">Finish Test</button>' +
        '</div>' +
        '<div class="cfaGreenBar"><span data-role="testLabel">Test: '+exam.title+'</span><span>Candidate: Demo</span></div>' +
        '<div class="cfaBody">' +
          '<div class="casePanel" data-role="casePanel">' +
            '<div class="casePanelHeader"><span>Case Scenario</span><div class="casePanelIcons"><button class="iconBtn" data-role="closeCaseBtn" title="Ẩn Case Scenario">✕</button></div></div>' +
            '<div class="casePanelBody" data-role="casePanelBody"></div>' +
          '</div>' +
          '<button class="reopenCaseBtn" data-role="reopenCaseBtn">📄 Case Scenario</button>' +
          '<div class="qPane" data-role="qPane">' +
            '<nav class="pillNav" data-role="pillNav"></nav>' +
            '<div class="qCard" data-role="qCard"></div>' +
          '</div>' +
        '</div>' +
        '<div class="cfaBottomBar">' +
          '<div class="bottomLeftIcons">' +
            '<button class="iconBtn" data-role="settingsBtn" title="Cài đặt (chưa hỗ trợ)">⚙️</button>' +
            '<button class="iconBtn" data-role="overviewBtn" title="Xem tổng quan câu hỏi">▦</button>' +
            '<button class="iconBtn" data-role="helpBtn" title="Hướng dẫn">❓</button>' +
          '</div>' +
          '<div class="bottomRightNav">' +
            '<button class="iconBtn flagBtn" data-role="flagBtn" title="Đánh dấu để xem lại">🚩</button>' +
            '<button class="navBtn" data-role="backBtn">‹ Back</button>' +
            '<button class="navBtn" data-role="nextBtn">Next ›</button>' +
          '</div>' +
        '</div>' +
      '</div>';

    document.getElementById('content').appendChild(panel);

    const examId = exam.id;
    panel.querySelector('[data-role="closeCaseBtn"]').addEventListener('click', ()=> hideCasePanel(examId));
    panel.querySelector('[data-role="reopenCaseBtn"]').addEventListener('click', ()=> showCasePanel(examId));
    panel.querySelector('[data-role="finishBtn"]').addEventListener('click', ()=> submitExam(examId));
    panel.querySelector('[data-role="backBtn"]').addEventListener('click', ()=> stepItem(examId, -1));
    panel.querySelector('[data-role="nextBtn"]').addEventListener('click', ()=> stepItem(examId, 1));
    panel.querySelector('[data-role="flagBtn"]').addEventListener('click', ()=> toggleFlag(examId));
    panel.querySelector('[data-role="overviewBtn"]').addEventListener('click', ()=> openOverview(examId));
    panel.querySelector('[data-role="helpBtn"]').addEventListener('click', ()=>{
      alert('Hướng dẫn nhanh:\n\n- Chọn câu trả lời rồi bấm Next để sang câu tiếp theo.\n- Dùng cây câu hỏi bên trái để nhảy nhanh tới câu bất kỳ.\n- Bấm 🚩 để đánh dấu câu cần xem lại.\n- Bấm ▦ để xem tổng quan tiến độ làm bài.\n- Bấm Finish Test khi làm xong để chấm điểm và xem giải thích đáp án.\n- Bôi đen đoạn văn bất kỳ để highlight, bấm lại vào chỗ đã highlight để xoá.');
    });
  }

  function currentItem(examId){
    const exam = EXAM_DATA.find(e=>e.id===examId);
    const items = getItems(exam);
    const st = states[examId];
    let item = items.find(it => it.vi === st.pos.vi && it.qi === st.pos.qi);
    if(!item){
      item = items[0];
      st.pos = { vi: item.vi, qi: item.qi };
    }
    return item;
  }

  function gotoItem(examId, vi, qi){
    states[examId].pos = { vi, qi };
    saveState(examId, states[examId]);
    renderCasePanel(examId, vi);
    renderQCard(examId);
    renderPillNav(examId);
    updateTopBar(examId);
    updateBottomBar(examId);
  }

  function stepItem(examId, dir){
    const exam = EXAM_DATA.find(e=>e.id===examId);
    const items = getItems(exam);
    const item = currentItem(examId);
    const idx = items.indexOf(item);
    const next = items[idx + dir];
    if(!next) return;
    gotoItem(examId, next.vi, next.qi);
  }

  function toggleFlag(examId){
    const item = currentItem(examId);
    const ans = getAnswer(examId, item.q.num);
    ans.flagged = !ans.flagged;
    saveState(examId, states[examId]);
    updateBottomBar(examId);
    renderPillNav(examId);
  }

  function caseNarrId(examId, vi){ return 'narr-'+examId+'-'+vi; }

  function renderCasePanel(examId, vi){
    const exam = EXAM_DATA.find(e=>e.id===examId);
    const v = exam.vignettes[vi];
    const body = panelEl(examId).querySelector('[data-role="casePanelBody"]');
    body.innerHTML = '';

    const h2 = document.createElement('div');
    h2.className = 'caseTopic';
    h2.textContent = 'TOPIC: ' + v.topic.toUpperCase();
    body.appendChild(h2);

    const pts = document.createElement('div');
    pts.className = 'casePoints';
    pts.textContent = 'The total point value of this question set is ' + v.points + ' points';
    body.appendChild(pts);

    const narr = document.createElement('div');
    narr.className = 'narrative';
    narr.id = caseNarrId(examId, vi);
    narr.setAttribute('data-hl-container','1');
    narr.innerHTML = v.narrative;
    body.appendChild(narr);

    reapplyHighlightsFor(examId, narr);
  }

  function renderQCard(examId){
    const exam = EXAM_DATA.find(e=>e.id===examId);
    const st = states[examId];
    const item = currentItem(examId);
    const q = item.q;
    const ans = getAnswer(examId, q.num);

    const qCard = panelEl(examId).querySelector('[data-role="qCard"]');
    qCard.innerHTML = '';

    const head = document.createElement('div');
    head.className = 'qCardHead';
    head.innerHTML = '<span class="qCardBadge">📄 Case Scenario</span>' +
      '<span class="qCardType">'+(q.type==='mc' ? 'Multiple Choice' : 'Essay')+' &middot; '+q.points+' point'+(q.points>1?'s':'')+'</span>';
    qCard.appendChild(head);
    head.querySelector('.qCardBadge').addEventListener('click', ()=>{
      showCasePanel(examId);
      const cpBody = panelEl(examId).querySelector('[data-role="casePanelBody"]');
      if(cpBody) cpBody.scrollTop = 0;
    });

    const promptDiv = document.createElement('div');
    promptDiv.className = 'prompt';
    promptDiv.id = 'prompt-'+examId+'-'+q.num;
    promptDiv.setAttribute('data-hl-container','1');
    promptDiv.innerHTML = q.prompt;
    qCard.appendChild(promptDiv);

    if(q.type === 'mc'){
      if(!st.submitted){
        const choicesDiv = document.createElement('div');
        choicesDiv.className = 'choicesCfa';
        q.choices.forEach((c, idx)=>{
          const row = document.createElement('div');
          row.className = 'choiceRow' + (ans.selected===idx ? ' selected' : '');
          row.setAttribute('role','radio');
          row.setAttribute('aria-checked', ans.selected===idx ? 'true' : 'false');
          row.innerHTML = '<span class="choiceLetter">'+String.fromCharCode(65+idx)+'</span><div class="choiceBox">'+c+'</div>';
          row.addEventListener('click', ()=>{
            ans.selected = idx;
            saveState(examId, st);
            choicesDiv.querySelectorAll('.choiceRow').forEach((r,i)=>{
              r.classList.toggle('selected', i===idx);
              r.setAttribute('aria-checked', i===idx ? 'true':'false');
            });
            updateTopBar(examId);
            renderPillNav(examId);
          });
          choicesDiv.appendChild(row);
        });
        qCard.appendChild(choicesDiv);
      }
    } else {
      const editorWrap = document.createElement('div');
      editorWrap.className = 'essayEditorWrap' + (st.submitted ? ' locked' : '');
      editorWrap.innerHTML =
        '<div class="essayToolbar">' +
          '<button type="button" data-cmd="bold"><b>B</b></button>' +
          '<button type="button" data-cmd="italic"><i>I</i></button>' +
          '<button type="button" data-cmd="underline"><u>U</u></button>' +
          '<button type="button" data-cmd="justifyLeft">⯇</button>' +
          '<button type="button" data-cmd="justifyCenter">≡</button>' +
          '<button type="button" data-cmd="justifyRight">⯈</button>' +
          '<button type="button" data-cmd="insertUnorderedList">• List</button>' +
          '<button type="button" data-cmd="insertOrderedList">1. List</button>' +
          '<button type="button" data-cmd="undo">↺</button>' +
          '<button type="button" data-cmd="redo">↻</button>' +
        '</div>' +
        '<div class="essayEditable" contenteditable="'+(!st.submitted)+'" data-placeholder="Nhập câu trả lời của bạn..."></div>';
      qCard.appendChild(editorWrap);

      const editable = editorWrap.querySelector('.essayEditable');
      editable.innerHTML = ans.essayText || '';
      editorWrap.querySelectorAll('button[data-cmd]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          if(st.submitted) return;
          editable.focus();
          document.execCommand(btn.dataset.cmd, false, null);
        });
      });
      editable.addEventListener('input', ()=>{
        ans.essayText = editable.innerHTML;
        saveState(examId, st);
        updateTopBar(examId);
        renderPillNav(examId);
      });
    }

    const reviewHolder = document.createElement('div');
    reviewHolder.className = 'reviewHolder';
    qCard.appendChild(reviewHolder);
    if(st.submitted){
      renderReviewInto(reviewHolder, q, examId);
    }

    reapplyHighlightsFor(examId, promptDiv);
  }

  function renderReviewInto(reviewHolder, q, examId){
    reviewHolder.innerHTML = '';
    const ans = getAnswer(examId, q.num);
    const block = document.createElement('div');
    block.className = 'reviewBlock';

    if(q.type === 'mc'){
      const title = document.createElement('div');
      title.className = 'feedback-label';
      title.textContent = 'Kết quả (tự động chấm)';
      block.appendChild(title);

      const isCorrect = ans.selected === q.correctIndex;
      q.choices.forEach((c, idx)=>{
        const row = document.createElement('div');
        let cls = 'reviewChoice';
        if(idx === q.correctIndex) cls += ' correctChoice';
        else if(idx === ans.selected) cls += ' wrongChoice';
        row.className = cls;
        let tags = '';
        if(idx === q.correctIndex) tags += '<span class="tag correct">Đáp án đúng</span>';
        if(idx === ans.selected) tags += '<span class="tag ' + (isCorrect ? 'yours' : 'yourswrong') + '">Bạn đã chọn</span>';
        row.innerHTML = '<span><strong>'+String.fromCharCode(65+idx)+'.</strong> '+c+'</span>'+tags;
        block.appendChild(row);
      });

      const scoreTagWrap = document.createElement('div');
      scoreTagWrap.style.marginTop = '8px';
      scoreTagWrap.innerHTML = isCorrect
        ? '<span class="qScoreTag full">+'+q.points+' điểm</span>'
        : (ans.selected === undefined ? '<span class="qScoreTag zero">Chưa trả lời — 0 / '+q.points+' điểm</span>' : '<span class="qScoreTag zero">0 / '+q.points+' điểm</span>');
      block.appendChild(scoreTagWrap);

      if(q.feedback && q.feedback.length){
        const fbLabel = document.createElement('div');
        fbLabel.className = 'feedback-label';
        fbLabel.style.marginTop = '10px';
        fbLabel.textContent = 'Giải thích đáp án';
        block.appendChild(fbLabel);

        const fb = document.createElement('div');
        fb.className = 'feedback';
        fb.id = 'fb-'+examId+'-'+q.num;
        fb.setAttribute('data-hl-container','1');
        fb.innerHTML = q.feedback.map(p=>'<p>'+p+'</p>').join('');
        block.appendChild(fb);
      }

    } else {
      const label = document.createElement('div');
      label.className = 'feedback-label';
      label.textContent = 'Bài giải mẫu / Gợi ý chấm điểm';
      block.appendChild(label);

      const fb = document.createElement('div');
      fb.className = 'feedback';
      fb.id = 'fb-'+examId+'-'+q.num;
      fb.setAttribute('data-hl-container','1');
      fb.innerHTML = (q.feedback||[]).map(p=>'<p>'+p+'</p>').join('');
      block.appendChild(fb);

      const scoreRow = document.createElement('div');
      scoreRow.className = 'selfScoreRow';
      const inputId = 'score-'+examId+'-'+q.num;
      scoreRow.innerHTML = '<label for="'+inputId+'">Tự chấm điểm (0 – '+q.points+'):</label>'+
        '<input type="number" id="'+inputId+'" min="0" max="'+q.points+'" step="0.5">';
      block.appendChild(scoreRow);
      const inp = scoreRow.querySelector('input');
      inp.value = (ans.essayScore !== undefined) ? ans.essayScore : '';
      inp.addEventListener('input', ()=>{
        ans.essayScore = clampScore(inp.value, q.points);
        saveState(examId, states[examId]);
        updateScoreBadge();
      });
    }

    reviewHolder.appendChild(block);

    const fbEl = block.querySelector('.feedback');
    if(fbEl) reapplyHighlightsFor(examId, fbEl);
  }

  function renderPillNav(examId){
    const exam = EXAM_DATA.find(e=>e.id===examId);
    const st = states[examId];
    const nav = panelEl(examId).querySelector('[data-role="pillNav"]');
    nav.innerHTML = '';
    exam.vignettes.forEach((v, vi)=>{
      if(v.questions.length === 1){
        nav.appendChild(makePill(examId, vi, 0, String(vi+1), v.questions[0]));
      } else {
        const expanded = expandState[examId][vi] !== false;
        const parentBtn = document.createElement('button');
        parentBtn.className = 'pillParent';
        parentBtn.innerHTML = (vi+1) + ' <span class="pillArrow">'+(expanded ? '▾' : '▸')+'</span>';
        parentBtn.addEventListener('click', ()=>{
          expandState[examId][vi] = !expanded;
          renderPillNav(examId);
        });
        nav.appendChild(parentBtn);
        if(expanded){
          const childWrap = document.createElement('div');
          childWrap.className = 'pillChildren';
          v.questions.forEach((q, qi)=>{
            childWrap.appendChild(makePill(examId, vi, qi, (vi+1)+'.'+(qi+1), q));
          });
          nav.appendChild(childWrap);
        }
      }
    });
  }

  function makePill(examId, vi, qi, label, q){
    const st = states[examId];
    const isActive = st.pos.vi === vi && st.pos.qi === qi;
    const ans = getAnswer(examId, q.num);
    let cls = 'pill';
    if(isActive) cls += ' active';
    if(isAnswered(examId, q)) cls += ' answered';
    if(ans.flagged) cls += ' flagged';
    const btn = document.createElement('button');
    btn.className = cls;
    btn.textContent = label;
    btn.addEventListener('click', ()=> gotoItem(examId, vi, qi));
    return btn;
  }

  function updateTopBar(examId){
    const exam = EXAM_DATA.find(e=>e.id===examId);
    const st = states[examId];
    const item = currentItem(examId);
    const panel = panelEl(examId);
    if(!panel) return;

    const v = exam.vignettes[item.vi];
    const label = v.questions.length > 1 ? (item.vi+1)+'.'+(item.qi+1) : String(item.vi+1);
    panel.querySelector('[data-role="qnum"]').textContent = label;

    const elapsed = st.submitted ? st.elapsed : st.elapsed + Math.floor((Date.now()-st.startTime)/1000);
    const timerEl = panel.querySelector('[data-role="timerVal"]');
    if(timerEl) timerEl.textContent = fmtTime(elapsed);

    const items = getItems(exam);
    const answeredCount = items.filter(it => isAnswered(examId, it.q)).length;
    const pct = items.length ? Math.round(answeredCount / items.length * 100) : 0;
    panel.querySelector('[data-role="progressFill"]').style.width = (st.submitted ? 100 : pct) + '%';
    panel.querySelector('[data-role="progressLabel"]').textContent = 'Progress ' + (st.submitted ? 100 : pct) + '%';

    const finishBtn = panel.querySelector('[data-role="finishBtn"]');
    finishBtn.textContent = st.submitted ? 'Đã nộp bài ✓' : 'Finish Test';
    finishBtn.disabled = !!st.submitted;
  }

  function updateBottomBar(examId){
    const exam = EXAM_DATA.find(e=>e.id===examId);
    const items = getItems(exam);
    const item = currentItem(examId);
    const idx = items.indexOf(item);
    const panel = panelEl(examId);

    panel.querySelector('[data-role="backBtn"]').disabled = (idx <= 0);
    panel.querySelector('[data-role="nextBtn"]').disabled = (idx >= items.length - 1);

    const ans = getAnswer(examId, item.q.num);
    panel.querySelector('[data-role="flagBtn"]').classList.toggle('flaggedOn', !!ans.flagged);
  }

  function hideCasePanel(examId){
    const panel = panelEl(examId);
    panel.querySelector('[data-role="casePanel"]').style.display = 'none';
    panel.querySelector('[data-role="reopenCaseBtn"]').style.display = 'inline-block';
  }
  function showCasePanel(examId){
    const panel = panelEl(examId);
    panel.querySelector('[data-role="casePanel"]').style.display = '';
    panel.querySelector('[data-role="reopenCaseBtn"]').style.display = 'none';
  }

  function openOverview(examId){
    const exam = EXAM_DATA.find(e=>e.id===examId);
    const modal = document.getElementById('overviewModal');
    const body = modal.querySelector('.overviewBody');
    body.innerHTML = '';
    exam.vignettes.forEach((v, vi)=>{
      const row = document.createElement('div');
      row.className = 'overviewRow';
      const title = document.createElement('div');
      title.className = 'overviewVTitle';
      title.textContent = (vi+1) + '. ' + v.topic;
      row.appendChild(title);
      const cellsWrap = document.createElement('div');
      cellsWrap.className = 'overviewCells';
      v.questions.forEach((q, qi)=>{
        const ans = getAnswer(examId, q.num);
        const cell = document.createElement('button');
        cell.className = 'overviewCell' + (isAnswered(examId,q) ? ' done' : '') + (ans.flagged ? ' flag' : '');
        cell.textContent = v.questions.length > 1 ? (vi+1)+'.'+(qi+1) : String(vi+1);
        cell.addEventListener('click', ()=>{ gotoItem(examId, vi, qi); closeOverview(); });
        cellsWrap.appendChild(cell);
      });
      row.appendChild(cellsWrap);
      body.appendChild(row);
    });
    modal.style.display = 'flex';
  }
  function closeOverview(){ document.getElementById('overviewModal').style.display = 'none'; }
  document.getElementById('overviewCloseBtn').addEventListener('click', closeOverview);
  document.getElementById('overviewModal').addEventListener('click', (e)=>{
    if(e.target.id === 'overviewModal') closeOverview();
  });

  function submitExam(examId){
    const st = states[examId];
    st.submitted = true;
    st.elapsed = st.elapsed + Math.floor((Date.now()-st.startTime)/1000);
    st.startTime = Date.now();
    saveState(examId, st);
    renderQCard(examId);
    renderPillNav(examId);
    updateTopBar(examId);
    updateBottomBar(examId);
    updateScoreBadge();
  }

  function resetExam(examId){
    if(!confirm('Xoá toàn bộ câu trả lời và điểm tự chấm của đề '+examId+'? Hành động này không thể hoàn tác.')) return;
    localStorage.removeItem(stateKey(examId));
    states[examId] = loadState(examId);
    if(!states[examId].pos) states[examId].pos = {vi:0, qi:0};
    expandState[examId] = {};
    gotoItem(examId, 0, 0);
    updateScoreBadge();
  }

  document.getElementById('resetBtn').addEventListener('click', ()=> resetExam(currentExamId));

  // ---------------- fullscreen / immersive mode ----------------
  // "Toàn màn hình" button uses the real Fullscreen API. We also detect the
  // browser's own F11 "true fullscreen" (which does NOT fire the Fullscreen
  // API events) via a window-size heuristic, so either way hides our own
  // outer title/tabs strip and leaves only the CFA exam interface visible.
  function checkImmersive(){
    const apiFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);
    const looksLikeF11 = Math.abs(window.innerWidth - screen.width) < 3 && Math.abs(window.innerHeight - screen.height) < 3;
    document.body.classList.toggle('is-fullscreen', apiFullscreen || looksLikeF11);
    const btn = document.getElementById('fullscreenBtn');
    if(btn) btn.textContent = apiFullscreen ? '⛶ Thoát toàn màn hình' : '⛶ Toàn màn hình';
  }
  document.getElementById('fullscreenBtn').addEventListener('click', ()=>{
    if(document.fullscreenElement){
      document.exitFullscreen();
    } else if(document.documentElement.requestFullscreen){
      document.documentElement.requestFullscreen().catch(()=>{});
    }
  });
  document.addEventListener('fullscreenchange', checkImmersive);
  window.addEventListener('resize', checkImmersive);
  checkImmersive();

  // ---------------- text highlighting ----------------
  function getTextNodesIn(node){
    const nodes = [];
    const walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT, null, false);
    let n;
    while((n = walker.nextNode())) nodes.push(n);
    return nodes;
  }

  function buildTextMap(container){
    const nodes = getTextNodesIn(container);
    let concatenated = '';
    const map = [];
    nodes.forEach(n=>{
      const s = n.nodeValue;
      for(let i=0;i<s.length;i++) map.push({node:n, offset:i});
      concatenated += s;
    });
    return {concatenated, map};
  }

  function findRangeForOccurrence(container, text, occurrence){
    const {concatenated, map} = buildTextMap(container);
    let searchFrom = 0, idx = -1, count = -1;
    while(true){
      idx = concatenated.indexOf(text, searchFrom);
      if(idx === -1) break;
      count++;
      if(count === occurrence) break;
      searchFrom = idx + 1;
    }
    if(idx === -1) return null;
    const startMap = map[idx], endMap = map[idx + text.length - 1];
    if(!startMap || !endMap) return null;
    const range = document.createRange();
    range.setStart(startMap.node, startMap.offset);
    range.setEnd(endMap.node, endMap.offset + 1);
    return range;
  }

  function computeOccurrenceIndex(container, range, text){
    const {concatenated, map} = buildTextMap(container);
    let startGlobal = -1;
    for(let i=0;i<map.length;i++){
      if(map[i].node === range.startContainer && map[i].offset === range.startOffset){ startGlobal = i; break; }
    }
    if(startGlobal === -1) return 0;
    let count = 0, searchFrom = 0, idx;
    while((idx = concatenated.indexOf(text, searchFrom)) !== -1 && idx < startGlobal){
      count++;
      searchFrom = idx + 1;
    }
    return count;
  }

  function wrapRangeWithMark(range, uid){
    const mark = document.createElement('mark');
    mark.className = 'hl';
    mark.dataset.hlUid = uid;
    mark.title = 'Bấm để bỏ highlight';
    const frag = range.extractContents();
    mark.appendChild(frag);
    range.insertNode(mark);
    return mark;
  }

  function reapplyHighlightsFor(examId, container){
    if(!container || !container.id) return;
    const list = states[examId].highlights.filter(h => h.containerId === container.id);
    list.forEach(h=>{
      if(document.querySelector('[data-hl-uid="'+h.uid+'"]')) return; // already applied
      const range = findRangeForOccurrence(container, h.text, h.occurrence);
      if(range) wrapRangeWithMark(range, h.uid);
    });
  }

  function makeUid(){
    return 'hl' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  }

  let pendingHl = null; // {examId, container, range, text}

  function hideHlToolbar(){
    document.getElementById('hlToolbar').style.display = 'none';
    pendingHl = null;
  }

  document.addEventListener('mouseup', (e)=>{
    if(e.target.closest('#hlToolbar')) return;
    const sel = window.getSelection();
    if(!sel || sel.isCollapsed || sel.rangeCount === 0){ hideHlToolbar(); return; }
    const range = sel.getRangeAt(0);
    const container = range.startContainer.nodeType === 1
      ? range.startContainer.closest('[data-hl-container]')
      : range.startContainer.parentElement && range.startContainer.parentElement.closest('[data-hl-container]');
    const endContainer = range.endContainer.nodeType === 1
      ? range.endContainer.closest('[data-hl-container]')
      : range.endContainer.parentElement && range.endContainer.parentElement.closest('[data-hl-container]');
    if(!container || container !== endContainer){ hideHlToolbar(); return; }
    const text = range.toString();
    if(!text.trim()){ hideHlToolbar(); return; }

    pendingHl = { examId: currentExamId, container, range: range.cloneRange(), text };

    const rect = range.getBoundingClientRect();
    const toolbar = document.getElementById('hlToolbar');
    toolbar.style.display = 'block';
    toolbar.style.top = (window.scrollY + rect.top - 36) + 'px';
    toolbar.style.left = (window.scrollX + rect.left) + 'px';
  });

  document.getElementById('hlBtn').addEventListener('click', ()=>{
    if(!pendingHl) return;
    const { examId, container, range, text } = pendingHl;
    const occurrence = computeOccurrenceIndex(container, range, text);
    const uid = makeUid();
    wrapRangeWithMark(range, uid);
    states[examId].highlights.push({ containerId: container.id, text, occurrence, uid });
    saveState(examId, states[examId]);
    window.getSelection().removeAllRanges();
    hideHlToolbar();
  });

  document.addEventListener('mousedown', (e)=>{
    if(!e.target.closest('#hlToolbar')) hideHlToolbar();
  });

  document.addEventListener('click', (e)=>{
    const mark = e.target.closest('mark.hl');
    if(!mark) return;
    const sel = window.getSelection();
    if(sel && !sel.isCollapsed) return; // user is selecting text, not clicking to remove
    const uid = mark.dataset.hlUid;
    const parent = mark.parentNode;
    while(mark.firstChild) parent.insertBefore(mark.firstChild, mark);
    parent.removeChild(mark);
    parent.normalize();
    states[currentExamId].highlights = states[currentExamId].highlights.filter(h => h.uid !== uid);
    saveState(currentExamId, states[currentExamId]);
  });

  // init
  EXAM_DATA.forEach(renderExamShell);
  buildTabs();
  resumeTimer(currentExamId);
  EXAM_DATA.forEach(e=>{
    const p = states[e.id].pos;
    gotoItem(e.id, p.vi, p.qi);
  });
  updateScoreBadge();
  startTimer();

})();
</script>
