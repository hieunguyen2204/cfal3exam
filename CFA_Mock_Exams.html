buy order for 800 shares, which moved down the book as it was filled. This means that the trader purchased 300 shares from Dealer B at $47.06 per share and 500 shares from Dealer A at $47.10 per share. Filling the second part of the buy order cost $0.04 more than the first part because Dealer B's ask size of 300 shares was insufficient to fill the entire order of 800 shares. The market impact was $0.04 per share—the difference between $47.10 and $47.06. Trader 2 placed a sell order for 500 shares with a limit price of $46.00, good for one day. However, the order did not execute and the shares closed at $45.60. This means that the", "trader could have filled the order at $45.82 per share because Dealer C's bid size of 900 shares was sufficient to fill the entire order of 500 shares. The opportunity cost was $0.22 per share—the difference between $45.82 and $45.60."]}, {"type": "mc", "points": 1, "prompt": "<p>To reduce systemic risk, Verdi should recommend:</p>", "choices": ["Policy 1 only.", "Policy 2 only.", "both Policy 1 and Policy 2."], "num": 34, "correctIndex": 0, "correctText": "Policy 1 only.", "feedback": ["Correct because Policy 1, converting market orders into marketable limit orders, reduces the systemic risk of trading at unreasonable prices. Some exchanges have adopted price limits and trade halts to stop trading when prices move too quickly. These rules stop trading when excess demands for liquidity occur. They also prevent the extreme price changes that can occur in electronic markets when market orders arrive and no liquidity is present. Most brokers now automatically convert market orders into marketable limit orders to ensure that they do not trade at unreasonable prices. Market orders are incompatible with electronic order-matching systems that do not curb trading when prices move too quickly."]}, {"type": "mc", "points": 1, "prompt": "<p>To address Silver's top priority in trade execution, Verdi should implement:</p>", "choices": ["Action 1.", "Action 2.", "Action 3."], "num": 35, "correctIndex": 1, "correctText": "Action 2.", "feedback": ["Correct because contingency tables increase the speed of decision making and reduce latency, which is Silver's top priority in trade execution. Contingency tables contain prearranged action plans, and traders can reduce their decision latencies by doing these analyses. To be most useful, the contingency tables must be kept up to date and must include responses for most- likely events."]}]}, {"topic": "PORTFOLIO MANAGEMENT", "points": 12, "narrative": "<p>Tom Baker is a portfolio manager at Meaford Capital. He manages the Alpha Fund with a top-down, volatility-based strategy that uses long straddles with at-the-money puts and calls. Baker believes his strategy can outperform a long-only equity strategy.</p>\n<p>Baker is launching a quantitative fund that replicates a strategy employed by many other firms. He backtests the strategy using original (un-restated) financial data, applying a portfolio turnover constraint and including estimated trading costs. The population for the backtest is all securities that currently trade.</p>\n<p>Baker manages a fund of funds and is evaluating three managers. The managers share the same broad, market-cap-weighted benchmark and invest only in securities in the benchmark. Baker uses the information in Exhibit 1 to assess which manager's portfolio has the most concentrated holdings.</p>\n<div class=\"exhibit-title\">Exhibit 1</div>\n<table class=\"exhibit-table\"><tr><td></td><td>Portfolio A</td><td>Portfolio B</td><td>Portfolio C</td></tr><tr><td>Active share</td><td>High</td><td>High</td><td>Low</td></tr><tr><td>Active risk</td><td>Low</td><td>High</td><td>High</td></tr><tr><td>Total risk</td><td>High</td><td>Low</td><td>High</td></tr></table>", "questions": [{"type": "essay", "points": 4, "prompt": "<p><strong>Discuss</strong> one market condition that would allow the Alpha Fund to outperform a long-only equity strategy.</p>", "num": 36, "feedback": ["A volatility-based strategy does not require the investor to form an opinion on the direction of the move; rather, he only needs volatility to be higher than expected. This is most evident before the options have expired. The increase in the value of the position due to the higher price of the options leads to a gain in the strategy regardless of the trend in the market. After the options have expired, Baker can capture both the upside and downside of market moves while a long-only manager must take a stance on the direction of the move. As long as the move is greater than the cost of the options, this would allow Baker to further outperform the long-only manager."]}, {"type": "essay", "points": 4, "prompt": "<p><strong>Discuss</strong> two potential pitfalls in the design of the quantitative fund's strategy. <em>Note: Each discussion should be in a separate paragraph.</em></p>", "num": 37, "feedback": ["When back tests use only those companies that are currently in business today, they ignore the stocks that have left the investment universe due to bankruptcy, delisting, or acquisition. This approach creates survivorship bias whereby only companies that have survived are tested and it is assumed that the strategy would never have invested in companies that have failed. This bias can lead to overly optimistic results and sometimes even causes investors to draw wrong conclusions.", "Popular trades are subject to “crowding” risk, where the trades are done in such large volume by so many investors that the exit becomes crowded as all try to unwind the trade within a short period of time. Such losses have been attributed to crowding among quantitative managers following similar trades. Many managers with similar strategies will exit their positions at the same time, exacerbating the losses. Note that the following are not pitfalls of the fund's strategy: 1. The strategy was back tested using un-restated financial data. If it had used restated financial statements, it would have introduced the pitfall of look-ahead bias. 2. A portfolio turnover constraint was applied. One problem with back-testing is it is often conducted in an ideal but unrealistic world without constraints on turnover. 3. Trading costs were estimated. One problem with back-testing is it is often conducted in an ideal but unrealistic world without trading costs, but in reality transaction costs can erode returns significantly."]}, {"type": "essay", "points": 4, "prompt": "<p><strong>Identify</strong> the portfolio with the most concentrated holdings. (Portfolio A, Portfolio B, Portfolio C) <strong>Justify</strong> your response.</p>", "num": 38, "feedback": ["Portfolio B is likely a concentrated portfolio because it has the combination of both high active share and high active risk. Active share measures the extent to which the number and sizing of positions of a portfolio differ from the benchmark. Since the portfolios use the same benchmark and invest only in securities that are in that benchmark, the difference in active share will result from holding securities that are in the benchmark, but at weights different than the benchmark weights. Active risk (or tracking error) indicates a willingness to tolerate significant performance deviations from the market or selected benchmark. It measures the correlation and variances of securities, and active risk increases when a fund becomes more uncorrelated with its benchmark. Two of the portfolios in Exhibit 1 (Portfolio A and Portfolio B) have high active share, but the more concentrated portfolio will be more uncorrelated with its benchmark (i.e., will have high active risk) because it has fewer securities. Thus Portfolio B, with both high active share and high active risk, likely has the most concentrated holdings. Note that Portfolio A could be a multi-factor product. Such products have a low concentration among securities, often holding more than 250 positions, and are diversified across factors and securities. In contrast, the concentrated stock picker has both high active share and high active risk due to holding fewer securities. The lower number of holdings increases idiosyncratic risk and affects factor beta weights so that active risk is increased.", "Retake"]}]}]}, {"id": "M2S1", "title": "Module 2 - Session 1", "totalPoints": 92, "vignettes": [{"topic": "ASSET ALLOCATION", "points": 12, "narrative": "<p>Eva Thompson is a portfolio manager advising both institutional and high-net-worth individual investors. She is discussing asset allocation strategies with two new clients: FPG Insurance, a property and casualty insurance company, and Eric Monroe, a private investor.</p>\n<p><strong>FPG Insurance</strong></p>\n<p>FPG estimates its liability cash flows using probabilistic models of insured risks that are spread across multiple periods. FPG's portfolio is rebalanced monthly and includes government and corporate bonds as well as large-cap equities. Thompson reviews both the surplus optimization and integrated asset-liability approaches to asset allocation to determine the most suitable approach for FPG.</p>\n<p>Thompson reviews FPG's rebalancing policy for global equities. She observes that transaction costs have increased by an average of 15 bps and the correlation of global equities with the rest of the portfolio has increased slightly. Thompson also notes that the volatility of the non-global-equities portion of the portfolio has increased by 20%. She recommends increasing the optimal corridor width for global equities.</p>\n<p><strong>Eric Monroe</strong></p>\n<p>Monroe is retired and has $4.2 million of financial assets. One of Monroe's goals is to fund expected nominal expenditures of $120,000 in each of the next three years at a 95% required probability of success. Thompson suggests using a goals-based approach to construct a portfolio that meets this goal. She identifies a set of three available optimized sub-portfolio modules, as shown in Exhibit 1. She assumes that each year's expenditures will be a single year-end cash outflow.</p>\n<div class=\"exhibit-title\">Exhibit 1</div>\n<table class=\"exhibit-table\"><tr><td></td><td>Module A</td><td>Module B</td><td>Module C</td></tr><tr><td>Expected return</td><td>8.56%</td><td>9.06%</td><td>9.81%</td></tr><tr><td>Expected volatility</td><td>6.28%</td><td>7.33%</td><td>8.43%</td></tr><tr><td>3-year annualized minimum expectation return at 95% required probability of success</td><td>2.60%</td><td>2.10%</td><td>1.80%</td></tr></table>", "questions": [{"type": "essay", "points": 4, "prompt": "<p><strong>Determine</strong> which liability-relative asset allocation approach is most suitable for FPG. (Surplus optimization approach, Integrated asset–liability approach) <strong>Explain</strong> why the other approach is less suitable.</p>", "num": 1, "feedback": ["An integrated asset–liability approach is most suitable for a property and casualty insurance company such as FPG, which must make asset investment decisions in conjunction with business decisions about its portfolio of incurred risks (its liabilities). The vignette mentions that FPG's liability cash flows are estimated using probabilistic models (because the liabilities of a P&C insurer depend on events which are difficult to hedge) and that the company's insured risks are spread across multiple periods—both of which imply a complex liability portfolio that should be addressed using an integrated approach. There are numerous applications of the liability-relative perspective in which the institution must render significant decisions regarding the composition of its liabilities in conjunction with the asset allocation. Banks, long–short hedge funds (for which short positions constitute liabilities), insurance companies, and re- insurance companies routinely fall into this situation. These approaches are often implemented in the context of multi-period models. A property/casualty insurance company must make asset investment decisions in conjunction with business decisions about the portfolio of insured properties, its liabilities. To that end, asset and liability decisions are frequently integrated in an enterprise risk management system. In fact, the liability portfolio is essential to the company’s long-term viability. Surplus optimization is less suitable for FPG because:", "it is a single-period model which is less suitable for incorporating risks that are spread across multiple periods, like those of FPG; and it is not able to incorporate portfolio rebalancing, which FPG does on a monthly basis.", "Surplus optimization involves adapting asset-only mean–variance optimization by substituting surplus return for asset return over any given time horizon. This surplus efficient frontier approach is a straightforward extension of the asset-only portfolio model. The traditional mean–variance model assumes that the investor follows a buy- and-hold strategy over the planning horizon. Thus, the portfolio is not rebalanced at intermediate dates. A portfolio investment model requires multiple time periods if rebalancing decisions are to be directly incorporated into the model. Applicable to both asset-only and liability-relative asset allocation, multi- period portfolio models are more comprehensive than single-period models but are more complex to implement. These models are generally implemented by means of the integrated asset–liability methods."]}, {"type": "essay", "points": 4, "prompt": "<p><strong>Discuss</strong> two factors that support Thompson's recommendation regarding FPG's optimal corridor width for global equities. <em>Note: Each discussion should be in a separate paragraph.</em></p>", "num": 2, "feedback": ["Increasing the optimal corridor width for global equities in FPG's portfolio is supported by the higher transaction costs and the higher correlation of global equities with the rest of the portfolio, but not by the increase in volatility of the rest of the portfolio. The higher the transaction costs, the wider the optimal corridor as high transaction costs set a high hurdle for rebalancing benefits to overcome. Said differently, FPG is less likely to benefit from rebalancing if the transaction costs in doing so are high, therefore a wider corridor is needed to make rebalancing transactions less frequent. The higher the correlation of global equities with the rest of the portfolio, the wider the optimal corridor because when asset classes move more in sync, further divergence from target weights is less likely. Suppose one asset class is above its target weight, so the other asset class is below its target weight. A further increase in the value of the overweight asset class implies, on average, a smaller divergence in the asset mix if the asset classes’ returns are more highly positively correlated (because the denominator in computing the overweight asset class’s weight is the sum of the values of the two asset classes). The higher volatility of the rest of the portfolio does not support Thompson's recommendation to widen the rebalancing range because higher volatility makes large divergence from the strategic asset allocation more likely."]}, {"type": "essay", "points": 4, "prompt": "<p><strong>Determine</strong> the most appropriate sub-portfolio module to meet Monroe's 3-year expenditure goal. (Module A, Module B, Module C) <strong>Calculate</strong> the amount that should be allocated to this sub-portfolio module today.</p>", "num": 3, "feedback": ["Module A has the highest annualized minimum expectation return of 2.6% for a 3- year time horizon and a 95% required probability of success. As a result, this is the module that should be used to meet Monroe's expenditure goal.<br>Therefore:", "The cash outflow will be $120,000 at the end of each of the next three years. Using a PV calculation, these cash flows are discounted back to Year 0 using a 2.6% discount rate. Using a financial calculator, set to end-of-year payments, the PV of $342,061 (which represents the initial investment) is calculated as follows: N = 3, I/Y = 2.6, PMT = 120,000, FV = 0, solve for PV.", "The calculation can also be done as follows: Year 1        Year 2                           Year 3 Annual expenditure $120,000                     $120,000           $120,000 Discount factor             1/(1.0261) 1/(1.0262) 1/(1.0263) PV by year                  $116,959.06 $113,995.19 $111,106.42 Total PV                    $342,061", "Vignette", "TOPIC: PORTFOLIO CONSTRUCTION TOTAL POINT VALUE OF THIS QUESTION SET IS 12 POINTS", "Duke Barnette was recently hired as an analyst for the Highland University Endowment, a US-based endowment with $30 billion in assets. Previously, Barnette worked at a US- based private foundation that outsourced the management of most of its $1 billion investment portfolio and had a flow-through spending policy for donations. Barnette reviews the endowment's investment approach. The endowment favors active management, a high allocation to alternative investments, and internally managed assets. In addition, it uses a reference portfolio to define a risk-equivalent benchmark for the endowment portfolio. The endowment has a perpetual investment horizon and its investment objective is to increase long-term purchasing power by targeting a real annual return of 5%. The spending policy is to pay out 4% each year based on a 3-year moving average of asset values. Barnette reviews the endowment's current asset allocation and develops 10-year projected annual returns for each asset class, as shown in Exhibit 1. Inflation is projected to be 2% per year during this period. Exhibit 1 Current      10-Year Projected Annual Asset Class Allocation          Return (Nominal) Global equity                40%                          6.5% Private equity               20%                          8.5% Real assets                  15%                          5.0% Hedge funds                  15%                          5.0% US Treasuries                10%                          2.0%", "The endowment's CIO tells Barnette that the endowment is in the process of growing its ESG investing capabilities and that the risks associated with climate change should be factored into portfolio construction. Barnette believes that climate change has created attractive investment opportunities and suggests that the endowment focus on business segments in the area of climate adaptation."]}]}, {"topic": "PORTFOLIO CONSTRUCTION", "points": 12, "narrative": "<p>Duke Barnette was recently hired as an analyst for the Highland University Endowment, a US-based endowment with $30 billion in assets. Previously, Barnette worked at a US-based private foundation that outsourced the management of most of its $1 billion investment portfolio and had a flow-through spending policy for donations.</p>\n<p>Barnette reviews the endowment's investment approach. The endowment favors active management, a high allocation to alternative investments, and internally managed assets. In addition, it uses a reference portfolio to define a risk-equivalent benchmark for the endowment portfolio.</p>\n<p>The endowment has a perpetual investment horizon and its investment objective is to increase long-term purchasing power by targeting a real annual return of 5%. The spending policy is to pay out 4% each year based on a 3-year moving average of asset values.</p>\n<p>Barnette reviews the endowment's current asset allocation and develops 10-year projected annual returns for each asset class, as shown in Exhibit 1. Inflation is projected to be 2% per year during this period.</p>\n<div class=\"exhibit-title\">Exhibit 1</div>\n<table class=\"exhibit-table\"><tr><td>Asset Class</td><td>Current Allocation</td><td>10-Year Projected Annual Return (Nominal)</td></tr><tr><td>Global equity</td><td>40%</td><td>6.5%</td></tr><tr><td>Private equity</td><td>20%</td><td>8.5%</td></tr><tr><td>Real assets</td><td>15%</td><td>5.0%</td></tr><tr><td>Hedge funds</td><td>15%</td><td>5.0%</td></tr><tr><td>US Treasuries</td><td>10%</td><td>2.0%</td></tr></table>\n<p>The endowment's CIO tells Barnette that the endowment is in the process of growing its ESG investing capabilities and that the risks associated with climate change should be factored into portfolio construction. Barnette believes that climate change has created attractive investment opportunities and suggests that the endowment focus on business segments in the area of climate adaptation.</p>", "questions": [{"type": "mc", "points": 1, "prompt": "<p>Compared to Barnette's previous employer, the endowment most likely:</p>", "choices": ["has lower liquidity needs.", "incurs lower market impact costs.", "has fewer investment professionals on its board."], "num": 4, "correctIndex": 0, "correctText": "has lower liquidity needs.", "feedback": ["Correct because the liquidity needs of university endowments are relatively low compared to foundations. Also, annual net spending is at least 5% of assets for US foundations, whereas annual net spending is typically 2% to 4% of assets (after alumni gifts and donations) for US university endowments."]}, {"type": "mc", "points": 1, "prompt": "<p>The endowment's investment approach is most consistent with the:</p>", "choices": ["Norway model.", "Canada model.", "endowment model."], "num": 5, "correctIndex": 1, "correctText": "Canada model.", "feedback": ["Correct because the endowment favors active management, a high allocation to alternative investments, internally managed assets, and the use of a reference portfolio, and the Canada model is characterized by high alternatives exposure, active management, and insourcing. Also, among the unique and innovative features of the Canada model is the \"reference portfolio.\""]}, {"type": "mc", "points": 1, "prompt": "<p>Based on Barnette's projections, the endowment's 10-year projected annual return is:</p>", "choices": ["lower than its target.", "equal to its target.", "higher than its target."], "num": 6, "correctIndex": 0, "correctText": "lower than its target.", "feedback": ["Correct because the endowment's stated investment objective is a long-term real annual return of 5%, while Barnette's projected annual real rate of return for the endowment is 4% arithmetically (3.92% geometrically), calculated as follows: Global equity: (40%) (6.5%) = 2.6% Private equity: (20%) (8.5%) = 1.7% Real assets: (15%) (5.0%) = 0.75% Hedge funds: (15%) (5.0%) = 0.75% US Treasuries: (10%) (2.0%) = 0.2%<br>Projected nominal return = 2.6% + 1.7% + 0.75% + 0.75% + 0.2% = 6.0%<br>Projected annual real rate of return = Projected nominal return – Projected<br>inflation rate = 6% – 2% = 4% (arithmetic)<br>Alternatively, (1.06 / 1.02) – 1 = 3.92% (geometric)"]}, {"type": "mc", "points": 1, "prompt": "<p>Which of the following business segments is best aligned with Barnette's suggested focus for the endowment's climate-related investments?</p>", "choices": ["Smart grids", "Clean energy", "Sustainable agriculture"], "num": 7, "correctIndex": 2, "correctText": "Sustainable agriculture", "feedback": ["Correct because sustainable agriculture is characterized as a climate adaptation opportunity. Climate adaptation includes companies that would help better adjust to actual or expected future change in climate with an aim to reduce vulnerability to the harmful effects of climate change, such as food insecurity, sea-level rise, and frequent extreme weather events."]}]}, {"topic": "PORTFOLIO MANAGEMENT", "points": 12, "narrative": "<p>Anna Kalamakis is an investment consultant specializing in liability-driven investing. She meets with Jake Christie, the CFO of Otton Corp., a power generation company.</p>\n<p>Christie would like to immunize an outstanding zero-coupon bond liability that matures in five years. The liability has a book value of $853 million and a market value of $850 million. She considers the three portfolios in Exhibit 1 for the immunization. All three portfolios have sufficiently close cash flow yields. The yield curve is upward sloping.</p>\n<div class=\"exhibit-title\">Exhibit 1</div>\n<table class=\"exhibit-table\"><tr><td></td><td>Portfolio A</td><td>Portfolio B</td><td>Portfolio C</td></tr><tr><td>Market value ($ millions)</td><td>845.00</td><td>851.30</td><td>853.00</td></tr><tr><td>Macaulay duration</td><td>5.10</td><td>5.01</td><td>5.04</td></tr><tr><td>Convexity</td><td>25.00</td><td>29.00</td><td>35.00</td></tr></table>\n<p>Kalamakis knows that, as the duration changes over time, the immunization portfolio needs to be rebalanced. She considers using two interest rate derivatives for this purpose: government bond futures and market reference rate (MRR) interest rate swaps. She evaluates which derivative would introduce the least amount of spread risk to the immunization.</p>\n<p>Kalamakis then meets with another client, Mike Samuelson, who is the manager of the Nexus Forge defined benefit pension plan. The plan was previously immunized and now has a duration gap. The plan's characteristics are presented in Exhibit 2.</p>\n<div class=\"exhibit-title\">Exhibit 2</div>\n<table class=\"exhibit-table\"><tr><td>Market value of liabilities ($ millions)</td><td>729</td></tr><tr><td>Market value of assets ($ millions)</td><td>687</td></tr><tr><td>Modified duration of liabilities</td><td>11.36</td></tr><tr><td>Modified duration of assets</td><td>7.02</td></tr><tr><td>Basis point value (BPV) of liabilities ($)</td><td>828,144</td></tr><tr><td>BPV of assets ($)</td><td>482,274</td></tr></table>\n<p>Samuelson is concerned about the pension plan's interest rate exposure if the duration gap is not closed. He asks Kalamakis to analyze how the plan's funding status would change under three yield curve scenarios.</p>\n<ul><li>a parallel upward shift</li><li>a parallel downward shift</li><li>a bear steepening with short-term rates remaining unchanged</li></ul>\n<p>Kalamakis recommends using a 10-year, 2.90% receive-fixed interest rate swap with an effective duration of 8.24 and a BPV of $0.1743 per $100 of notional principal to close the plan's duration gap.</p>", "questions": [{"type": "essay", "points": 3, "prompt": "<p><strong>Determine</strong> which portfolio best immunizes Otton's zero-coupon bond liability. (Portfolio A, Portfolio B, Portfolio C) <strong>Justify</strong> your response.</p>", "num": 8, "feedback": ["Kalamakis should recommend the portfolio that covers the value of the liability and minimizes the structural risks of twists and non-parallel shifts in the yield curve. Portfolio B is the only portfolio that satisfies all three criteria for immunizing a single liability: 1. has an initial market value that equals or exceeds the present value of the liability, 2. has a portfolio Macaulay duration that matches the liability's due date, and 3. minimizes the portfolio's convexity statistic. Market value: The immunization portfolio should have a market value that is equal to or exceeds the market value of the liability. Portfolio A has a market value of $845 million, below the market value of the liability of $850 million. So Kalamakis can only consider Portfolios B and C, which have higher market values than the liability. Macaulay duration and convexity: Both Portfolios B and C have duration that is close to that of the liability (5.01 and 5.04, respectively); however, Portfolio B has lower convexity of 29 versus Portfolio C's convexity of 35. Therefore, Portfolio B will be best for immunization as it will minimize structural risk."]}, {"type": "essay", "points": 3, "prompt": "<p><strong>Determine</strong> which of the derivatives that Kalamakis considers for rebalancing would introduce the least amount of spread risk to the Otton's immunization. (Government bond futures, Interest rate swaps) <strong>Justify</strong> your response.</p>", "num": 9, "feedback": ["The futures contracts are based on government bonds whereas Otton's liability is a corporate bond. Typically, there is less volatility in the corporate/swap spread than in the corporate/government bond spread because both the swap rate and corporate bond yields contain credit risk vis-à-vis government bonds. Therefore, one of the usual advantages to hedging corporate bond risk with interest rate", "swaps is that those derivatives pose less spread risk than government bond futures contracts."]}, {"type": "essay", "points": 3, "prompt": "<p><strong>Determine</strong> which interest rate scenario would most likely cause the funding status of the Nexus Forge pension plan to deteriorate. (Parallel upward shift, Parallel downward shift, Bear steepening) <strong>Justify</strong> your response.</p>", "num": 10, "feedback": ["If interest rates go down, the market value of the liabilities, which have a modified duration of 11.36, will increase by more than the market value of the assets, which have a modified duration of 7.02. As a result, the funding status of the plan will deteriorate. In a parallel upward shift scenario, the market value of liabilities will decrease by more than the market value of assets and the funding status of the plan will improve. In a bear steepening scenario, with short-term rates remaining unchanged and long-term rates going up, the market value of liabilities will decrease by more than the market value of assets and the funding status of the plan will improve."]}, {"type": "essay", "points": 3, "prompt": "<p><strong>Calculate</strong> the notional principal (in $) of the interest rate swap that would reduce the duration gap of the Nexus Forge pension plan to zero.</p>", "num": 11, "feedback": ["The notional principal of the interest rate swap needed to reduce the duration gap to zero can be calculated with this expression: Asset BPV + [NP × Swap BPV/100] = Liability BPV Asset BPV is $482,274, liability BPV is $828,144, and swap BPV is $0.1743 per $100 of notional principal. $482,274 + [NP × $0.1743/$100] = $828,144<br>NP = [$828,144 – $482,274] × $100/$0.1743 = $198,433,735", "Vignette", "TOPIC: PORTFOLIO MANAGEMENT TOTAL POINT VALUE OF THIS QUESTION SET IS 12 POINTS", "Marketdex, Inc. publishes various equity index products including the Marketdex Low Volatility Europe Index, which tracks 205 stocks from 13 European countries. Stocks from the UK, France, Switzerland, and Germany make up about 75% of the index. Index returns are based on daily closing prices from each constituent stock’s primary exchange (e.g., London Stock Exchange, Euronext Paris) converted to USD as of the primary market close. Currently, there are no listed futures for the Marketdex Low Volatility Europe Index, although the MSCI Minimum Volatility regional indices do have futures available in the US. Centerpoint Management and Research Company (CMR) manages and markets investment products in the US such as the Low Volatility Europe ETF (LVEU) and the Low Volatility Europe Institutional Shares mutual fund (LVEUX). Both funds are designed to track the Marketdex Low Volatility Europe Index and are managed by the same team, resulting in similar portfolio compositions. Equity futures are used to manage cash flows for both funds, and trades are executed through major brokerage firms using market-on-close (MOC) orders. For performance reporting, CMR applies the same pricing practices as Marketdex for the LVEUX mutual fund but follows pricing practices required for exchange-traded stocks for the LVEU ETF. Both CMR funds engage in securities lending and use local brokers to trade foreign stocks, with European brokers often offering commission-free MOC trades to attract passive investors. Typical commissions for market purchases average around 0.25%. Key performance data for the two CMR funds is summarized in Exhibit 1. Exhibit 1 Low Volatility       Low Volatility Europe Fund Name                             Europe ETF          Institutional Shares (LVEU)           Mutual Fund (LVEUX) Number of holdings                         98                       99 Purchase cost (load)                      N/A                     0.25% Annual management fee                    0.22%                    0.24% 3-year annualized tracking 1.15%                    0.67% error 3-year annualized excess 0.05%                   –0.03% return"]}]}, {"topic": "PORTFOLIO MANAGEMENT", "points": 12, "narrative": "<p>Marketdex, Inc. publishes various equity index products including the Marketdex Low Volatility Europe Index, which tracks 205 stocks from 13 European countries. Stocks from the UK, France, Switzerland, and Germany make up about 75% of the index. Index returns are based on daily closing prices from each constituent stock's primary exchange (e.g., London Stock Exchange, Euronext Paris) converted to USD as of the primary market close. Currently, there are no listed futures for the Marketdex Low Volatility Europe Index, although the MSCI Minimum Volatility regional indices do have futures available in the US.</p>\n<p>Centerpoint Management and Research Company (CMR) manages and markets investment products in the US such as the Low Volatility Europe ETF (LVEU) and the Low Volatility Europe Institutional Shares mutual fund (LVEUX). Both funds are designed to track the Marketdex Low Volatility Europe Index and are managed by the same team, resulting in similar portfolio compositions. Equity futures are used to manage cash flows for both funds, and trades are executed through major brokerage firms using market-on-close (MOC) orders.</p>\n<p>For performance reporting, CMR applies the same pricing practices as Marketdex for the LVEUX mutual fund but follows pricing practices required for exchange-traded stocks for the LVEU ETF. Both CMR funds engage in securities lending and use local brokers to trade foreign stocks, with European brokers often offering commission-free MOC trades to attract passive investors. Typical commissions for market purchases average around 0.25%. Key performance data for the two CMR funds is summarized in Exhibit 1.</p>\n<div class=\"exhibit-title\">Exhibit 1</div>\n<table class=\"exhibit-table\"><tr><td>Fund Name</td><td>Low Volatility Europe ETF (LVEU)</td><td>Low Volatility Europe Institutional Shares Mutual Fund (LVEUX)</td></tr><tr><td>Number of holdings</td><td>98</td><td>99</td></tr><tr><td>Purchase cost (load)</td><td>N/A</td><td>0.25%</td></tr><tr><td>Annual management fee</td><td>0.22%</td><td>0.24%</td></tr><tr><td>3-year annualized tracking error</td><td>1.15%</td><td>0.67%</td></tr><tr><td>3-year annualized excess return</td><td>0.05%</td><td>–0.03%</td></tr></table>", "questions": [{"type": "mc", "points": 1, "prompt": "<p>The type of investment and portfolio construction approach most likely used by both the LVEU ETF and the LVEUX mutual fund is:</p>", "choices": ["full replication.", "derivatives-based.", "stratified sampling with optimization."], "num": 12, "correctIndex": 2, "correctText": "stratified sampling with optimization.", "feedback": ["Correct because a stratified sampling approach combined with optimization could be used to limit the number of smaller holdings and is a plausible implementation to produce low tracking error with a somewhat reduced number of holdings."]}, {"type": "mc", "points": 1, "prompt": "<p>The factor that increases the published tracking error of the LVEU ETF but not the LVEUX mutual fund is most likely the:</p>", "choices": ["effect of management fees.", "effect of market bid–ask spreads on trade prices.", "difference in pricing practices between the index and the fund."], "num": 13, "correctIndex": 2, "correctText": "difference in pricing practices between the index and the fund.", "feedback": ["Correct because index constituent prices and returns are based on the closing prices of the primary markets, with major European exchanges closing at 4:30 p.m. London time (11:30 a.m. New York time). Both daily index returns and mutual fund prices and returns are determined using equity prices and foreign exchange rates published at this time. For the ETF, which trades in the US like a stock, the daily price is the last trade price at the US market close. Although the ETF holdings’ local currency prices remain unchanged after European markets close, changes in foreign exchange rates (e.g., EUR/USD and GBP/USD) and market sentiment in US afternoon trading are reflected in the ETF’s trading price during the remainder of the day. This may lead to increased tracking error for the LVEU ETF compared to the LVEUX mutual fund, which does not experience similar effects."]}, {"type": "mc", "points": 1, "prompt": "<p>The factor that decreases a fund investor's realized excess return in the LVEU ETF but not the LVEUX mutual fund is most likely the:</p>", "choices": ["effect of management fees.", "effect of market bid–ask spreads on trade prices.", "difference in pricing practices between the index and the fund."], "num": 14, "correctIndex": 1, "correctText": "effect of market bid–ask spreads on trade prices.", "feedback": ["Correct because a fund investor’s realized returns include the effect of both direct and indirect trading costs. The direct cost to purchase shares of each fund (commissions for LVEU, the load for LVEUX) are both about 0.25%. However, investor trades in ETF shares are also subject to indirect market bid–ask spread costs in the same manner as ordinary equity trades. In contrast, mutual fund shares are traded directly with the fund management company at the daily fund price with no market spread effect. In addition, fund manager trades for the mutual fund portfolio can be accomplished at the same net market closing prices used in determining benchmark index returns due to the zero-commission trading arrangements offered by the European brokers."]}, {"type": "mc", "points": 1, "prompt": "<p>The impact on fund excess returns of securities lending activity is most likely:</p>", "choices": ["positive for both funds.", "negative for both funds.", "positive for one fund and negative for the other."], "num": 15, "correctIndex": 0, "correctText": "positive for both funds.", "feedback": ["Correct because securities lending generates revenue for the lending fund, and both funds participate in the CMR securities lending program. All securities lending activity will contribute positively to fund performance and have no negative impact on returns. Although the amount of securities lending revenue to each fund may be unpredictable, the direction of its impact is not."]}]}, {"topic": "PORTFOLIO CONSTRUCTION", "points": 12, "narrative": "<p>Boris Yankov is a fixed-income investment consultant. He is reviewing various fixed-income strategies for three clients.</p>\n<p>Client A, a pension fund, has a bond portfolio of only short-term and long-term government bonds. Yankov recommends adding a corporate bond fund to Client A's portfolio. Client A plans to use 50% leverage when buying the corporate bond fund. The corporate bond fund's expected return is 9.1% for the next year. Client A's cost of borrowing is 6.0% and the annualized required rate of return for the levered investment is a minimum of 11.5%.</p>\n<p>Client A is also considering adding one of the three bonds shown in Exhibit 1 to its portfolio and is concerned about differences in liquidity. Based on the bonds' characteristics in Exhibit 1, Yankov determines which of the three bonds has the lowest liquidity premium.</p>\n<div class=\"exhibit-title\">Exhibit 1</div>\n<table class=\"exhibit-table\"><tr><td>Characteristic</td><td>Bond X</td><td>Bond Y</td><td>Bond Z</td></tr><tr><td>Credit rating</td><td>A</td><td>A</td><td>BBB</td></tr><tr><td>Maturity</td><td>3 years</td><td>5 years</td><td>5 years</td></tr><tr><td>Bond issues outstanding from the issuer</td><td>13</td><td>7</td><td>2</td></tr></table>\n<p>Client B asks for a breakdown of the expected return for one of their domestic bond portfolios. Yankov gathers the relevant characteristics and expectations for the bond portfolio in Exhibit 2. Yankov expects yield spreads to remain unchanged.</p>\n<div class=\"exhibit-title\">Exhibit 2</div>\n<table class=\"exhibit-table\"><tr><td>Notional principal of portfolio (in millions)</td><td>$100.00</td></tr><tr><td>Investment horizon</td><td>1 year</td></tr><tr><td>Current bond price</td><td>$92.48</td></tr><tr><td>Expected bond price in 1 year (assuming an unchanged yield curve)</td><td>$94.00</td></tr><tr><td>Average annual bond coupon payment (per $100 par value)</td><td>$1.00</td></tr><tr><td>Average bond convexity in 1 year</td><td>25</td></tr><tr><td>Average bond modified duration in 1 year</td><td>1.9</td></tr><tr><td>Expected average change in benchmark yield-to-maturity</td><td>0.5%</td></tr></table>\n<p>Finally, Yankov works with Client C which has an allocation to callable bonds in their portfolio. Yankov expects interest rates to change over the coming year and recommends the client sell the callable bonds and replace them with non-callable bonds while maintaining the same portfolio duration. Client C asks how the convexity of the portfolio would be affected.</p>", "questions": [{"type": "essay", "points": 3, "prompt": "<p><strong>Determine</strong> if the leveraged corporate bond fund investment meets Client A's minimum return requirement. (Does meet, Does not meet) <strong>Justify</strong> your response.</p>", "num": 16, "feedback": ["Leverage increases portfolio returns if the securities in the portfolio have returns higher than the cost of borrowing.<br>Leveraged return = r1 + VB / VE (r1 – rB)<br>where:<br>r1 = Return on the invested funds (investment returns) = 9.1%<br>VB = Borrowed funds = 50%<br>VE = Value of the portfolio’s equity = 100%<br>rB = Borrowing rate (cost of borrowing) = 6%<br>The leveraged investment return for the corporate bond fund is: 9.1% + 50% / 100% × (9.1% – 6.0%) = 9.1% + 0.5 × 3.1% = 9.1% + 1.55% = 10.65% This does not meet the client's required return of 11.5% from the leveraged investment and hence the investment should not be made."]}, {"type": "essay", "points": 3, "prompt": "<p><strong>Determine</strong> which bond most likely has the lowest liquidity premium. (Bond X, Bond Y, Bond Z) <strong>Justify</strong> your response with two reasons. <em>Note: Each justification should be in a separate paragraph.</em></p>", "num": 17, "feedback": ["A bond's liquidity is determined by several factors. Bonds of large, high-credit- quality corporations that have many outstanding bond issues are the most liquid among corporate bonds, and thus they have relatively low bid–ask spreads compared with smaller, less creditworthy companies. Liquid bonds have lower liquidity premium than illiquid bonds. Bond X has the same credit quality as Bond Y but has more bonds outstanding and shorter maturity and is likely the more liquid holding. Bond X has lower maturity, has better credit quality, has more bonds outstanding than Bond Z and hence is the more liquid holding. While Bond Y and Bond Z have the same maturity, neither would be more liquid when compared to Bond X which has a shorter maturity and more bond issues outstanding. Low credit ratings, longer time since issuance, smaller issuance size, smaller issuance outstanding, and longer time to maturity typically are associated with lower liquidity (and thus a higher liquidity premium). Conversely, higher credit quality, higher issuance outstanding and shorter time to maturity are typically associated with higher liquidity (and thus a lower liquidity premium). Regarding credit quality, an investor is likely to find that bonds of a highly creditworthy government issuer are more liquid, have greater price transparency,", "and have lower search costs than bonds of, for example, a corporate issuer with lower credit quality."]}, {"type": "essay", "points": 3, "prompt": "<p><strong>Calculate</strong> the rolling yield for Client B's bond portfolio.</p>", "num": 18, "feedback": ["The sum of the coupon income and the rolldown return is referred to as the bond’s rolling yield. Coupon income (or current yield) = Annual coupon payment / Current bond price<br>= $1.00 / $92.48<br>= 1.08%<br>Rolldown return = (Bond price End-of-horizon period – Bond price Beginning-of-horizon<br>period) / Bond price Beginning-of-horizon period<br>= ($94.00 – $92.48) / $92.48<br>= $1.52 / $92.48<br>= 1.64%<br>Rolling yield = 1.08% + 1.64% = 2.72%"]}, {"type": "essay", "points": 3, "prompt": "<p><strong>Determine</strong> the most likely impact on Client C's portfolio convexity if Yankov's recommendation is implemented. (Decrease, Remain the same, Increase) <strong>Justify</strong> your response.</p>", "num": 19, "feedback": ["Client B's bond portfolio consists of an allocation to callable bonds (which have negative convexity). A callable bond exhibits negative convexity because when interest rates fall, its price does not increase as much as a non-callable bond as it is likely to be called by the issuer at par. Yankov's recommendation to replace callable bonds with non-callable bonds of the same duration will increase the convexity of the portfolio (sell negative convexity, buy positive convexity). Convexity is more valuable when yields to", "maturity are volatile. Since Yankov expects the yield to maturity to be more volatile in the future, he recommends increasing convexity, by selling negative convexity.", "Vignette", "TOPIC: ETHICAL AND PROFESSIONAL STANDARDS TOTAL POINT VALUE OF THIS QUESTION SET IS 12 POINTS", "Martin Johnson, CFA, is a portfolio manager at Blanco Asset Management, a firm that advises large non-profit organizations. Johnson obtains a meeting with non-profit organization VR Research, which is searching for a new firm to manage its endowment portfolio. In preparing for the meeting, Johnson reviews a list of selected current clients who have given their permission to appear in Blanco's marketing materials. Johnson meets with Michael Reed, the VR board chairman, and delivers the list. Reed tells Johnson that he is impressed by the inclusion of VR's largest competitor in Blanco's client list. A few days later, Johnson learns that the list was incorrect as Blanco had received a termination notice from VR's competitor prior to the meeting with Reed. Johnson does not communicate to Reed that the mandate of VR's competitor has been terminated. Johnson learns that Reed is a candidate in an upcoming local political election. After the meeting, Johnson makes a substantial monetary contribution to Reed's election campaign fund. He does not disclose his contribution to Blanco. One month later, Blanco wins the VR mandate and Johnson is named the portfolio manager for the account. Johnson is approached by a stock promoter for Surf Pharma Inc. The promoter offers to pay Johnson a commission fee if he purchases Surf Pharma stock for clients. Johnson analyzes Surf Pharma and concludes that it is a suitable investment for VR. After purchasing Surf Pharma's stock for the VR account, Johnson is invited to join the board of Surf Pharma. He will receive $50,000 per year from Surf Pharma for his service as a board director. Johnson's role as a Surf Pharma director is disclosed to Blanco clients. Johnson builds substantial positions in Seagull Biotech Inc. stock for the VR account, his personal account, and a proprietary Blanco account. After a strong earnings report, Seagull shares surge well past Johnson's price target. Johnson's updated research suggests that Seagull is now overvalued. He sells VR's position, then executes a block trade that includes both his own shares and those in the Blanco account. Because Seagull's share price continues to rise during this time, he realizes a higher price in his own and in Blanco's account than he did for VR."]}]}, {"topic": "ETHICAL AND PROFESSIONAL STANDARDS", "points": 12, "narrative": "<p>Martin Johnson, CFA, is a portfolio manager at Blanco Asset Management, a firm that advises large non-profit organizations.</p>\n<p>Johnson obtains a meeting with non-profit organization VR Research, which is searching for a new firm to manage its endowment portfolio. In preparing for the meeting, Johnson reviews a list of selected current clients who have given their permission to appear in Blanco's marketing materials. Johnson meets with Michael Reed, the VR board chairman, and delivers the list. Reed tells Johnson that he is impressed by the inclusion of VR's largest competitor in Blanco's client list. A few days later, Johnson learns that the list was incorrect as Blanco had received a termination notice from VR's competitor prior to the meeting with Reed. Johnson does not communicate to Reed that the mandate of VR's competitor has been terminated.</p>\n<p>Johnson learns that Reed is a candidate in an upcoming local political election. After the meeting, Johnson makes a substantial monetary contribution to Reed's election campaign fund. He does not disclose his contribution to Blanco. One month later, Blanco wins the VR mandate and Johnson is named the portfolio manager for the account.</p>\n<p>Johnson is approached by a stock promoter for Surf Pharma Inc. The promoter offers to pay Johnson a commission fee if he purchases Surf Pharma stock for clients. Johnson analyzes Surf Pharma and concludes that it is a suitable investment for VR. After purchasing Surf Pharma's stock for the VR account, Johnson is invited to join the board of Surf Pharma. He will receive $50,000 per year from Surf Pharma for his service as a board director. Johnson's role as a Surf Pharma director is disclosed to Blanco clients.</p>\n<p>Johnson builds substantial positions in Seagull Biotech Inc. stock for the VR account, his personal account, and a proprietary Blanco account. After a strong earnings report, Seagull shares surge well past Johnson's price target. Johnson's updated research suggests that Seagull is now overvalued. He sells VR's position, then executes a block trade that includes both his own shares and those in the Blanco account. Because Seagull's share price continues to rise during this time, he realizes a higher price in his own and in Blanco's account than he did for VR.</p>", "questions": [{"type": "mc", "points": 1, "prompt": "<p>Does Johnson violate the Standards in his actions involving Blanco's client list?</p>", "choices": ["No", "Yes, by delivering the client list with incorrect information", "Yes, by failing to communicate the correction to the client list"], "num": 20, "correctIndex": 2, "correctText": "Yes, by failing to communicate the correction to the client list", "feedback": ["Correct because Standard I(C) states that Members and Candidates must not knowingly make any misrepresentations relating to investment analysis, recommendations, actions or other professional activities. A misrepresentation may be made by noncorrection of known errors. By failing to inform Reed that the mandate of VR's competitor had been terminated, Johnson has violated Standard I(C). Even though he may not have been directly responsible for the misrepresentation concerning the mandate of VR's competitor in Blanco's client list, Johnson became aware of the misrepresentation and should have informed Reed that the mandate of VR's competitor had been terminated."]}, {"type": "mc", "points": 1, "prompt": "<p>With regard to his contribution to the election campaign fund, Johnson violates the Standard relating to independence and objectivity:</p>", "choices": ["only because Reed is a prospective client.", "only because Johnson does not disclose the contribution to Blanco.", "both because Reed is a prospective client and because Johnson does not disclose the contribution to Blanco."], "num": 21, "correctIndex": 0, "correctText": "only because Reed is a prospective client.", "feedback": ["Correct because Standard I(B) Independence and Objectivity states that Members and Candidates must use reasonable care and judgment to achieve and maintain independence and objectivity in their professional activities. Members and Candidates must not offer, solicit, or accept any gift, benefit, compensation or consideration that reasonably could be expected to compromise their own or another's independence and objectivity. Johnson's contribution to Reed's political campaign fund is done with the intent to gain", "Reed's favor at a time when VR's board is considering whether to approve Blanco's mandate and can reasonably be expected to compromise Reed's independence and objectivity towards Blanco and Johnson. To that extent, Johnson's contribution is in violation of Standard I(B)."]}, {"type": "mc", "points": 1, "prompt": "<p>To comply with the Standards, what must Johnson disclose to VR regarding Surf Pharma?</p>", "choices": ["The commission fee only", "The board compensation only", "Both the commission fee and the board compensation"], "num": 22, "correctIndex": 0, "correctText": "The commission fee only", "feedback": ["Correct because Standard VI(A) Disclosure of Conflicts states that Members and Candidates must make full and fair disclosure of all matters that could reasonably be expected to impair their independence and objectivity or interfere with respective duties to their clients, prospective clients, and employer. Members and Candidates must ensure that such disclosures are prominent, and are delivered in plain language, and communicate the relevant information effectively. Under Standard VI(A), members and candidates are required to disclose additional compensation arrangements for recommending and selling stock to their clients. Under Standard VI(A), Johnson is required to disclose to VR as his client the commission fee as additional compensation provided by Surf Pharma for the purchase of the stock in VR's portfolio."]}, {"type": "mc", "points": 1, "prompt": "<p>When selling the Seagull Biotech shares, does Johnson violate the Standards?</p>", "choices": ["No", "Yes, because he sold his own shares at the same time as those of his employer", "Yes, because he obtained a better price for himself and his employer than for the client"], "num": 23, "correctIndex": 1, "correctText": "Yes, because he sold his own shares at the same time as those of his employer", "feedback": ["Correct because members or candidates may undertake transactions in accounts for which they are a beneficial owner only after their clients and employers have had adequate opportunity to act on a recommendation. By executing his order simultaneously with that of the Blanco account, Johnson violates Standard VI(B) Priority of Transactions."]}]}, {"topic": "PORTFOLIO MANAGEMENT", "points": 12, "narrative": "<p>Leia Christensen is an equity fund manager. She manages two funds that follow a growth at a reasonable price (GARP) strategy. The Opportunities Fund is a small-cap and mid-cap fund, while the Horizons Fund is a large-cap fund.</p>\n<p>Due to the growth of the Opportunities Fund, the average trade sizes and trade volumes of the Opportunities Fund and the Horizons Fund are now similar. Christensen examines the difference in the slippage costs between the two funds in the current upward trending market.</p>\n<p>Christensen recently increased the Horizons Fund's allocation to the utilities sector, reducing its underweight to its benchmark. This increased allocation was funded using the fund's cash holdings. She reviews the risk profile of the fund after the allocation change.</p>\n<p>Christensen considers two companies as possible investments for the Horizons Fund. She wants to determine which company is most suitable for the fund based on the GARP approach. Selected information of the two companies is shown in Exhibit 1.</p>\n<div class=\"exhibit-title\">Exhibit 1</div>\n<table class=\"exhibit-table\"><tr><td>Company</td><td>Share Price</td><td>12-Month Forward EPS</td><td>3-Year EPS Growth Forecast</td><td>Dividend Yield</td><td>Sector Average P/E</td></tr><tr><td>1</td><td>$25.94</td><td>$3.38</td><td>9.7%</td><td>1.7%</td><td>11.1</td></tr><tr><td>2</td><td>$166.01</td><td>$5.84</td><td>13.2%</td><td>3.0%</td><td>18.3</td></tr></table>\n<p>Christensen's research team has identified Company 3 as a potential activist investor target and as a potential investment for the Horizons Fund. Company 3 sells digital interactive fitness products and has a market capitalization of $13 billion. Despite strong growth in the years following its IPO, competitive pressure has recently eroded its sales growth and the company has struggled to maintain its growth relative to its peers. Following a net loss reported for the past year, the company's share price declined 44%. The company's corporate governance has been classified as better-than-average when compared to its peers by an independent research firm.</p>", "questions": [{"type": "essay", "points": 3, "prompt": "<p><strong>Determine</strong> which fund most likely has higher slippage costs. (Horizons Fund, Opportunities Fund) <strong>Justify</strong> your response.</p>", "num": 24, "feedback": ["Slippage is often measured as the difference between the execution price and the midpoint of the bid and ask quotes at the time the trade was first entered. It incorporates both the effect of volatility/trend costs and market impact. Volatility/trend costs are the costs associated with buying in a rising market and selling in a declining market. Studies have shown that small-cap stocks have consistently had higher effective trading costs than large-cap stocks. It is difficult to quantify this cost, but we know intuitively that a given trading volume causes a", "larger price move for a less liquid asset. The larger a trade size relative to a stock's average daily volume, the more likely the trade will affect prices. In the case, the Opportunities Fund is a small- and mid-cap fund, while the Horizons Fund is a large-cap fund. Since the average size of the trades of both funds is similar and the trade volumes are comparable, slippage costs would be higher for the Opportunities Fund."]}, {"type": "essay", "points": 3, "prompt": "<p><strong>Determine</strong>, based on the recent change in its asset allocation, the most likely effect on the Horizons Fund's active risk. (Decrease, No change, Increase) <strong>Justify</strong> your response.</p>", "num": 25, "feedback": ["Active risk depends on the difference between the security weights in the portfolio and the security weights in the benchmark. On the other hand, cash has higher active risk because it has a low correlation with the equity benchmark. Therefore, by reducing cash to reduce the utilities sector deviation from the benchmark weight, active risk decreases."]}, {"type": "essay", "points": 3, "prompt": "<p><strong>Determine</strong>, based on the GARP approach, which company is most suitable for the Horizons Fund. (Company 1, Company 2) <strong>Justify</strong> your response.</p>", "num": 26, "feedback": ["Company 1's forward P/E is 25.94/3.38 = 7.67, and its P/E-to-growth ratio (PEG) is 7.67/9.7 = 0.79. Company 2's forward P/E is 166.01/5.84 = 28.43, and its P/E-to-growth ratio (PEG) is 28.43/13.2 = 2.15. GARP (growth at a reasonable price) is a sub-discipline within growth investing. This approach is used by investors who seek out companies with above-average growth that trade at reasonable valuation multiples and is often referred to as a", "hybrid of growth and value investing. Many investors who use GARP rely on the P/E-to-growth (PEG) ratio."]}, {"type": "essay", "points": 3, "prompt": "<p><strong>Discuss</strong> why Company 3 would be considered an attractive investment by an activist investor.</p>", "num": 27, "feedback": ["Activist investors look for specific characteristics in deciding which companies to target. On average, target companies feature slower revenue and earnings growth than the market, suffer negative share price momentum and have weaker-than- average corporate governance. Company 3 is most likely an activist target as it is not able to maintain its growth compared to rivals and suffers negative share price momentum. Both of these elements are required for the company to be considered attractive. If sales growth has declined without a share price decline or the price declines without a growth decline, then the activist investor may not be able to make changes to improve the share price, which is their objective. The recent net loss and better-than-average corporate governance would not make Company 3 attractive to an activist investor. The recent net loss does not signal a sustained operating challenge and the better corporate governance does not provide as much opportunity to make management changes to improve growth and share price as in companies with weaker-than-average governance.", "Vignette", "TOPIC: PERFORMANCE MEASUREMENT TOTAL POINT VALUE OF THIS QUESTION SET IS 12 POINTS", "Valerie Janovich is the performance consultant for the defined benefit pension plan of Palmer School District. The plan has allocations to equities and bonds and delegates portfolio management to external managers. In a meeting with the plan trustees, Janovich first discusses the performance of the plan’s equity allocation. The plan has one all-cap growth manager and one large-cap value manager, and has overweighted its allocation to growth relative to its benchmark. Exhibit 1 presents the Brinson returns-based attribution at the plan level. In her attribution analysis, Janovich includes the interaction effect as part of selection. Exhibit 1 Selection       Allocation         Total Growth manager         0.87%           0.14%            1.01% Value manager                  0.06%                0.14%                0.20%", "A trustee asks Janovich about the equity benchmarks used in the attribution analysis. Janovich states that each equity benchmark reflects the investment discipline of the manager and incorporates restrictions on security weights imposed by the plan. Another item on the meeting agenda is whether to hire a small-cap value manager that Janovich has evaluated. Compared to its chosen benchmark, for the past 20 quarters the manager’s upside capture was 112% and its downside capture was 95%. Janovich is evaluating an alternative benchmark for the small-cap value manager. Janovich uses the following characteristics to test the benchmark’s quality.", "The correlation between active returns and style returns is 0.15 The correlation between style returns and returns in excess of the broad market is 0.80 Both correlations are statistically different from zero"]}]}, {"topic": "PERFORMANCE MEASUREMENT", "points": 12, "narrative": "<p>Valerie Janovich is the performance consultant for the defined benefit pension plan of Palmer School District. The plan has allocations to equities and bonds and delegates portfolio management to external managers.</p>\n<p>In a meeting with the plan trustees, Janovich first discusses the performance of the plan's equity allocation. The plan has one all-cap growth manager and one large-cap value manager, and has overweighted its allocation to growth relative to its benchmark. Exhibit 1 presents the Brinson returns-based attribution at the plan level. In her attribution analysis, Janovich includes the interaction effect as part of selection.</p>\n<div class=\"exhibit-title\">Exhibit 1</div>\n<table class=\"exhibit-table\"><tr><td></td><td>Selection</td><td>Allocation</td><td>Total</td></tr><tr><td>Growth manager</td><td>0.87%</td><td>0.14%</td><td>1.01%</td></tr><tr><td>Value manager</td><td>0.06%</td><td>0.14%</td><td>0.20%</td></tr></table>\n<p>A trustee asks Janovich about the equity benchmarks used in the attribution analysis. Janovich states that each equity benchmark reflects the investment discipline of the manager and incorporates restrictions on security weights imposed by the plan.</p>\n<p>Another item on the meeting agenda is whether to hire a small-cap value manager that Janovich has evaluated. Compared to its chosen benchmark, for the past 20 quarters the manager's upside capture was 112% and its downside capture was 95%.</p>\n<p>Janovich is evaluating an alternative benchmark for the small-cap value manager. Janovich uses the following characteristics to test the benchmark's quality.</p>\n<ul><li>The correlation between active returns and style returns is 0.15</li><li>The correlation between style returns and returns in excess of the broad market is 0.80</li><li>Both correlations are statistically different from zero</li></ul>", "questions": [{"type": "mc", "points": 1, "prompt": "<p>The value added by the plan's decision to hire the growth manager is:</p>", "choices": ["0.14%.", "0.87%.", "1.01%."], "num": 28, "correctIndex": 1, "correctText": "0.87%.", "feedback": ["Correct because the value added from hiring the growth manager is that part of the return associated with selection plus interaction. After the Plan makes its decision to overweight growth, the value added by the manager that they hired is the selection plus interaction part of the return attribution. Looking to Exhibit 1, the selection plus interaction is 0.87%."]}, {"type": "mc", "points": 1, "prompt": "<p>The benchmarks used for the equity managers are best described as:</p>", "choices": ["returns-based.", "capitalization-based.", "custom security-based."], "num": 29, "correctIndex": 2, "correctText": "custom security-based.", "feedback": ["Correct because a benchmark that reflects the manager’s investment discipline that includes the restrictions placed by the client is best described as a custom security-based benchmark. Capitalization-based indices do not reflect client restrictions, so the only class of benchmark available is a custom type benchmark. Janovich notes that the benchmark does reflect Plan restrictions on security weights."]}, {"type": "mc", "points": 1, "prompt": "<p>The capture ratios for the small-cap value manager show:</p>", "choices": ["a concave return profile.", "a return profile with negative asymmetry.", "outperformance when the benchmark return was negative."], "num": 30, "correctIndex": 2, "correctText": "outperformance when the benchmark return was negative.", "feedback": ["Correct because a downside capture ratio < 100% (it is 95%) shows that the portfolio manager outperformed the benchmark when the benchmark return was negative. In essence, downside capture is the ratio of the manager’s return to the benchmark return when the benchmark return is negative. A value less than 100% indicates that when the benchmark return is negative, the manager’s return is less negative. In other words, the manager did better than the benchmark."]}, {"type": "mc", "points": 1, "prompt": "<p>Do the characteristics of the potential benchmark for the small-cap value manager indicate that it is a quality benchmark?</p>", "choices": ["Yes", "No, because of the correlation between active returns and style returns", "No, because of the correlation between style returns and returns in excess of the broad market"], "num": 31, "correctIndex": 1, "correctText": "No, because of the correlation between active returns and style returns", "feedback": ["Correct because the values reported in the vignette do not support a quality benchmark. Janovich examines two correlations:", "1. Correlation between the manager's active return (A) and style return (S) 2. Correlation between the style return (S) and the excess return (E)<br>where:<br>A = Manager's active return = Portfolio return – Benchmark return = P – B<br>S = Style return = B – M (where M is broad market)<br>E = Excess return = P – M<br>A good benchmark will exhibit zero correlation between A and S. That is, a good benchmark should show that the manager’s active decisions do not align with the style currently favored by the market (i.e., the manager’s decisions are good in up/down markets). In this case, however, the correlation between A and S of 0.15 is significantly different from zero, which does not support a quality benchmark. A good benchmark will also exhibit positive correlation between S and E. That is, when the manager’s style is in (out) of favor relative to the market, we expect both the benchmark and the account to outperform (underperform) the market – yielding a positive correlation. In this case, the correlation between S and E of 0.80 is significantly different from zero, which does support a quality benchmark."]}]}, {"topic": "ASSET ALLOCATION", "points": 12, "narrative": "<p>Dinesh Ferrera is a senior macro analyst at Lake Tree Associates, a wealth management firm that serves high-net-worth investors. Ferrera has been tasked with analyzing and forecasting asset class returns for various capital markets.</p>\n<p>Ferrera is using the building block approach to forecast expected fixed income returns in Country A, which is experiencing high growth and high inflation with the expectation of further increases in both. He believes that this growth and inflation are both being driven primarily by aggregate supply. Ferrera is considering the impact of these expectations on the term premium in Country A.</p>\n<p>Ferrera next examines the risks in the fixed-income market of Country B, an emerging market. He is aware that emerging market economies have many characteristics that make them more likely to experience distress. Using the macroeconomic data shown in Exhibit 1, Ferrera calculates several ratios to identify areas of potential vulnerability in Country B's economy.</p>\n<div class=\"exhibit-title\">Exhibit 1</div>\n<table class=\"exhibit-table\"><tr><td>Nominal GDP</td><td>$175.00 billion</td></tr><tr><td>Short-term external debt</td><td>$8.00 billion</td></tr><tr><td>Medium- and long-term external debt</td><td>$134.00 billion</td></tr><tr><td>Foreign exchange reserves</td><td>$7.25 billion</td></tr></table>\n<p>Finally, Ferrera is considering whether to change the asset allocation of a 50/50 equity–fixed income portfolio invested in Country C. The economy is approaching the trough of its current business cycle. However, since the last time the asset allocation was changed, Country C has begun to experience higher overall trend growth due to faster growth in productivity. Ferrera does not believe that these developments have been sufficiently reflected in stock or bond prices.</p>", "questions": [{"type": "essay", "points": 4, "prompt": "<p><strong>Determine</strong>, given the expectations for growth and inflation, the most likely impact on the term premium in Country A. (Decrease, Increase) <strong>Justify</strong> your response.</p>", "num": 32, "feedback": ["The term premium in Country A will most likely increase, for the following reasons:", "Level-dependent inflation uncertainty: Inflation is arguably the main driver of long-run variation in both nominal yields and the term premium. Higher levels of inflation (as in Country A) tend to coincide with greater inflation uncertainty. Hence, nominal yields rise with inflation because of changes in both expected inflation and the inflation risk component of the term premium. Ability to hedge recession risk: When growth and inflation are driven primarily by aggregate supply (as in Country A), nominal bond returns tend to be positively correlated with growth, necessitating a higher term premium."]}, {"type": "essay", "points": 4, "prompt": "<p><strong>Calculate</strong>, using data from Exhibit 1, one ratio whose level indicates potential vulnerability in Country B's economy.</p>", "num": 33, "feedback": ["Debt-to-GDP ratio = ($8.00 billion + $134.00 billion) / $175.00 billion = 81.1%. A debt-to-GDP ratio exceeding 70%–80%, perhaps of only mild concern for a developed market, is a sign of vulnerability for an emerging market. Foreign exchange reserves / short-term debt = $7.25 billion / $8.00 billion = 90.6%. Foreign exchange reserves less than 100% of short-term debt is risky."]}, {"type": "essay", "points": 4, "prompt": "<p><strong>Determine</strong> the most appropriate change in the equity allocation of the Country C portfolio. (Decrease, Increase) <strong>Justify</strong> your response with one reason related to the phase of the business cycle and one reason related to trend growth. <em>Note: Each justification should be in a separate paragraph.</em></p>", "num": 34, "feedback": ["The equity allocation of the Country C portfolio should be increased. Regarding the phase of the business cycle, the best time to buy equities is generally when the economy is approaching the trough of the business cycle (as in Country C). Valuation multiples and expected earnings growth rates are low and set to rise. At this stage of the cycle, the term premium is high (the yield curve is steep) and the credit premium is high (credit spreads are wide). However, short- term interest rates are likely to start rising soon, and the yield curve can be expected to flatten again as the economy gains strength. Regarding trend growth, all else the same, an increase in trend growth (as in Country C) favors equities because it implies more rapid long-run earnings growth. Faster growth due to productivity is especially beneficial. In contrast, higher trend growth generally results in somewhat higher real interest rates, a negative for currently outstanding bonds.", "Vignette", "TOPIC: PORTFOLIO MANAGEMENT TOTAL POINT VALUE OF THIS QUESTION SET IS 12 POINTS", "Annabel Stirton is a fixed-income advisor for an investment consulting firm. Stirton analyzes strategies for two of her clients, State Brook Management and the Solid Stream Fund. The domestic yield curve is upward sloping. State Brook Management State Brook manages separately managed accounts (SMAs) for its clients. Stirton gathers information about the portfolio weights for three SMAs in Exhibit 1. All three SMAs are invested in option-free government bonds. Negative signs indicate short positions. The portfolio manager for these SMAs expects a negative butterfly movement in the shape of the yield curve and asks Stirton to assess the performance of the SMAs if this movement occurs. Exhibit 1 SMA 1 SMA 2 SMA 3 Short-term bond portfolio       –50%        50%      50% Medium-term bond portfolio                  100%        –100%           0% Long-term bond portfolio                    –50%         50%           50%", "State Brook expects a significant increase in interest rate volatility. To position portfolios for this expectation, Stirton recommends State Brook sell option-free bonds from the", "portfolios and replace them with bonds with embedded options but otherwise similar characteristics to the bonds sold, or with derivative positions that would add to portfolio return if State Brook's expectation is realized. Solid Stream Fund Solid Stream is a long-only fixed-income fund that has the same duration as its benchmark index. The fund's mandate permits investment of up to 5% of the portfolio in securities outside of the index; however, all securities must have a maturity of less than or equal to ten years. The Solid Stream portfolio manager expects the yield curve to be unchanged in the next 12 months. Stirton proposes a positioning strategy to generate excess returns relative to the index. A year later, the manager changes the portfolio's duration and its portfolio key rate durations, expecting a change in the yield curve. Stirton compares the fund's active position to that of the index in Exhibit 2.", "Exhibit 2 Portfolio Key Rate Index Key Rate Maturity                                   Difference Duration           Duration 1 year          0.07              0.37       –0.30 5 years                  0.97                       0.97                 0.00 10 years                 3.57                       2.87                 0.70"]}]}, {"topic": "PORTFOLIO MANAGEMENT", "points": 12, "narrative": "<p>Annabel Stirton is a fixed-income advisor for an investment consulting firm. Stirton analyzes strategies for two of her clients, State Brook Management and the Solid Stream Fund. The domestic yield curve is upward sloping.</p>\n<p><strong>State Brook Management</strong></p>\n<p>State Brook manages separately managed accounts (SMAs) for its clients. Stirton gathers information about the portfolio weights for three SMAs in Exhibit 1. All three SMAs are invested in option-free government bonds. Negative signs indicate short positions. The portfolio manager for these SMAs expects a negative butterfly movement in the shape of the yield curve and asks Stirton to assess the performance of the SMAs if this movement occurs.</p>\n<div class=\"exhibit-title\">Exhibit 1</div>\n<table class=\"exhibit-table\"><tr><td></td><td>SMA 1</td><td>SMA 2</td><td>SMA 3</td></tr><tr><td>Short-term bond portfolio</td><td>–50%</td><td>50%</td><td>50%</td></tr><tr><td>Medium-term bond portfolio</td><td>100%</td><td>–100%</td><td>0%</td></tr><tr><td>Long-term bond portfolio</td><td>–50%</td><td>50%</td><td>50%</td></tr></table>\n<p>State Brook expects a significant increase in interest rate volatility. To position portfolios for this expectation, Stirton recommends State Brook sell option-free bonds from the portfolios and replace them with bonds with embedded options but otherwise similar characteristics to the bonds sold, or with derivative positions that would add to portfolio return if State Brook's expectation is realized.</p>\n<p><strong>Solid Stream Fund</strong></p>\n<p>Solid Stream is a long-only fixed-income fund that has the same duration as its benchmark index. The fund's mandate permits investment of up to 5% of the portfolio in securities outside of the index; however, all securities must have a maturity of less than or equal to ten years.</p>\n<p>The Solid Stream portfolio manager expects the yield curve to be unchanged in the next 12 months. Stirton proposes a positioning strategy to generate excess returns relative to the index.</p>\n<p>A year later, the manager changes the portfolio's duration and its portfolio key rate durations, expecting a change in the yield curve. Stirton compares the fund's active position to that of the index in Exhibit 2.</p>\n<div class=\"exhibit-title\">Exhibit 2</div>\n<table class=\"exhibit-table\"><tr><td>Maturity</td><td>Portfolio Key Rate Duration</td><td>Index Key Rate Duration</td><td>Difference</td></tr><tr><td>1 year</td><td>0.07</td><td>0.37</td><td>–0.30</td></tr><tr><td>5 years</td><td>0.97</td><td>0.97</td><td>0.00</td></tr><tr><td>10 years</td><td>3.57</td><td>2.87</td><td>0.70</td></tr></table>", "questions": [{"type": "mc", "points": 1, "prompt": "<p>Which SMA portfolio would perform the worst under the yield curve change expected by the State Brook portfolio manager?</p>", "choices": ["SMA 1", "SMA 2", "SMA 3"], "num": 35, "correctIndex": 0, "correctText": "SMA 1", "feedback": ["Correct because SMA 1 is a long bullet and short barbell and will incur losses in a negative butterfly scenario. A negative butterfly scenario indicates an increase in the butterfly spread due to an increase in medium-term yields and a decrease in short- and long-term yields. A short barbell position will incur losses if interest rates at the short- and long-term maturities of the yield curve decrease. A long position in a bullet will incur losses from rising interest rates at medium-term maturities."]}, {"type": "mc", "points": 1, "prompt": "<p>Given State Brook's volatility expectation, which of the following should Stirton recommend as a replacement for the option-free bonds?</p>", "choices": ["Long a callable bond", "Short a payer swaption", "Long a bond put option"], "num": 36, "correctIndex": 2, "correctText": "Long a bond put option", "feedback": ["Correct because State Brook expects a significant increase in interest rate volatility, therefore they should go long volatility. This can be done via a long position in a bond put option, which will give the investor the right to deliver a bond in the future. An active manager's choice between purchasing or selling bonds with embedded call or put options versus an option-free bond with otherwise similar characterist
