</td><td>Sector Allocation</td><td>Bond Selection</td><td>Total</td></tr><tr><td>–0.72%</td><td>0.18%</td><td>–0.54%</td><td>0.17%</td><td>0.12%</td><td>–0.25%</td></tr></table>", "questions": [{"type": "essay", "points": 4, "prompt": "<p><strong>Determine</strong> whether each of the following factors had a positive or negative contribution to the active return of the Atlantic portfolio:<br> i. HML<br> ii. WML<br> (Positive, Negative)<br> <strong>Justify</strong> your response for each factor.<br> <em>Note: Each justification should be in a separate paragraph.</em></p>", "num": 35, "feedback": ["The value factor or HML (High Minus Low) has negative sensitivities for both the portfolio (–0.12) and the benchmark (–0.07). This means that the portfolio and the benchmark had a growth bias. However, the portfolio's orientation to growth stocks was 0.05 higher than that of the benchmark in absolute terms. In other words, the manager had less exposure to the value factor relative to the benchmark. Therefore, the manager subtracted value from the portfolio (0.05 × 5.02% = –0.25%) by weighting less toward value stocks which had a positive factor return (5.02%). The momentum factor or WML (Winners Minus Losers) has a negative sensitivity for the portfolio (– 0.10) but a positive sensitivity for the benchmark (0.21). This means that the portfolio had a contrarian bias whereas the benchmark had a momentum bias. The difference between both biases was 0.31 in absolute terms. In other words, the manager had less exposure to the momentum factor relative to the benchmark. Therefore, the manager added value to the portfolio (0.31 × 7.08% = 2.19%) by weighting less toward winners which had a negative factor return (–7.08%)."]}, {"type": "essay", "points": 4, "prompt": "<p><strong>Discuss</strong> two characteristics that Toldo should evaluate in assessing the manager's capacity to use the inefficiency in its strategy. <em>Note: Each discussion should be in a separate paragraph.</em></p>", "num": 36, "feedback": ["Inefficiencies can be behavioral or structural. A behavioral inefficiency is a perceived mispricing (temporary) created by the actions of other market participants. A structural inefficiency (permanent) is a perceived mispricing created by external or internal rules and regulations. To address the board's question regarding whether the market inefficiency will last long enough, Toldo's analysis needs to consider three aspects of capacity related to the inefficiency:", "The level of assets the portfolio can absorb without a dilution of returns: Does the inefficiency provide a sufficient frequency of opportunity and level of return to cover costs and fees? The number of opportunities or securities available: Does the inefficiency generate a repeatable source of return without requiring a different process of skill set? The ability to transact in a timely manner at or near market price: Is the inefficiency sustainable to allow the ability to trade in a timely manner at or near market price?"]}, {"type": "essay", "points": 4, "prompt": "<p><strong>Describe</strong>, based on the attribution analysis and the Pacific manager's decisions, how each of the following most likely changed during the evaluation period:<br> i. The shape of the yield curve<br> ii. Credit spreads<br> <em>Note: Each description should be in a separate paragraph.</em></p>", "num": 37, "feedback": ["The portfolio benefited from changes in the shape of the yield curve. Given the manager’s overweighting in the short end of the curve, we can infer that the curve steepened. The slope steepening caused short-term yields to decrease more than long-term yields. Therefore, 18 bps were gained as a result of the manager's decision to overweight the short end of the curve. The portfolio also benefited from changes in the level of credit spreads. Given the manager’s overweighting in the corporate sector, we can infer that credit spreads narrowed. The spread narrowing reduced the cost of capital which, in turn, improved earnings and caused corporate bonds to outperform government bonds. Therefore, 17 bps were gained as a result of the manager's decision to overweight the corporate sector.", "Vignette", "TOPIC: ASSET ALLOCATION TOTAL POINT VALUE OF THIS QUESTION SET IS 12 POINTS", "Sally Wilson is a market strategist for a global asset manager. She meets with a portfolio manager at her firm to discuss her forecast for fixed-income assets. Wilson and the manager first discuss Country A's economic outlook. Wilson forecasts that Country A's output gap has closed which she believes will lead to an overheating economy. Based on Wilson's forecast of the changing business cycle, the portfolio manager considers if they should change their portfolio's allocation to Country A high-yield corporate bonds. The portfolio manager also owns Country B default-free government bonds. Wilson notes that Country B is in the late stage of a contraction and there is downward pressure on wages and prices. Country B’s central bank policy rate target is viewed as credible. The portfolio manager tells Wilson that they are concerned about the effect of anticipated persistent loose monetary and fiscal policies on real rates and expected inflation in Country B. Wilson considers the combined impact of Country B's monetary and fiscal policies. Lastly, Wilson reviews her estimates for Country Z. She anticipates a change in monetary policy for Country Z in the coming year and uses the Taylor rule to project the path of future policy rates. The estimates Wilson uses for the neutral real policy rate, target inflation rate, expected real GDP growth, and trend real GDP growth rates have not changed. She does though change her estimate for the expected inflation rate and now forecasts it to increase by 50 bps. She recalculates the target nominal policy rate under the Taylor rule using her new estimate."]}]}, {"topic": "ASSET ALLOCATION", "points": 12, "narrative": "<p>Sally Wilson is a market strategist for a global asset manager. She meets with a portfolio manager at her firm to discuss her forecast for fixed-income assets.</p>\n<p>Wilson and the manager first discuss Country A's economic outlook. Wilson forecasts that Country A's output gap has closed which she believes will lead to an overheating economy. Based on Wilson's forecast of the changing business cycle, the portfolio manager considers if they should change their portfolio's allocation to Country A high-yield corporate bonds.</p>\n<p>The portfolio manager also owns Country B default-free government bonds. Wilson notes that Country B is in the late stage of a contraction and there is downward pressure on wages and prices. Country B's central bank policy rate target is viewed as credible.</p>\n<p>The portfolio manager tells Wilson that they are concerned about the effect of anticipated persistent loose monetary and fiscal policies on real rates and expected inflation in Country B. Wilson considers the combined impact of Country B's monetary and fiscal policies.</p>\n<p>Lastly, Wilson reviews her estimates for Country Z. She anticipates a change in monetary policy for Country Z in the coming year and uses the Taylor rule to project the path of future policy rates. The estimates Wilson uses for the neutral real policy rate, target inflation rate, expected real GDP growth, and trend real GDP growth rates have not changed. She does though change her estimate for the expected inflation rate and now forecasts it to increase by 50 bps. She recalculates the target nominal policy rate under the Taylor rule using her new estimate.</p>", "questions": [{"type": "mc", "points": 1, "prompt": "<p>Based on Wilson's forecast for Country A, the portfolio manager's allocation to Country A's high-yield bonds should be:</p>", "choices": ["decreased.", "unchanged.", "increased."], "num": 38, "correctIndex": 0, "correctText": "decreased.", "feedback": ["Correct because an output gap that has closed is associated with moving into the late expansion phase of the business cycle. In this phase, debt coverage ratios may deteriorate as balance sheets expand and interest rates rise. High-yield bonds are considered a cyclical asset and in an overheating economy, cyclical assets typically underperform."]}, {"type": "mc", "points": 1, "prompt": "<p>The yield curve for Country B's default-free government bonds is most likely:</p>", "choices": ["downward sloping.", "flat.", "upward sloping."], "num": 39, "correctIndex": 2, "correctText": "upward sloping.", "feedback": ["Correct because the slope of the yield curve is countercyclical and at the trough of the business cycle it would be upward sloping. The pattern just described implies a horizon structure of inflation expectations that is countercyclical—upward sloping at the trough of the business cycle and inverted at the peak. Because inflation expectations are an important component of bond yields, this countercyclical pattern is one of the reasons that the yield curve’s slope is countercyclical. Wilson states that Country B is in the late stage of a contraction and there is downward pressure on wages and prices. Country B’s central bank target is credible, implying that over the cycle the average", "rate of inflation should be near target. Country B is at the trough of the business cycle, and at the trough the slope of the yield curve is positive."]}, {"type": "mc", "points": 1, "prompt": "<p>Which of the following is most likely to occur if the portfolio manager's concerns about monetary and fiscal policies for Country B are realized?</p>", "choices": ["High real rates and low expected inflation", "Low real rates and high expected inflation", "High real rates and high expected inflation"], "num": 40, "correctIndex": 2, "correctText": "High real rates and high expected inflation", "feedback": ["Correct because loose fiscal and monetary policies will lead to high real rates and high expected inflation. All else the same, loose fiscal policies (large deficits) increase the level of real interest rates because the domestic private sector must be induced to save more/invest less and/or additional capital must be attracted from abroad. Conversely, persistently tight monetary policy ultimately reduces actual and expected inflation resulting in lower, rather than higher, nominal rates. In this case, with loose monetary policy we would expect high inflation."]}, {"type": "mc", "points": 1, "prompt": "<p>Given Wilson's new estimate for the expected inflation rate, the change in Country Z's target nominal policy rate under the Taylor rule is:</p>", "choices": ["less than 50 bps.", "equal to 50 bps.", "greater than 50 bps."], "num": 41, "correctIndex": 2, "correctText": "greater than 50 bps.", "feedback": ["Correct because Wilson is recalculating the target nominal policy rate, not the real, inflation-adjusted target rate. The increase in the expected inflation rate, πe, will impact two terms in the calculation of the target nominal policy rate, leading to a recalculated value that is 75 basis points higher than the previous calculation. The Taylor rule is expressed as follows:<br>i* = rneutral + πe + 0.5(Ye – Ytrend) + 0.5(πe – πtarget)<br>where<br>i* = target nominal policy rate<br>rneutral = real policy rate that would be targeted if growth is expected to be at<br>trend and inflation on target πe, πtarget = respectively, the expected and target inflation rates Ye, Ytrend = respectively, the expected and trend real GDP growth rates In this recalculation πe is 50 basis points higher. As all of the remaining variables remain constant, the first term will remain unchanged, the second term will increase by 50 basis points, the third term will remain unchanged, and the fourth term will increase by 25 basis points, resulting in a net change of 75 basis points.", "Retake"]}]}]}, {"id": "M1S2", "title": "Module 1 - Session 2", "totalPoints": 94, "vignettes": [{"topic": "PORTFOLIO CONSTRUCTION", "points": 12, "narrative": "<p>Mary Girma is a private wealth advisor serving high-net-worth individuals at HBU Private Wealth Management. She is meeting with two clients, Kelvin Bekele and Uta Stenson.</p>\n<p><strong>Kelvin Bekele</strong></p>\n<p>Girma is meeting with Bekele to review his IPS. She constructs portfolios based on individual wealth life-cycle stages and her evaluation of client characteristics. For Bekele, she notes the following:</p>\n<ul><li>Bekele is single, 32 years old, and a senior vice president at a bank</li><li>The majority of Bekele's net wealth is human capital</li><li>He has three young children</li><li>He has significant living expenses from living in a luxury apartment with his children</li></ul>\n<p>Based on these characteristics, Girma classifies Bekele as being in the career development financial stage of life.</p>\n<p>Girma advises Bekele to diversify his portfolio. She proposes segmenting the investable universe by size and uses this segmentation to select new equities for his portfolio. This segmentation also allows Girma to construct performance benchmarks for specific size segments. Bekele asks if there are any disadvantages to this segmentation approach.</p>\n<p><strong>Uta Stenson</strong></p>\n<p>Girma then meets with Uta Stenson, a new client, to plan a wealth management strategy. Stenson has a portfolio which she intends to transfer from another firm to HBU. Stenson is retired and uses the portfolio to fund her living expenses. The portfolio is invested in private equity, small capitalization stocks and timberland. Girma determines that Stenson's current portfolio meets her expected return requirement. During this first meeting, Girma notes that Stenson has experienced significant health issues and that her top priority is to cover major unexpected medical expenses. Girma considers whether Stenson's current portfolio remains suitable given her top priority.</p>\n<p>Stenson paid annual accrual taxes on her portfolio investment return prior to becoming Girma's client. Stenson lives in a tax jurisdiction with a flat tax rate of 30%, which applies to all investment returns and income. Stenson earned a nominal return of 6% per year on her portfolio over the past eight years. Girma determines the impact of taxes on the wealth accumulation of Stenson's portfolio over the past eight years. Eight years ago, the portfolio had an initial value of $1.25 million.</p>", "questions": [{"type": "essay", "points": 3, "prompt": "<p><strong>Discuss</strong> one characteristic of Bekele that supports Girma's classification of him being in the career development financial stage of life.</p>", "num": 1, "feedback": ["There are several financial priorities and constraints that supports Girma's classification of Bekele being in the career development phase of the wealth life cycle. The two factors are (i) the majority of Bekele's net wealth is human capital and (ii) Bekele has significant living expenses. The career development phase typically occurs during the ages of 35–50 and is a time of specific skill development, upward career mobility, and income growth. However, significant family and housing expenses during this phase may limit an individual’s ability to save, with human capital representing a large proportion of total wealth. There are several financial priorities and constraints that contradict Girma's classification of Bekele being in the career development phase of the wealth life cycle. Two factors that classify Bekele in the early career phase are (i) Bekele is 32 years old and (ii) Bekele has three young children. The early career phase normally begins when an individual enters the workforce, usually in their late teens to early thirties. During this phase, individuals may marry, have young children, incur debt to purchase a home, and begin to save for their children’s education expenses."]}, {"type": "essay", "points": 3, "prompt": "<p><strong>Explain</strong> one disadvantage of the segmentation approach used by Girma to diversify Bekele's portfolio.</p>", "num": 2, "feedback": ["There are two potential issues with the segmenting by size approach. The main drawback of segmenting by size is that firms can become smaller or larger over time, thus transitioning out of the category. In addition, size may be interpreted differently by various investors in different markets."]}, {"type": "essay", "points": 3, "prompt": "<p><strong>Discuss</strong> why Stenson's current portfolio is not suitable for meeting her top priority.</p>", "num": 3, "feedback": ["Stenson’s current portfolio is most likely not suitable due to a mismatch between the portfolio's holdings and the information that Girma notes during their first conversation. Stenson’s top priority of covering major unexpected medical expenses is an unplanned goal. Unplanned goals are those related to unforeseen financial needs, and as such they are more difficult to quantify than planned goals because either the funding need or the timing of the financial need or both may not be estimated. Medical expenses are more difficult to quantify, since either the funding need or the timing of the financial need, or both, may not be estimated. Stenson relies solely on her portfolio and therefore would need liquidity in the portfolio to finance the unexpected and unplanned medical expenses. However, Stenson's portfolio holds a significant portion of her wealth and is not liquid (i.e., it consists of private equity, small", "capitalization stocks and timberland). Therefore, Stenson’s current portfolio is not suitable given her financial objectives and goals."]}, {"type": "essay", "points": 3, "prompt": "<p><strong>Calculate</strong> the tax drag (as a % of investment gains) on Stenson's portfolio over the 8-year period prior to her becoming Girma's client.</p>", "num": 4, "feedback": ["Step 1: Calculate the accumulation with the impact of taxes. For Stenson’s prior portfolio, her wealth has grown to:<br>FVt = [1 + R(1 – tx)]T<br>where<br>R = nominal return<br>tx = tax rate<br>T = investment horizon<br>FVt = $1,250,000 × [1 + R(1 – tx)]T<br>= $1,250,000 × [1 + 0.06(1 – 0.30)]8<br>= $1,737,208<br>Step 2: Calculate the accumulation without the impact of taxes. Ignoring taxes, this amounts to:<br>FVt = $1,250,000 × [1 + R]T<br>= $1,250,000 × [1 + 0.06]8<br>= $1,992,310<br>Step 3: Comparing the accumulation with and without the impact of taxes gives the tax drag. The tax drag can be calculated as follows: The difference in the accumulation with and without the impact of taxes = ($1,992,310 – $1,737,208) = $255,102 Thus, the tax drag is the proportion of the accumulated untaxed investment gains consumed by taxes: $255,102 ÷ ($1,992,310 – $1,250,000) = 34.37%", "Vignette", "TOPIC: ASSET ALLOCATION TOTAL POINT VALUE OF THIS QUESTION SET IS 12 POINTS", "David Ramos is a portfolio analyst at the asset management firm Bolden Associates, with a focus on providing asset allocation recommendations for clients. Ramos meets with senior portfolio strategist Meghan Park. Park tells Ramos that she typically uses broad asset classes as the basis for asset allocation decisions but is now considering using a factor-based approach. Ramos explains his understanding of factor-based approaches, making the following statements: Statement 1:       Asset classes can be described with respect to their sensitivities to each of the factors. Statement 2:       Factors are often directly investable. Statement 3:       Multifactor risk models can be used both in selecting individual assets and in controlling systematic risk exposures in asset allocation.", "Next, Ramos brings up the topic of risk budgeting. Ramos provides the data shown in Exhibit 1 for the emerging market equities asset class. Based on this data, Park asks Ramos what risk-free rate he used to calculate the ratio of excess return to marginal contribution to total risk (MCTR). Exhibit 1 Expected return                                     8.5% Expected standard deviation of returns             14.2% Marginal contribution to total risk (MCTR)         12.5% Ratio of excess return to MCTR                      0.27 Ramos meets with one of the firm’s clients, a large global bank, to discuss selecting a new asset allocation approach. The bank wants to use an approach that is able to estimate the probability that its current capital will be sufficient to withstand losses in its various trading business units while liabilities are increasing. In addition, the chief risk officer at the bank would prefer to use an approach based on a multi-period model. Ramos considers an appropriate liability-relative asset allocation approach for the bank. Ramos is also analyzing the investment portfolio of one of the firm’s individual investor clients, Cindy Wiley, who has three different accounts within her portfolio: a taxable account, a tax-deferred retirement account, and a tax-exempt retirement account. She recently inherited a large sum of money that she would like to invest in the portfolio; however, she plans to withdraw these funds within a year to buy a new house. Ramos has decided to invest Wiley’s new money in short-term corporate bonds in one of her three existing accounts. In the country where Wiley resides, short-term capital gains and bond interest are taxed at a higher rate than long-term capital gains and Wiley is not old enough to withdraw funds from her retirement accounts without penalty."]}]}, {"topic": "ASSET ALLOCATION", "points": 12, "narrative": "<p>David Ramos is a portfolio analyst at the asset management firm Bolden Associates, with a focus on providing asset allocation recommendations for clients. Ramos meets with senior portfolio strategist Meghan Park.</p>\n<p>Park tells Ramos that she typically uses broad asset classes as the basis for asset allocation decisions but is now considering using a factor-based approach. Ramos explains his understanding of factor-based approaches, making the following statements:</p>\n<p>Statement 1: Asset classes can be described with respect to their sensitivities to each of the factors.</p>\n<p>Statement 2: Factors are often directly investable.</p>\n<p>Statement 3: Multifactor risk models can be used both in selecting individual assets and in controlling systematic risk exposures in asset allocation.</p>\n<p>Next, Ramos brings up the topic of risk budgeting. Ramos provides the data shown in Exhibit 1 for the emerging market equities asset class. Based on this data, Park asks Ramos what risk-free rate he used to calculate the ratio of excess return to marginal contribution to total risk (MCTR).</p>\n<div class=\"exhibit-title\">Exhibit 1</div>\n<table class=\"exhibit-table\"><tr><td>Expected return</td><td>8.5%</td></tr><tr><td>Expected standard deviation of returns</td><td>14.2%</td></tr><tr><td>Marginal contribution to total risk (MCTR)</td><td>12.5%</td></tr><tr><td>Ratio of excess return to MCTR</td><td>0.27</td></tr></table>\n<p>Ramos meets with one of the firm's clients, a large global bank, to discuss selecting a new asset allocation approach. The bank wants to use an approach that is able to estimate the probability that its current capital will be sufficient to withstand losses in its various trading business units while liabilities are increasing. In addition, the chief risk officer at the bank would prefer to use an approach based on a multi-period model. Ramos considers an appropriate liability-relative asset allocation approach for the bank.</p>\n<p>Ramos is also analyzing the investment portfolio of one of the firm's individual investor clients, Cindy Wiley, who has three different accounts within her portfolio: a taxable account, a tax-deferred retirement account, and a tax-exempt retirement account. She recently inherited a large sum of money that she would like to invest in the portfolio; however, she plans to withdraw these funds within a year to buy a new house. Ramos has decided to invest Wiley's new money in short-term corporate bonds in one of her three existing accounts. In the country where Wiley resides, short-term capital gains and bond interest are taxed at a higher rate than long-term capital gains and Wiley is not old enough to withdraw funds from her retirement accounts without penalty.</p>", "questions": [{"type": "mc", "points": 1, "prompt": "<p>Which of Ramos's statements regarding factor-based approaches to asset allocation is least likely correct?</p>", "choices": ["Statement 1", "Statement 2", "Statement 3"], "num": 5, "correctIndex": 1, "correctText": "Statement 2", "feedback": ["Correct because Statement 2 is incorrect. Although asset classes can be described with respect to their sensitivities to each of the factors, factors are not directly investable. In broad terms, when using factors as the units of analysis, we begin with specifying risk factors and the desired exposure to each factor. On that basis, asset class portfolios that isolate exposure to the risk factor are constructed; these factor portfolios involve both long and short positions."]}, {"type": "mc", "points": 1, "prompt": "<p>The risk-free rate used to calculate the ratio of excess return to MCTR in Exhibit 1 was closest to:</p>", "choices": ["2.3%.", "5.1%.", "10.8%."], "num": 6, "correctIndex": 1, "correctText": "5.1%.", "feedback": ["Correct because the ratio of excess return to marginal contribution to total risk (MCTR) is calculated as:<br>Ratio of excess return to MCTR = (Expected return – Risk-free rate) / MCTR<br>0.27 = (8.5% – Rf) / 12.5% Solving for the risk-free rate:<br>Rf = 5.125% ≈ 5.1%<br>An asset allocation is optimal from a risk-budgeting perspective when the ratio of excess return (over the risk-free rate) to MCTR is the same for all assets and matches the Sharpe ratio of the tangency portfolio."]}, {"type": "mc", "points": 1, "prompt": "<p>Which of the following is the most appropriate liability-relative asset allocation approach for the large global bank?</p>", "choices": ["Surplus optimization", "Hedging/return-seeking portfolios", "Integrated asset-liability portfolios"], "num": 7, "correctIndex": 2, "correctText": "Integrated asset-liability portfolios", "feedback": ["Correct because the large global bank wants to use an approach that is able to estimate the probability that its current capital will be sufficient to withstand losses in its various trading business units while the bank’s liabilities are increasing, and would prefer an approach based on a multi-period model. Large global banks are often required to analyze their ability to withstand stress scenarios. These institutions must be able to show that their current capital is adequate to withstand losses in their business units, such as asset trading, in conjunction with increases in liabilities. Integrated asset-liability portfolios are routinely employed by such banks wherein the bank must render significant decisions regarding the composition of its liabilities in conjunction with the asset allocation. Within this category, the liability-relative approaches have several names, including asset–liability management (ALM) for banks. These approaches are often implemented in the context of multi-period models, as is the case here."]}, {"type": "mc", "points": 1, "prompt": "<p>In which of the following accounts should Wiley hold the investments purchased with her new money?</p>", "choices": ["Taxable account", "Tax-exempt account", "Tax-deferred account"], "num": 8, "correctIndex": 0, "correctText": "Taxable account", "feedback": ["Correct because, in general, the portion of a taxable asset owner’s assets that have higher tax rates, such as taxable bonds and high-turnover trading strategies, should be located in tax-", "exempt and tax-deferred accounts to the extent possible. However, one important exception to this general rule regarding asset location applies to assets held for near-term liquidity needs. Because Wiley’s tax-exempt and tax-deferred accounts are not immediately accessible without penalty, the short-term corporate bond allocation may be held in the taxable account as its role is to fund near-term consumption requirements – for Wiley, she plans to withdraw the funds within a year to buy a new house."]}]}, {"topic": "PORTFOLIO MANAGEMENT", "points": 12, "narrative": "<p>Abigail Dunn is a portfolio manager at Gruff Investments. She is evaluating how the portfolios of three of her clients will perform in various yield curve scenarios.</p>\n<p>Each of the clients holds one or more of the government bonds in Exhibit 1. Dunn notes that the current government bond yield curve is upward sloping and that each bond in Exhibit 1 pays an annual coupon. Options and swaptions are available on all three bonds.</p>\n<div class=\"exhibit-title\">Exhibit 1</div>\n<table class=\"exhibit-table\"><tr><td>Term</td><td>Coupon</td><td>Price</td><td>Yield</td><td>Modified Duration</td><td>Convexity</td></tr><tr><td>2 years</td><td>0.30%</td><td>99.80</td><td>0.401%</td><td>1.99</td><td>5.94</td></tr><tr><td>5 years</td><td>0.55%</td><td>98.90</td><td>0.775%</td><td>4.91</td><td>29.11</td></tr><tr><td>9 years</td><td>2.50%</td><td>90.60</td><td>3.750%</td><td>7.83</td><td>72.81</td></tr></table>\n<p>Each client portfolio has an active mandate and a market value of $50 million. Dunn reviews the clients' portfolio allocations.</p>\n<ul><li>Client X is fully invested in 5-year bonds.</li><li>Client Y is equally invested in 2-year and 9-year bonds.</li><li>Client Z is equally invested in 2-year, 5-year, and 9-year bonds.</li></ul>\n<p>Dunn realizes there may be very small differences in portfolio durations but assumes them to be equal. She next outlines three scenarios for the yield curve and reviews how each client's portfolio would perform.</p>\n<p>Scenario 1: A parallel upward shift in the yield curve</p>\n<p>Scenario 2: A rise in 2-year yields and a fall in 9-year yields</p>\n<p>Scenario 3: A 60 bps fall in 9-year yields</p>\n<p>Client Y asks how they could take advantage of Scenario 2. Dunn recommends a positioning strategy using both 2-year bond options and 9-year interest rate swaptions.</p>\n<p>Lastly, Dunn reviews how Client Z's portfolio would perform compared to its benchmark index under Scenario 3. The key rate durations for Client Z's portfolio and its customized benchmark index are shown in Exhibit 2.</p>\n<div class=\"exhibit-title\">Exhibit 2</div>\n<table class=\"exhibit-table\"><tr><td>Term</td><td>Key Rate Duration — Client Z Portfolio</td><td>Key Rate Duration — Benchmark Index</td></tr><tr><td>2 years</td><td>0.66</td><td>1.22</td></tr><tr><td>5 years</td><td>1.63</td><td>2.44</td></tr><tr><td>9 years</td><td>2.61</td><td>2.14</td></tr></table>", "questions": [{"type": "essay", "points": 5, "prompt": "<p><strong>Determine</strong> which client's portfolio would perform best under Scenario 1. (Client X, Client Y, Client Z) <strong>Justify</strong> your response.</p>", "num": 9, "feedback": ["Portfolio duration is a first-order effect that results in an inverse relationship between bond prices and changes in yields to maturity. Portfolio convexity is a second-order effect that causes the value of a portfolio to respond to a change in yields to maturity in a non-linear manner. For non-callable bonds, convexity adds to the overall portfolio gain when yields decline and reduces the portfolio loss when yields rise. Because the durations for the three portfolios are equal (i.e., their modified durations all equal 4.91), the convexity of each portfolio will explain any differences in performance when the yield curve undergoes a parallel shift. The convexities are 29.11 for Client X, 39.38 for Client Y, and 35.95 for Client Z; therefore, Client Y's portfolio will have higher returns when rates fall and less-negative returns when rates rise."]}, {"type": "essay", "points": 4, "prompt": "<p><strong>Formulate</strong> the most appropriate positioning strategy for Client Y under Scenario 2 using the derivative instruments recommended by Dunn.</p>", "num": 10, "feedback": ["Interest rate put and call options are generally based upon a bond’s price, not its yield to maturity. Therefore, the purchase of a bond put option provides an investor the right, but not the obligation, to sell the underlying bond at a pre-determined strike price. The put option will be exercised if the bond price falls below the strike price (i.e., generally at a higher yield). The purchased bond put option will benefit Client Y when prices fall (in response to yields rising) beyond the strike prior to expiration. An interest rate swaption provides an investor the right to enter into an interest rate swap at a specific strike price in the future. This instrument grants the contingent right to increase or decrease portfolio duration. A receiver swaption is an option to receive-fixed in an interest", "rate swap. With 9-year bond prices expected to rise as rates fall, the portfolio manager would want to exercise an option to receive a fixed strike rate, which is similar to owning a fixed-rate bond. This would also increase the duration of the portfolio."]}, {"type": "essay", "points": 3, "prompt": "<p><strong>Calculate</strong> the difference in performance between Client Z's portfolio and the benchmark index under Scenario 3.</p>", "num": 11, "feedback": ["The effective durations for Client Z's portfolio and the benchmark index are 4.90 and 5.80, respectively. Therefore, Client Z's portfolio duration is 0.90 lower. The key rate duration differences between the portfolio and benchmark reveal the exposure differences across maturities. The negative differences for the 2-year and 5-year tenors indicate that the portfolio has lower exposure to short/intermediate-term rates than the benchmark index, and the positive difference for the 9-year tenor indicates that the portfolio has greater exposure to long-term rates than the benchmark index. In this case, the 9-year bond yield is expected to fall by 60 basis points and no change is expected in the 2-year and 5-year yields. Therefore, the approximate (first-order) change in portfolio value is estimated as: (9-year key rate duration of Client Z’s portfolio minus the 9-year key rate duration of the benchmark) × (Change in 9-year yield) Multiplying the 0.47 difference in 9-year key rate durations by –0.60% gives 0.282% (= –0.47 × –0.60%), or 28 bps. Equivalently, the dollar amount of performance difference is $141,000 (= 0.282% × $50 million).", "Vignette", "TOPIC: PERFORMANCE MEASUREMENT TOTAL POINT VALUE OF THIS QUESTION SET IS 12 POINTS", "EW Investments, an asset management firm, is considering whether to adopt the GIPS standards. EW has three subsidiaries: Subsidiary A offers discretionary investment management services to individuals. Subsidiary B offers discretionary investment management services to institutional clients. Last year, EW's partners decided not to seek new clients for Subsidiary B. Subsidiary C is a transactions-based broker-dealer, executing trades for individuals and institutional clients, as well as for the portfolios managed by Subsidiaries A and B. One of EW's partners, Keri Bonazza, has been asked to review EW's compliance with the GIPS standards. She first considers how to properly define the firm to comply with the GIPS Standards for Firms. EW has two main investment options for its fee-paying, discretionary accounts that have an ESG focus: (1) Global ESG and (2) USA ESG. Global ESG portfolios seek ESG-oriented investments on a global basis and are offered in segregated portfolios and in pooled funds. USA ESG portfolios are offered in pooled funds only. Bonazza decides how these ESG-focused portfolios should be assigned to a composite. Bonazza reviews return calculations on some of EW's illiquid asset portfolios. She notes the following: Portfolio A: Was initiated eight months ago and uses time-weighted annualized returns", "Portfolio B: Has experienced large external cash flows every period and reports money-weighted returns Portfolio C: EW has control over external cash flows into and out of the portfolio and reports money- weighted returns Finally, EW is interested in pursuing GIPS verification. Bonazza makes the following notes in evaluating the use of verification:", "Note 1: Verification requires a review of all portfolio records for accuracy and GIPS compliance. Note 2: Verification assures investors that calculations and presentations are correct. Note 3: Verification may include a detailed performance examination on one or more specific composites."]}]}, {"topic": "PERFORMANCE MEASUREMENT", "points": 12, "narrative": "<p>EW Investments, an asset management firm, is considering whether to adopt the GIPS standards. EW has three subsidiaries:</p>\n<p>Subsidiary A offers discretionary investment management services to individuals.</p>\n<p>Subsidiary B offers discretionary investment management services to institutional clients. Last year, EW's partners decided not to seek new clients for Subsidiary B.</p>\n<p>Subsidiary C is a transactions-based broker-dealer, executing trades for individuals and institutional clients, as well as for the portfolios managed by Subsidiaries A and B.</p>\n<p>One of EW's partners, Keri Bonazza, has been asked to review EW's compliance with the GIPS standards. She first considers how to properly define the firm to comply with the GIPS Standards for Firms.</p>\n<p>EW has two main investment options for its fee-paying, discretionary accounts that have an ESG focus: (1) Global ESG and (2) USA ESG. Global ESG portfolios seek ESG-oriented investments on a global basis and are offered in segregated portfolios and in pooled funds. USA ESG portfolios are offered in pooled funds only. Bonazza decides how these ESG-focused portfolios should be assigned to a composite.</p>\n<p>Bonazza reviews return calculations on some of EW's illiquid asset portfolios. She notes the following:</p>\n<p>Portfolio A: Was initiated eight months ago and uses time-weighted annualized returns</p>\n<p>Portfolio B: Has experienced large external cash flows every period and reports money-weighted returns</p>\n<p>Portfolio C: EW has control over external cash flows into and out of the portfolio and reports money-weighted returns</p>\n<p>Finally, EW is interested in pursuing GIPS verification. Bonazza makes the following notes in evaluating the use of verification:</p>\n<p>Note 1: Verification requires a review of all portfolio records for accuracy and GIPS compliance.</p>\n<p>Note 2: Verification assures investors that calculations and presentations are correct.</p>\n<p>Note 3: Verification may include a detailed performance examination on one or more specific composites.</p>", "questions": [{"type": "mc", "points": 1, "prompt": "<p>According to the GIPS Standards for Firms:</p>", "choices": ["Subsidiary A is the only subsidiary considered to be a firm.", "Subsidiaries A, B, and C are collectively considered to be one firm.", "Subsidiaries A, B, and C are each considered to be separate firms."], "num": 12, "correctIndex": 0, "correctText": "Subsidiary A is the only subsidiary considered to be a firm.", "feedback": ["Correct because Subsidiary A is managing discretionary portfolios and is competing for business. Subsidiary B is not covered by GIPS as it is no longer competing for business (but may be covered under the GIPS Standards for Asset Owners). Subsidiary C does not manage portfolios or value securities; it simply executes trades and therefore is not part of the investment management process for Subsidiaries A or B. Therefore, it does not qualify for GIPS coverage."]}, {"type": "mc", "points": 1, "prompt": "<p>Which of the ESG-focused portfolios must be included in at least one composite under the GIPS standards?</p>", "choices": ["Global ESG segregated portfolios only", "Global ESG segregated portfolios and Global ESG pooled funds only", "Global ESG segregated portfolios, Global ESG pooled funds, and USA ESG pooled funds"], "num": 13, "correctIndex": 1, "correctText": "Global ESG segregated portfolios and Global ESG pooled funds only", "feedback": ["Correct because if a strategy is offered as a pooled fund and a segregated account, the pooled fund must be included in a composite for that strategy. The USA ESG accounts do not need to be included in any composite as they are offered as a pooled fund only. The firm does need not to create a composite for a strategy if it is offered only as a pooled fund."]}, {"type": "mc", "points": 1, "prompt": "<p>The return calculation of which illiquid asset portfolio is most likely consistent with the GIPS standards?</p>", "choices": ["Portfolio A", "Portfolio B", "Portfolio C"], "num": 14, "correctIndex": 2, "correctText": "Portfolio C", "feedback": ["Correct because portfolios with illiquid investments as a significant part of the investment strategy may have performance presented using money−weighted returns. Money−weighted returns may be used if the firm (not the participant) has control over external cash flows and 1)", "the portfolio is closed-end, fixed life, or fixed commitment or 2) illiquid investments are a significant part of the investment strategy."]}, {"type": "mc", "points": 1, "prompt": "<p>Which of Bonazza's notes about verification is consistent with the GIPS standards?</p>", "choices": ["Note 1", "Note 2", "Note 3"], "num": 15, "correctIndex": 2, "correctText": "Note 3", "feedback": ["Correct because the firm can choose a detailed performance examination. A firm that is verified may choose to have a detailed performance examination conducted on one or more specific composites or pooled funds, and it may state that a composite has been examined if a performance examination report has been issued for the specific composite."]}]}, {"topic": "DERIVATIVES AND RISK MANAGEMENT", "points": 12, "narrative": "<p>Michael Carter is CIO for a defined benefit pension fund and is updating his near-term outlook for various asset classes. He begins by using the Fed funds futures curve to infer market expectations on the direction of interest rates. The current Fed funds target rate range is 1.00–1.25, and the Fed funds futures contract expiring shortly after the next meeting is priced at 98.85. Carter estimates the probability of a 25 bp increase in the Fed funds target rate to 1.25–1.50 at the next meeting.</p>\n<p>Carter expects interest rates to increase significantly more than is implied by the market. As a result, he expects fixed income to perform poorly over the next six months. To manage this risk, he considers using a futures contract to temporarily reduce the average modified duration of a $2 billion US Treasury bond portfolio from 7.0 to 6.0. The cheapest-to-deliver bond for the futures contract has a basis point value of $85.70 and a conversion factor of 0.92.</p>\n<p>Finally, Carter considers using either volatility futures or a variance swap to hedge tail risk in the $3 billion equity portfolio. The term structure of volatility futures is steeply in contango and not expected to change. Currently, the implied volatility of variance swaps is higher than that of at-the-money options.</p>", "questions": [{"type": "essay", "points": 4, "prompt": "<p><strong>Calculate</strong> the probability of a 25 bps rate hike at the next meeting.</p>", "num": 16, "feedback": ["To calculate the probability of a hike, the candidate must first determine the expected average rate by subtracting the Fed funds futures price from 100. In this case, 100 – 98.85 = 1.15. Then, to the probability of a change in the federal funds rate, the following formula is used, where the current and expected federal funds rates are the midpoint of the current target range: (Expected average rate – Current rate) / (Rate assuming an increase – Current rate) In this case, (1.15 – 1.125) / (1.375 – 1.125) = 0.025 / 0.25 = 10%"]}, {"type": "essay", "points": 4, "prompt": "<p><strong>Calculate</strong> the number of futures contracts that should be sold to achieve the target duration for the fixed income portfolio.</p>", "num": 17, "feedback": ["Carter wants to reduce the average modified duration on the $2 billion fixed income portfolio from 7.0 to 6.0. The cheapest-to-deliver bond for the futures contract has a basis point value of $85.70 and a conversion factor of 0.92. To solve, the BPVHR must be calculated as follows: ((BPVT – BPVP) / BPVCTD) × CF BPVT is the target BPV for the portfolio, calculated as the Target duration × 0.01% × Portfolio value. In this case, 6.0 × 0.0001 × $2 billion = $1,200,000. BPVP is the current BPV for the portfolio, calculated as Average duration × 0.01% × Portfolio value. In this case, 7.0 × 0.0001 × $2 billion = $1,400,000.<br>BPVHR = (($1,200,000 – $1,400,000 / $85.70) × 0.92 = (–$200,000 / $85.70) × 0.92 = –<br>2,147.0245 Thus, the duration would be adjusted by selling 2,147 contracts."]}, {"type": "essay", "points": 4, "prompt": "<p><strong>Determine</strong> whether Carter should use volatility futures or a variance swap to hedge tail risk in the equity portfolio. (Volatility futures, Variance swap) <strong>Justify</strong> your response.</p>", "num": 18, "feedback": ["When the VIX futures curve is in contango, and assuming volatility expectations remain unchanged, the VIX futures price will get \"pulled\" closer to the VIX spot price, and they will decrease in price as they approach expiration. Establishing long positions in VIX futures can be very expensive over time. When the short end of the VIX futures curve is much steeper than the long end of the curve, the carrying costs created from the contract roll-down are elevated. In variance swaps, there is no exchange of cash at the contract inception or during the life of the swap. A feature of variance swaps that makes them particularly interesting to investors is that their payoffs are convex in volatility. A long position in a variance swap is thus long gamma and has a convex payoff. This characteristic allows volatility sellers to sell variance swaps at a higher price than at-the-money options because the swap's convex payoff profile is attractive to investors who desire a long volatility position as a tail risk hedge.", "Vignette", "TOPIC: PORTFOLIO MANAGEMENT TOTAL POINT VALUE OF THIS QUESTION SET IS 12 POINTS", "Bob Paskett advises several clients regarding their fixed-income investments. For client immunization strategies, he notes that zero-coupon bonds are not available for purchase and proposes using", "portfolios of non-callable, fixed-rate, coupon-bearing government bonds. Client 1 wants to immunize a single liability due in six years, which has a present value of $2.77 million. Paskett offers three potential portfolios for Client 1 to consider. All three portfolios have market values greater than $2.77 million. The client also wants to minimize the variance of the immunization portfolio's realized return over the 6-year horizon. Portfolio characteristics on an annualized basis are presented in Exhibit 1. Exhibit 1 Portfolio A Portfolio B Portfolio C Cash flow yield               4.43%            4.45%             4.49% Macaulay duration              6.21             6.02              6.02 Convexity                45.40          47.50          50.00 Client 2 wants to immunize multiple liabilities that are payable between three and ten years from now. The Macaulay duration of the multiple liabilities is six years with a basis point value (BPV) of $58,911, a convexity of 45.54, and a cash flow yield of 3.76%. Paskett analyzes the three portfolios in Exhibit 2 to potentially use for the immunization. All of the portfolios have similar current market values that exceed the present value of the liabilities. Exhibit 2 Portfolio D Portfolio E Portfolio F Macaulay duration             5.90             6.02              5.80 BPV                         $58,920          $61,296           $58,770 Convexity              55.26         44.20          57.51 Client 3 wants to establish a bond market exposure. Paskett recommends Client 3 hire a bond index fund manager that tracks the BigBond Index. This index includes US Treasuries, US government agency securities, corporate bonds, and MBS. The fund manager tells Paskett that in addition to other risk factors, the fund matches the key rate durations of the BigBond Index as a primary risk factor. Paskett and the client speak with the bond index fund manager. The manager discusses benchmark stability and explains that fixed-income market dynamics can lead fixed-income benchmarks to be unstable. In his discussion, the manager notes that one of the following factors is not relevant when evaluating the stability of fixed-income benchmarks.", "Factor 1: Drift in duration Factor 2: Use of smart beta Factor 3: Issuer composition"]}]}, {"topic": "PORTFOLIO MANAGEMENT", "points": 12, "narrative": "<p>Bob Paskett advises several clients regarding their fixed-income investments. For client immunization strategies, he notes that zero-coupon bonds are not available for purchase and proposes using portfolios of non-callable, fixed-rate, coupon-bearing government bonds.</p>\n<p>Client 1 wants to immunize a single liability due in six years, which has a present value of $2.77 million. Paskett offers three potential portfolios for Client 1 to consider. All three portfolios have market values greater than $2.77 million. The client also wants to minimize the variance of the immunization portfolio's realized return over the 6-year horizon. Portfolio characteristics on an annualized basis are presented in Exhibit 1.</p>\n<div class=\"exhibit-title\">Exhibit 1</div>\n<table class=\"exhibit-table\"><tr><td></td><td>Portfolio A</td><td>Portfolio B</td><td>Portfolio C</td></tr><tr><td>Cash flow yield</td><td>4.43%</td><td>4.45%</td><td>4.49%</td></tr><tr><td>Macaulay duration</td><td>6.21</td><td>6.02</td><td>6.02</td></tr><tr><td>Convexity</td><td>45.40</td><td>47.50</td><td>50.00</td></tr></table>\n<p>Client 2 wants to immunize multiple liabilities that are payable between three and ten years from now. The Macaulay duration of the multiple liabilities is six years with a basis point value (BPV) of $58,911, a convexity of 45.54, and a cash flow yield of 3.76%. Paskett analyzes the three portfolios in Exhibit 2 to potentially use for the immunization. All of the portfolios have similar current market values that exceed the present value of the liabilities.</p>\n<div class=\"exhibit-title\">Exhibit 2</div>\n<table class=\"exhibit-table\"><tr><td></td><td>Portfolio D</td><td>Portfolio E</td><td>Portfolio F</td></tr><tr><td>Macaulay duration</td><td>5.90</td><td>6.02</td><td>5.80</td></tr><tr><td>BPV</td><td>$58,920</td><td>$61,296</td><td>$58,770</td></tr><tr><td>Convexity</td><td>55.26</td><td>44.20</td><td>57.51</td></tr></table>\n<p>Client 3 wants to establish a bond market exposure. Paskett recommends Client 3 hire a bond index fund manager that tracks the BigBond Index. This index includes US Treasuries, US government agency securities, corporate bonds, and MBS. The fund manager tells Paskett that in addition to other risk factors, the fund matches the key rate durations of the BigBond Index as a primary risk factor.</p>\n<p>Paskett and the client speak with the bond index fund manager. The manager discusses benchmark stability and explains that fixed-income market dynamics can lead fixed-income benchmarks to be unstable. In his discussion, the manager notes that one of the following factors is not relevant when evaluating the stability of fixed-income benchmarks.</p>\n<p>Factor 1: Drift in duration</p>\n<p>Factor 2: Use of smart beta</p>\n<p>Factor 3: Issuer composition</p>", "questions": [{"type": "mc", "points": 1, "prompt": "<p>Which portfolio best immunizes Client 1's single liability?</p>", "choices": ["Portfolio A", "Portfolio B", "Portfolio C"], "num": 19, "correctIndex": 1, "correctText": "Portfolio B", "feedback": ["Correct because the characteristics of a bond portfolio structured to immunize a single liability are that it: (1) has initial market value equal to the present value of the liability; (2) has a Macaulay duration that matches the liability's due date; and (3) minimizes the portfolio convexity statistics. All three portfolios meet criteria (1) and Portfolio B and Portfolio C have a duration (6.02) close to the duration of the liability (6); however, Portfolio B has the smallest convexity (47.5 vs. 50 for Portfolio C). Structural risk is reduced by minimizing the dispersion of the bond positions around the single liability due date, which is associated with having the lower convexity."]}, {"type": "mc", "points": 1, "prompt": "<p>Which portfolio best immunizes the multiple liabilities of Client 2?</p>", "choices": ["Portfolio D", "Portfolio E", "Portfolio F"], "num": 20, "correctIndex": 0, "correctText": "Portfolio D", "feedback": ["Correct because it best satisfies the conditions for immunizing multiple liabilities. The conditions to immunize multiple liabilities include matching money durations, since asset and liability values are not equal (given in the text of the case). After matching money duration (or basis point value, which is given), we then look to the portfolio with the smallest convexity that exceeds the convexity of the liability (45.54). Portfolio D satisfies both conditions, as it has a BPV of $58,920 (vs. $58,911 for the liabilities) and convexity of 55.26 (vs. 45.54 for the liabilities). The dispersion of the assets should be as low as possible, subject to being greater than or equal to the dispersion of the liabilities, to mitigate the effect of non-parallel shifts in the yield curve. Note that higher dispersion implies higher convexity when Macaulay duration and cash flow yields are equal."]}, {"type": "mc", "points": 1, "prompt": "<p>The primary risk factor matched by the bond index fund manager best addresses:</p>", "choices": ["negative convexity of MBS.", "spread duration contribution.", "non-parallel yield curve shifts."], "num": 21, "correctIndex": 2, "correctText": "non-parallel yield curve shifts.", "feedback": ["Correct because the primary risk factor mentioned by the index manager (key rate duration) measures the sensitivity to non-parallel yield curve shifts. By effectively matching the key rate", "durations between the portfolio and the underlying index, a manager can significantly reduce the portfolio’s exposure to changes in the yield curve."]}, {"type": "mc", "points": 1, "prompt": "<p>Which factor is not relevant when evaluating the stability of fixed-income benchmarks?</p>", "choices": ["Factor 1", "Factor 2", "Factor 3"], "num": 22, "correctIndex": 1, "correctText": "Factor 2", "feedback": ["Correct because Factor 2 (use of smart beta) is a rules-based strategy used by active managers to potentially outperform an index. It does not affect the stability of a benchmark. Smart beta involves the use of transparent, rules-based strategies as a basis for investment decisions."]}]}, {"topic": "ASSET ALLOCATION", "points": 12, "narrative": "<p>Karina Wagoner is a financial analyst working for a hedge fund. She is making forecasts for several asset classes in Country A.</p>\n<p>Wagoner wants to determine whether the long-run performance of equities will improve compared to historical returns over the past five years. She uses the annualized information in Exhibit 1 for her analysis and assumes that the long-run inflation rate and dividend yield will equal the averages of the past five years.</p>\n<div class=\"exhibit-title\">Exhibit 1</div>\n<table class=\"exhibit-table\"><tr><td colspan=\"2\"><em>Historical data (5-year average)</em></td></tr><tr><td>Real GDP growth rate</td><td>1.7%</td></tr><tr><td>Change in P/E ratio</td><td>–0.3%</td></tr><tr><td>Change in ratio of profits to GDP</td><td>0.0%</td></tr><tr><td colspan=\"2\"><em>Forecast data (long-run average)</em></td></tr><tr><td>Growth from labor productivity</td><td>1.5%</td></tr><tr><td>Growth from labor inputs</td><td>0.9%</td></tr></table>\n<p>Wagoner then uses the Singer–Terhaar model to determine the risk premium for equities using the data in Exhibit 2.</p>\n<div class=\"exhibit-title\">Exhibit 2</div>\n<table class=\"exhibit-table\"><tr><td>Volatility</td><td>20%</td></tr><tr><td>Correlation with the global market</td><td>0.60</td></tr><tr><td>Degree of integration</td><td>0.80</td></tr><tr><td>Sharpe ratio (global and segmented markets)</td><td>0.25</td></tr></table>\n<p>In the short run, Wagoner expects both a decline in inflation below the policy target inflation rate and a decline in the growth rate of real GDP. This scenario is not currently reflected in market prices. Wagoner assesses the effect of this scenario on a real estate company in Country A which has a lower average lease length than the industry.</p>", "questions": [{"type": "essay", "points": 5, "prompt": "<p><strong>Determine</strong> whether the long-run performance of Country A equities is forecast to improve relative to the 5-year historical average. (Yes, No) <strong>Justify</strong> your response with two reasons. <em>Note: Each justification should be in a separate paragraph.</em></p>", "num": 23, "feedback": ["Long-run equity returns based on economic growth can be calculated as the sum of real GDP growth, inflation, and the dividend yield. In the short run, equity returns are also influenced by the change in the ratio of profits to GDP and the change in the P/E ratio. It is clear that over long periods, capital's share of income cannot continually increase or decrease. The same is true for the P/E multiple applied to earnings. Hence, these components are zero in a long-run forecast. Real GDP growth can be calculated as the sum of growth from labor inputs and growth from labor productivity. Wagoner assumes that the long-run inflation rate and dividend yield will equal those of the past five years.", "Based on these facts, the various components can be compared as follows: 5-Year Historical      Long-Run Forecast                             Effect Performance 2.4% Forecast is Real GDP growth rate                    1.7%                  (calculated as 1.5% + higher 0.9%) Change in ratio of profits to                                 0.0% 0.0%                                                   Same GDP                                                           (based on theory) 0.0%                             Forecast is Change in P/E ratio                     –0.3% (based on theory)                higher"]}, {"type": "essay", "points": 4, "prompt": "<p><strong>Calculate</strong> the risk premium for Country A equities based on the Singer–Terhaar model.</p>", "num": 24, "feedback": ["The Singer–Terhaar model calculates a weighted average of the segmented market risk premium and the fully integrated risk premium, using the degree of integration as the weighting factor. The segmented market risk premium is calculated as: Volatility × Sharpe ratio of segmented market The fully integrated risk premium is calculated as: Volatility × Correlation with global market portfolio × Sharpe ratio of global market The weighted average risk premium is calculated as: Segmented market risk premium × (1 – Degree of integration) + Fully integrated risk premium × Degree of integration<br>Hence:<br>Segmented market risk premium: 20% × 0.25 = 5% Fully integrated risk premium: 20% × 0.6 × 0.25 = 3% Weighted average risk premium: 5% × 0.2 + 3% × 0.8 = 3.4%"]}, {"type": "essay", "points": 3, "prompt": "<p><strong>Determine</strong>, given Wagoner's short-run scenario, whether the relative lease length would be favorable or unfavorable for the real estate company in Country A. (Favorable, Unfavorable) <strong>Justify</strong> your response.</p>", "num": 25, "feedback": ["In the scenario expected by Wagoner, the economy is characterized by inflation below the policy target and a decline in the growth rate of real GDP. In such a scenario, there will be downward pressure on expected rental income and property values, especially for less-than- prime properties, which may have to cut rents sharply to avoid rising vacancies. A lower average lease length relative to the industry is thus unfavorable, as the real estate company would be more exposed to the effect of downward pressure on expected rental income.", "Vignette", "TOPIC: ETHICAL AND PROFESSIONAL STANDARDS TOTAL POINT VALUE OF THIS QUESTION SET IS 12 POINTS", "Marina Ekase, CFA, is a portfolio manager for a small investment firm. The firm has adopted the Standards as part of its ethics and compliance policy. Ekase manages portfolios of stocks and bonds for individual clients. Both the equity and bond portions of her client portfolios are based on model portfolios that Ekase creates. Her use of these model portfolios is disclosed to prospective clients, and the suitability of the model portfolios is affirmed in every client's IPS.", "Ekase writes a monthly bond market commentary that is distributed by email to all of her clients who hold bonds, and includes possible trades for the coming month. As an additional service, she calls her largest clients to discuss the commentary. These calls sometimes occur before the email is distributed. A year ago, Ekase received permission from her firm to begin posting her bond market commentaries on her personal social media accounts several weeks after they are distributed to clients. The commentaries have attracted a large audience over time and, as a result, Ekase begins to receive advertising revenue from the social media sites. One of Ekase's clients recently suggested that Ekase consider the publicly traded stocks and bonds of Dameg Inc. The client was a board director of Dameg until a year ago. After reviewing the company, Ekase is particularly interested in its junior subordinated bond. Although the bond's credit rating is significantly lower than the ratings of her other holdings, Ekase believes the return potential is high. Since the bond meets the objectives and constraints of Ekase's model bond portfolio, she purchases the bond for all of her clients who hold bonds and makes no disclosures to clients concerning the source of the initial recommendation or the suitability of this bond investment for them."]}]}, {"topic": "ETHICAL AND PROFESSIONAL STANDARDS", "points": 12, "narrative": "<p>Marina Ekase, CFA, is a portfolio manager for a small investment firm. The firm has adopted the Standards as part of its ethics and compliance policy. Ekase manages portfolios of stocks and bonds for individual clients. Both the equity and bond portions of her client portfolios are based on model portfolios that Ekase creates. Her use of these model portfolios is disclosed to prospective clients, and the suitability of the model portfolios is affirmed in every client's IPS.</p>\n<p>Ekase writes a monthly bond market commentary that is distributed by email to all of her clients who hold bonds, and includes possible trades for the coming month. As an additional service, she calls her largest clients to discuss the commentary. These calls sometimes occur before the email is distributed.</p>\n<p>A year ago, Ekase received permission from her firm to begin posting her bond market commentaries on her personal social media accounts several weeks after they are distributed to clients. The commentaries have attracted a large audience over time and, as a result, Ekase begins to receive advertising revenue from the social media sites.</p>\n<p>One of Ekase's clients recently suggested that Ekase consider the publicly traded stocks and bonds of Dameg Inc. The client was a board director of Dameg until a year ago. After reviewing the company, Ekase is particularly interested in its junior subordinated bond. Although the bond's credit rating is significantly lower than the ratings of her other holdings, Ekase believes the return potential is high. Since the bond meets the objectives and constraints of Ekase's model bond portfolio, she purchases the bond for all of her clients who hold bonds and makes no disclosures to clients concerning the source of the initial recommendation or the suitability of this bond investment for them.</p>", "questions": [{"type": "mc", "points": 3, "prompt": "<p>With respect to the calls to her clients, Ekase violates the Standards:</p>", "choices": ["because of the timing of the calls only.", "because of the additional service she provides on the calls only.", "both because of the timing of the calls and because of the additional service she provides on the calls."], "num": 26, "correctIndex": 0, "correctText": "because of the timing of the calls only.", "feedback": ["Correct because, according to the guidance for Standard III(B) Fair Dealing, the communication should be distributed to all clients before some clients receive additional services. If she called clients only after the distribution of the communication, it would not be a violation."]}, {"type": "mc", "points": 1, "prompt": "<p>Does Ekase violate the Standards with regard to her social media postings?</p>", "choices": ["No", "Yes, because she uses her personal accounts", "Yes, because she has not received permission for outside compensation"], "num": 27, "correctIndex": 2, "correctText": "Yes, because she has not received permission for outside compensation", "feedback": ["Correct because, according to the guidance for Standard IV(B) Additional Compensation Arrangements, Ekase should fully disclose any outside compensation that is potentially in conflict with the firm's interests. She received permission from her firm initially to post the commentaries on her social media sites but has not requested or received updated permission since the postings began creating outside compensation for her. This permission is especially important as the commentaries are likely to be considered the property of the firm."]}, {"type": "mc", "points": 1, "prompt": "<p>Does Ekase's purchase of the Dameg bond violate the Standard relating to suitability?</p>", "choices": ["No", "Yes, because she buys the bond for all of her clients who own bonds", "Yes, because the bond's credit rating is significantly lower than the ratings of her other holdings"], "num": 28, "correctIndex": 0, "correctText": "No", "feedback": ["Correct because Ekase considers the bond in the context of the entire portfolio as it meets the objectives and constraints of her model bond portfolio. Since the model portfolio has been deemed suitable for all of her bond clients based upon their IPSs (per the 1st paragraph of the vignette), she has not violated Standard III(C) Suitability. An investment with high relative risk on its own may be a suitable investment in the context of an entire portfolio, or when the client's stated objectives contemplate speculative or risky investments."]}, {"type": "mc", "points": 1, "prompt": "<p>Does Ekase's purchase of the Dameg bond violate the Standard related to material nonpublic information?</p>", "choices": ["No", "Yes, because of the client's previous role at Dameg", "Yes, because she did not disclose to clients the source of the initial recommendation"], "num": 29, "correctIndex": 0, "correctText": "No", "feedback": ["Correct because based on the information provided in the case, there is no evidence that Ekase acquired or acted upon confidential information. In addition, due to both the source of the information and the passage of time (her client has not been an insider for the past year), any information the client has is unlikely to still be material and nonpublic. According to Standard II(A) Material Nonpublic Information, Ekase's actions are proper."]}]}, {"topic": "PORTFOLIO MANAGEMENT", "points": 12, "narrative": "<p>Jan Mertz is an equity trader for the Burli Fund Group. She is developing trading strategies with the portfolio managers of Fund K and Fund M, two of Burli's equity funds.</p>\n<p>Fund K is a separate account managed for a large pension plan client and invests in small-cap, infrequently traded stocks. The manager of Fund K is expecting a large cash inflow into the fund and is concerned about execution risk and market impact. Mertz recommends investing the inflow using a liquidity-seeking trading algorithm and reviews the algorithm's advantages and disadvantages with the fund manager.</p>\n<p>The manager of Fund M wants to add a 20,000 share position in YC Products, whose shares are trading at EUR 15.00. He sets a 1-day limit of EUR 15.40 for the purchase. Mertz investigates market conditions and, during the day, executes the following trades in order:</p>\n<ul><li>5,000 shares @ EUR 14.90</li><li>5,000 shares @ EUR 15.10</li><li>5,000 shares @ EUR 15.35</li></ul>\n<p>The price of YC shares then rises to EUR 15.60, where it closes for the day. Commissions are EUR 0.01 per share.</p>", "questions": [{"type": "essay", "points": 6, "prompt": "<p><strong>Explain</strong> why the recommended trading algorithm for Fund K might result in each of the following:<br> i. High execution risk<br> ii. Low market impact<br> <em>Note: Each explanation should be in a separate paragraph.</em></p>", "num": 30, "feedback": ["i. Execution risk Execution risk – the risk of adverse price movement during the trading horizon due to a change in the fundamental value of the security – arises as time passes and occurs even if the order is not traded. Trading faster results in lower execution risk because the order is executed over a shorter period of time, decreasing the time the trade is exposed to price volatility and changing", "market conditions. Trading slower results in higher execution risk because of the increased time that the trade is exposed to price volatility and changing market conditions. Mertz recommends using a liquidity-seeking algorithm to execute the trade. Execution risk might be high if sufficient liquidity is not present across all trading venues and the trading algorithm allows only a small portion of the order to be filled. Until the next liquidity pocket becomes available, the trader takes the risk of adverse price movement. ii. Market impact The temporary market impact cost of trading an order is the often short-lived impact on security price from trading to meet the need to buy or sell. There is usually price reversion after the trade has been completed, since the price change was driven by short-term buying pressure rather than a fundamental change in security value. The permanent component of price change associated with trading an order is the market price impact caused by the information content (information leakage) of the trade. Liquidity-seeking algorithms utilize multiple venues (exchanges, alternative trading systems, and dark pools) to find adequate numbers of shares at favorable prices (\"sweeping the book\"). This allows the trader to execute a large order in a timely manner, resulting in low market impact (as well as low execution risk). In addition, liquidity-seeking algorithms often make greater use of market order types than limit order types. Market orders allow fast execution and avoiding limit orders could avoid unwanted information leakage. Therefore, liquidity-seeking algorithm might result in low market impact (as well as low execution risk)."]}, {"type": "essay", "points": 6, "prompt": "<p><strong>Calculate</strong> the implementation shortfall of the YC Products trade.</p>", "num": 31, "feedback": ["Implementation shortfall is the sum of execution cost, opportunity cost and fixed fees. Execution cost is calculated as the difference between the costs of the real portfolio and the paper portfolio. It reflects the execution prices paid for the amount of shares in the order that were actually filled. Opportunity cost is based on the amount of shares left unexecuted in the order. It reflects the cost of not being able to execute all shares at the decision price. Fixed fees are the explicit fees paid to trade. Method 1<br>Implementation shortfall = Paper return – Actual return, where:<br>Paper return = 20,000 shares × (€15.6 – €15) = €312,000 – €300,000 = €12,000<br>Actual return = (15,000 shares × €15.6) – (5,000 shares × €14.9) – (5,000 shares × €15.1) –<br>(5,000 shares × €15.35) – (15,000 shares × €0.01) €234,000 – €74,500 – €75,500 – €76,750 – €150 = €7,250 – €150 = €7,100<br>Implementation shortfall = €12,000 – €7,100 = €4,900<br>Method 2<br>Execution cost = Σ SjPj – Σ SjPd<br>= 5,000 shares × €14.90 + 5,000 shares × €15.10 + 5,000 shares × €15.35 – 15,000 shares ×<br>€15.00<br>= €74,500 + €75,500 + €76,750 – €225,000<br>= €1,750<br>Opportunity cost = (S – Σ Sj) (Pn – Pd)<br>= (20,000 – 15,000) (€15.60 – €15.00)<br>= 5,000 × €0.60<br>= €3,000<br>Fixed fees = 15,000 × €0.01<br>= €150", "Implementation shortfall = Execution cost + Opportunity cost + Fixed fees<br>= €1,750 + €3,000 + €150<br>= €4,900<br>IS in basis points<br>= IS (€)/(Total shares)(Pd) × 10,000 bps<br>= €4,900/(20,000 × €15) × 10,000 bps<br>= 163 bps", "Vignette", "TOPIC: PORTFOLIO CONSTRUCTION TOTAL POINT VALUE OF THIS QUESTION SET IS 12 POINTS", "Luca Verdi is the head of electronic trading at Silver Asset Management, a large broker-dealer. Verdi is evaluating the cost of executed trades from the previous day. He reviews a buy order for 2,000 shares of Company X that was filled in two trades, as shown in Exhibit 1. Verdi calculates the average effective spread for the order. Exhibit 1 Trade        Time        Trade Price     Trade Size    Bid Price     Ask Price 1       10:45 a.m.           $12.35             1,400            $12.32            $12.34 2     12:05 a.m.      $12.47          600           $12.40         $12.46 Next, Verdi reviews trading in Company Y shares. Three dealers make a market in the shares: Dealer A, Dealer B, and Dealer C. Verdi wants to measure the implicit costs of two traders' orders:", "Trader 1 placed a buy order for 800 shares, which moved down the book as it was filled. Trader 2 placed a sell order for 500 shares with a limit price of $46.00 that was good for one day. The sell order was not filled and the shares closed at $45.60.", "The limit order book for Company Y shares at the time the orders were entered is shown in Exhibit 2. Exhibit 2 Bid                                           Ask Dealer Time Entered           Price       Size      Dealer Time Entered            Price   Size C         9:04 a.m.       $45.82       900          B         9:03 a.m.       $47.06    300 B         9:02 a.m.       $45.79       500          A         9:05 a.m.       $47.10    700 A         9:03 a.m.       $45.74       600          C         9:07 a.m.       $47.12    100 Silver's board is concerned about trades taking place at unreasonably high or low prices. The board requests that trades only be filled on exchanges that impose a trade halt when prices move too quickly outside a threshold range. In addition, the board asks Verdi to evaluate two policies with the objective of reducing systemic risk. Policy 1: Convert all market orders into marketable limit orders Policy 2: Allow clients to enter orders directly into exchange trading systems Verdi notes that reducing latency is Silver's top priority in trade execution. In addition to subscribing to high-speed data feeds, he proposes implementing one of the following actions:", "Action 1: Increase the number of electronic routers Action 2: Create contingency tables with action plans Action 3: Upgrade to a more complex operating system"]}]}, {"topic": "PORTFOLIO CONSTRUCTION", "points": 12, "narrative": "<p>Luca Verdi is the head of electronic trading at Silver Asset Management, a large broker-dealer. Verdi is evaluating the cost of executed trades from the previous day. He reviews a buy order for 2,000 shares of Company X that was filled in two trades, as shown in Exhibit 1. Verdi calculates the average effective spread for the order.</p>\n<div class=\"exhibit-title\">Exhibit 1</div>\n<table class=\"exhibit-table\"><tr><td>Trade</td><td>Time</td><td>Trade Price</td><td>Trade Size</td><td>Bid Price</td><td>Ask Price</td></tr><tr><td>1</td><td>10:45 a.m.</td><td>$12.35</td><td>1,400</td><td>$12.32</td><td>$12.34</td></tr><tr><td>2</td><td>12:05 a.m.</td><td>$12.47</td><td>600</td><td>$12.40</td><td>$12.46</td></tr></table>\n<p>Next, Verdi reviews trading in Company Y shares. Three dealers make a market in the shares: Dealer A, Dealer B, and Dealer C. Verdi wants to measure the implicit costs of two traders' orders:</p>\n<ul><li>Trader 1 placed a buy order for 800 shares, which moved down the book as it was filled.</li><li>Trader 2 placed a sell order for 500 shares with a limit price of $46.00 that was good for one day. The sell order was not filled and the shares closed at $45.60.</li></ul>\n<p>The limit order book for Company Y shares at the time the orders were entered is shown in Exhibit 2.</p>\n<div class=\"exhibit-title\">Exhibit 2</div>\n<table class=\"exhibit-table\"><tr><td colspan=\"4\">Bid</td><td colspan=\"4\">Ask</td></tr><tr><td>Dealer</td><td>Time Entered</td><td>Price</td><td>Size</td><td>Dealer</td><td>Time Entered</td><td>Price</td><td>Size</td></tr><tr><td>C</td><td>9:04 a.m.</td><td>$45.82</td><td>900</td><td>B</td><td>9:03 a.m.</td><td>$47.06</td><td>300</td></tr><tr><td>B</td><td>9:02 a.m.</td><td>$45.79</td><td>500</td><td>A</td><td>9:05 a.m.</td><td>$47.10</td><td>700</td></tr><tr><td>A</td><td>9:03 a.m.</td><td>$45.74</td><td>600</td><td>C</td><td>9:07 a.m.</td><td>$47.12</td><td>100</td></tr></table>\n<p>Silver's board is concerned about trades taking place at unreasonably high or low prices. The board requests that trades only be filled on exchanges that impose a trade halt when prices move too quickly outside a threshold range. In addition, the board asks Verdi to evaluate two policies with the objective of reducing systemic risk.</p>\n<p>Policy 1: Convert all market orders into marketable limit orders</p>\n<p>Policy 2: Allow clients to enter orders directly into exchange trading systems</p>\n<p>Verdi notes that reducing latency is Silver's top priority in trade execution. In addition to subscribing to high-speed data feeds, he proposes implementing one of the following actions:</p>\n<p>Action 1: Increase the number of electronic routers</p>\n<p>Action 2: Create contingency tables with action plans</p>\n<p>Action 3: Upgrade to a more complex operating system</p>", "questions": [{"type": "mc", "points": 1, "prompt": "<p>The average effective spread of the buy order for Company X shares is closest to:</p>", "choices": ["–$0.06.", "$0.03.", "$0.06."], "num": 32, "correctIndex": 2, "correctText": "$0.06.", "feedback": ["Correct because the average effective spread for the Company X buy order is $0.06. The effective spread of a buy order is calculated as: 2 × [Trade price – ((Bid price + Ask price) / 2)] The average effective spread of the two trades is then computed as follows:<br>Step 1<br>Effective spread of Trade 1 = 2 × [$12.35 – (($12.32 + $12.34) / 2)] = $0.04<br>Effective spread of Trade 2 = 2 × [$12.47 – (($12.40 + $12.46) / 2)] = $0.08<br>Step 2<br>Average effective spread = ($0.04 + $0.08) / 2 = $0.06"]}, {"type": "mc", "points": 1, "prompt": "<p>What were the implicit costs, on a per-share basis, of Trader 1's buy order and Trader 2's sell order for Company Y shares?</p>", "choices": ["A market impact of $0.04 for the buy order and a delay cost of $0.22 for the sell order", "A market impact of $0.02 for the buy order and an opportunity cost of $0.40 for the sell order", "A market impact of $0.04 for the buy order and an opportunity cost of $0.22 for the sell order"], "num": 33, "correctIndex": 2, "correctText": "A market impact of $0.04 for the buy order and an opportunity cost of $0.22 for the sell order", "feedback": ["Correct because Trader 1 incurred a market impact of $0.04 per share for the buy order and Trader 2 incurred an opportunity cost of $0.22 per share for the sell order. Trader 1 placed a
