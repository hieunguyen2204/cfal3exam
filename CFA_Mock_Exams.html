ics hinges upon expected changes in the option value and whether the investor is short volatility (i.e., has sold the right to call a bond at a fixed price to the issuer), as in the case of callable bonds, or long volatility (i.e., owns the right to sell the bond at a fixed price to the issuer), as for putable bonds."]}, {"type": "mc", "points": 1, "prompt": "<p>Which of the following trades is likely to be the most profitable under the Solid Stream manager's yield curve expectation?</p>", "choices": ["Buy a 10-year bond financed with a repo", "Sell a 5-year bond and buy a 1-year bond", "Sell an existing bond and buy a new bond with the same yield and duration but greater convexity"], "num": 37, "correctIndex": 0, "correctText": "Buy a 10-year bond financed with a repo", "feedback": ["Correct because a repo carry trade is used when the manager expects a stable interest rate environment as it adds leverage risk to the portfolio to increase returns. The repo market involves buying a long-term security and financing it at a short-term rate below the long-term yield-to-maturity, earning a positive repo carry."]}, {"type": "mc", "points": 1, "prompt": "<p>Based on its active position one year later, the Solid Stream Fund is most likely to outperform the index if the yield curve experiences:</p>", "choices": ["a bull flattening.", "an upward parallel shift.", "a positive butterfly movement."], "num": 38, "correctIndex": 0, "correctText": "a bull flattening.", "feedback": ["Correct because, in a bull flattening scenario, long-term rates fall by more than short-term rates. The fund is underweight the short-term maturity and overweight the long-term maturity versus the index. It will outperform the index because it is generally long duration and the long-term holdings will gain more than the index and will outweigh the underperformance versus the index in the shorter maturity."]}]}, {"topic": "DERIVATIVES AND RISK MANAGEMENT", "points": 12, "narrative": "<p>Monica Voruganti is the head of Maverik Venture Capital LLC. Voruganti is conducting an annual review of Maverik's overall exposure to various investments.</p>\n<p>Maverik holds 1 million shares in White Rock's Bitcoin ETF (WBIT), which is currently trading at $60.25. Voruganti believes that there will be more industry adoption of cryptocurrencies and blockchain technology in the future. Although bullish on the longer-term outlook, she is concerned about short-term volatility and would like to protect the WBIT position for the next three months while keeping the cost of the protection to a minimum. Voruganti believes a short seagull spread would be the cheapest form of protection. She gathers three-month WBIT option prices in Exhibit 1.</p>\n<div class=\"exhibit-title\">Exhibit 1</div>\n<table class=\"exhibit-table\"><tr><td>Call Premium</td><td>Exercise Price</td><td>Put Premium</td></tr><tr><td>$9.23</td><td>$55</td><td>$0.71</td></tr><tr><td>$3.26</td><td>$60</td><td>$3.11</td></tr><tr><td>$0.84</td><td>$65</td><td>$8.21</td></tr></table>\n<p>Voruganti asks Liam Brothers, a quantitative portfolio analyst at Maverik, to recommend another suitable strategy to protect the WBIT position. Using the prices in Exhibit 1 and assuming an expiration price of $47.50, Brothers calculates the profit at expiration of the following strategies:</p>\n<p>Strategy 1: A collar using the $60 and $65 strikes</p>\n<p>Strategy 2: A bull call spread using the $55 and $65 strikes</p>\n<p>Strategy 3: A bear put spread using the $55 and $65 strikes</p>\n<p>Voruganti and Brothers next discuss a possible investment in Ether (ETH) cryptocurrency, which is currently trading at $3,710. Ether's technology is going through a major upgrade in the next six months, and Voruganti expects increased volatility as a result. She believes ETH will have a 25% price move, but she is uncertain about the direction of the move. Brothers collects the data in Exhibit 2 and recommends a long straddle using at-the-money options.</p>\n<div class=\"exhibit-title\">Exhibit 2</div>\n<table class=\"exhibit-table\"><tr><td>Call Premium</td><td>Exercise Price</td><td>Put Premium</td></tr><tr><td>$131.55</td><td>$3,600</td><td>$1.71</td></tr><tr><td>$43.26</td><td>$3,700</td><td>$35.78</td></tr><tr><td>$3.48</td><td>$3,800</td><td>$112.21</td></tr></table>", "questions": [{"type": "essay", "points": 3, "prompt": "<p><strong>Calculate</strong> the total cost of implementing a short seagull spread to hedge the WBIT position.</p>", "num": 39, "feedback": ["A short seagull spread consists of three individual options and combines a bear put spread and a covered call, as follows:<br>Short seagull spread = Long an ATM put + Short an OTM put + Short an OTM call<br>The premium paid for the ATM put option (i.e., $60 strike) is $3.11. The premium received for the OTM put option (i.e., $55 strike) is $0.71. The premium received for the OTM call option (i.e., $65 strike) is $0.84. Cost of short seagull spread (per share) = $3.11 – $0.71 – $0.84 = $1.56 Total cost of implementing the short seagull spread to protect WBIT position:<br>= Total number of WBIT shares × Cost of short seagull spread (per share)<br>= 1,000,000 × $1.56 = $1,560,000 = $1.56 million"]}, {"type": "essay", "points": 5, "prompt": "<p><strong>Determine</strong>, assuming an expiration price for WBIT of $47.50, which strategy presented by Brothers would be most profitable at expiration. (Strategy 1, Strategy 2, Strategy 3) <strong>Justify</strong> your response.</p>", "num": 40, "feedback": ["Strategy 1 is the most profitable. The calculations are as follows: Strategy 1<br>Collar = Buy an ATM $60 strike put and sell an OTM $65 strike call<br>Total premium = $3.11 – $0.84 = $2.27<br>At expiration, the price of WBIT is $47.50. The $60 put option is in the money (ITM) and the $65 call option expires worthless. The total profit on the collar is: Profit on the put option – Total premium = ($60 – $47.50) – $2.27 = $12.50 – $2.27 = $10.23 Strategy 2<br>Bull call spread = Buy an ITM $55 strike call and sell an OTM $65 strike call<br>At expiration, the price of WBIT is $47.50 so both call options expire worthless. Hence, this bull call spread does not yield any profit.<br>Loss = –Total premium = –($9.23 – $0.84) = –$8.39<br>Strategy 3<br>Bear put spread = Buy an ITM $65 strike put and sell an OTM $55 strike put<br>Total premium = $8.21 – $0.71 = $7.50<br>At expiration, the price of WBIT is $47.50 so both put options are ITM. The total profit on the bear put spread is: Profit on $65 strike put – Loss on $55 strike put – Total premium = ($65 – $47.50) – ($55 – $47.50) – $7.50 = $17.50 – $7.50 – $7.50 = $2.50"]}, {"type": "essay", "points": 4, "prompt": "<p><strong>Calculate</strong> each of the following for the ETH straddle:<br> i. Maximum loss<br> ii. Upside breakeven price</p>", "num": 41, "feedback": ["Long straddle = Buy an ATM call + Buy an ATM put<br>The maximum loss in a long straddle is the total premium paid: Premium on $3,700 strike call + Premium on $3,700 strike put = $43.26 + $35.78 = $79.04 There are two breakeven prices for a straddle, one on the downside and one on the upside. The downside breakeven price is: Strike price – Total premium paid = $3,700 – $79.04 = $3,620.96 The upside breakeven price is:", "Strike price + Total premium paid = $3,700 + $79.04 = $3,779.04", "Retake"]}]}]}, {"id": "M2S2", "title": "Module 2 - Session 2", "totalPoints": 84, "vignettes": [{"topic": "ETHICAL AND PROFESSIONAL STANDARDS", "points": 12, "narrative": "<p>Manuela Esposito, CFA, is an investment advisor at Alberino Asset Management. Esposito recently added Jonathan Greenberg as a client. Greenberg offers Esposito bonus compensation equal to 10% of the capital appreciation of his portfolio. Esposito is concerned that the bonus compensation may be viewed as pressuring her to emphasize short-term performance in Greenberg's account. She discloses the bonus offer to her employer and obtains written permission to accept it. She does not disclose the arrangement to her other clients.</p>\n<p>A few months later, Esposito delegates the responsibility for managing Greenberg's portfolio to Mark Kligman, CFA, a junior portfolio manager under her supervision. At each month end, Kligman provides to Alberino's operations department the valuations of any illiquid securities in Greenberg's portfolio. In reviewing the valuations, Esposito realizes that Kligman has violated regulatory policies by using an inappropriate valuation method. As a result, the reported value of Greenberg's portfolio has been overstated. Esposito considers what immediate action she should take to address this violation.</p>\n<p>Esposito recently became a member of EarthCare, a nonprofit organization which has a strong presence in her local community. She presents a plan to the organization's board whereby EarthCare would market Alberino's portfolio management services to its members. Esposito would agree to donate to EarthCare a portion of her management fee from new clients referred to Alberino. The plan is approved by both EarthCare's board and Alberino. One month later, Esposito receives the first client referral from EarthCare. In her initial meeting with the new client, she does not mention the referral arrangement.</p>\n<p>Esposito is also a board director of Easy Tech Inc. At a board meeting, Esposito discovers that Easy Tech's management has been inflating reported revenue ahead of the company's upcoming IPO. The preliminary prospectus for the IPO has already been distributed.</p>", "questions": [{"type": "mc", "points": 1, "prompt": "<p>With regard to the Greenberg bonus arrangement, does Esposito violate the Standard relating to additional compensation arrangements?</p>", "choices": ["No", "Yes, because she does not disclose the arrangement to her other clients", "Yes, because the arrangement could result in pressure to emphasize short-term performance"], "num": 1, "correctIndex": 0, "correctText": "No", "feedback": ["Correct, because Esposito has communicated and received permission from her employer to accept the bonus compensation offered by Greenberg. Under Standard IV(B), members and candidates must not accept gifts, benefits, compensation or consideration that competes with, or might be reasonably expected to create a conflict of interest with their employer's interest unless they obtain written consent from all parties involved. By communicating and receiving permission from her employer to accept the bonus compensation offered by Greenberg, Esposito is in compliance with the CFA Institute Code and Standards Standard IV(B)."]}, {"type": "mc", "points": 1, "prompt": "<p>According to the Standards, the best immediate action for Esposito to address Kligman's violation is to:</p>", "choices": ["initiate an investigation to determine the extent of the violation.", "report Kligman to the CFA Institute Professional Conduct Program.", "instruct Kligman to enroll in a training course about valuation policies."], "num": 2, "correctIndex": 0, "correctText": "initiate an investigation to determine the extent of the violation.", "feedback": ["Correct. Under Standard IV(C) Responsibility of Supervisors, members and candidates must make reasonable efforts to ensure that anyone subject to their supervision or authority complies with applicable laws, rules, regulations, and the Code and Standards. Under Standard IV(C), once a violation is discovered, a supervisor should respond promptly and conduct a thorough investigation of the activities leading to the violation to determine the scope of the wrongdoing."]}, {"type": "mc", "points": 1, "prompt": "<p>With regard to EarthCare, does Esposito violate the Standards?</p>", "choices": ["No", "Yes, because she does not donate her entire management fee to EarthCare", "Yes, because she does not mention the arrangement with EarthCare to her new client"], "num": 3, "correctIndex": 2, "correctText": "Yes, because she does not mention the arrangement with EarthCare to her new client", "feedback": ["Correct. The service fee arrangement with EarthCare qualifies as a referral fee arrangement, with referral fees defined as compensation, consideration, or benefit received from or paid to others for the recommendation of products or services. Under Standard VI(C) Referral Fees, members and candidates must disclose to their employer, clients, or prospective clients, as appropriate, any compensation, consideration, or benefit received from or paid to others for the recommendation of products or services. Esposito has not disclosed the referral fee arrangement to her new client and is thus in violation of Standard VI(C)."]}, {"type": "mc", "points": 1, "prompt": "<p>With regard to Easy Tech, according to the Standards, the best immediate action for Esposito is to:</p>", "choices": ["resign from the board of Easy Tech.", "contact the regulator in Easy Tech's jurisdiction.", "report the misstated revenue to the legal counsel of Easy Tech."], "num": 4, "correctIndex": 2, "correctText": "report the misstated revenue to the legal counsel of Easy Tech.", "feedback": ["Correct. Standard I(A) Knowledge of the Law states that members and candidates must understand and comply with all applicable laws, rules, and regulations (including the CFA Institute Code of Ethics and Standards of Professional Conduct) of any government, regulatory organization, licensing agency, or professional association governing their professional activities. In the event of conflict, members and candidates must comply with the stricter law, rule, or regulation. The Guidance to Standard I(A) states", "that when in doubt about the appropriate action to undertake, it is recommended that a member or candidate seek the advice of compliance personnel or legal counsel concerning legal requirements. If the matter is not remedied, Esposito should then sever all connections with Easy Tech."]}]}, {"topic": "PORTFOLIO CONSTRUCTION", "points": 12, "narrative": "<p>Christine Evalyn is an investment advisor meeting with one of her clients, a family office.</p>\n<p>The family office's portfolio is primarily invested in public equities, along with a small allocation to alternative investments. The current allocation to public equities will be reduced to fund an investment in one of the three funds shown in Exhibit 1. The goal of this allocation change is to retain most of the expected return provided by public equities, while reducing total portfolio risk.</p>\n<div class=\"exhibit-title\">Exhibit 1</div>\n<table class=\"exhibit-table\"><tr><td></td><td>Corporate Bond Fund</td><td>Hedge Fund</td><td>Private Equity Fund</td></tr><tr><td>Equity beta</td><td>–0.05</td><td>0.40</td><td>0.85</td></tr><tr><td>Correlation with public equities</td><td>–0.25</td><td>0.80</td><td>0.75</td></tr></table>\n<p>Evalyn next uses a risk-based approach to evaluate two other proposed allocation changes that would adjust risk factor exposures.</p>\n<p>Change 1: Sell a private real estate fund and buy a venture capital fund</p>\n<p>Change 2: Sell a public equity fund and buy a high-yield bond fund</p>\n<p>Exhibit 2 provides the family office's desired adjustments to selected risk factors and the factor sensitivities for each fund.</p>\n<div class=\"exhibit-title\">Exhibit 2</div>\n<table class=\"exhibit-table\"><tr><td>Risk Factor</td><td>Desired Risk Factor Adjustment</td><td>Venture Capital Fund</td><td>Private Real Estate Fund</td><td>High-yield Bond Fund</td><td>Public Equity Fund</td></tr><tr><td>Nominal duration</td><td>Maintain</td><td>0.0</td><td>0.0</td><td>4.1</td><td>0.0</td></tr><tr><td>Inflation</td><td>Decrease</td><td>0.1</td><td>2.4</td><td>0.1</td><td>0.1</td></tr><tr><td>Credit spread</td><td>Maintain</td><td>0.0</td><td>0.0</td><td>4.2</td><td>0.0</td></tr><tr><td>Liquidity</td><td>Maintain</td><td>0.1</td><td>0.1</td><td>0.1</td><td>0.0</td></tr><tr><td>Size</td><td>Increase</td><td>0.6</td><td>0.0</td><td>0.0</td><td>0.9</td></tr><tr><td>Equity</td><td>Increase</td><td>0.8</td><td>0.2</td><td>0.1</td><td>1.0</td></tr></table>\n<p>The family office is considering selling its investment in a private equity fund to a third party and wants to estimate the fund's NAV one year from now. The current NAV of the fund is $120 million and the expected 1-year growth rate is 14%. At the end of the year, a capital contribution of $8 million will be due and a distribution equal to 20% of the fund's NAV prior to the capital contribution is expected to be paid out.</p>", "questions": [{"type": "essay", "points": 4, "prompt": "<p><strong>Determine</strong> which fund in Exhibit 1 would best achieve the family office's goal. (Corporate bond fund, Hedge fund, Private equity fund) <strong>Justify</strong> your response.</p>", "num": 5, "feedback": ["The private equity fund would best achieve the family office's goal of retaining most of the expected return provided by public equities while reducing total portfolio risk. Its 0.85 equity beta indicates that the private equity fund will likely retain most of the expected return provided by equities – and retain more of the expected return than the hedge fund and the corporate bond fund, given that its beta is the highest of the three. The correlations with public equities of 0.75 for the private equity fund and 0.80 for the hedge fund are close, indicating similar degrees of risk diversification – and in any case, both would achieve the goal of reducing total portfolio risk. The corporate bond fund's correlation of –0.25 provides for the best risk diversification, but its equity beta of –0.05 means it would not retain most of the expected return. Although correlation and beta have the same sign and are statistically interrelated, they quantify two different things. The correlation coefficient quantifies the strength of a linear relationship between two variables, thus playing a crucial role in portfolio diversification. Beta, however, measures the response of an asset to a unit change in a reference index."]}, {"type": "essay", "points": 4, "prompt": "<p><strong>Determine</strong> which change to the family office's portfolio is most appropriate given the desired risk factor adjustments. (Change 1, Change 2) <strong>Justify</strong> your response.</p>", "num": 6, "feedback": ["Change 1 would meet all of the desired adjustments for the various risk factors. Selling a private real estate fund and buying a venture capital fund decreases exposure to the inflation risk factor (from 2.4 to 0.1) and increases exposure to the size (from 0.0 to 0.6) and equity (from 0.2 to 0.8) risk factors. Exposure to the nominal duration, credit spread, and liquidity risk factors would not change, in line with the family office's desire to maintain the current exposure to these risk factors. With Change 2, selling a public equity fund and buying a high-yield bond fund would increase, rather than maintain, exposure to the nominal duration (from 0.0 to 4.1) risk factor; would maintain, rather than decrease, the inflation risk factor (0.1 for both); would increase, rather than maintain, the credit spread (from 0.0 to 4.2) risk factor; would increase, rather than maintain, the liquidity risk factor (from 0.0 to 0.1); would decrease, rather than increase, the size factor (from 0.9 to 0.0); and would decrease, rather than increase, the equity risk factor (from 1.0 to 0.1). To summarize, none of these are in line with the desired factor adjustments."]}, {"type": "essay", "points": 4, "prompt": "<p><strong>Calculate</strong> the expected NAV in one year of the private equity fund in which the family office has an investment.</p>", "num": 7, "feedback": ["The NAV (in $ millions) in one year is calculated as:<br>NAV in one year = Prior NAV × (1 + Growth rate) + Capital contributions – Distributions<br>= [120 × 1.14] + 8 – [120 × 1.14 × 0.20]<br>= 136.80 + 8 – 27.36<br>= 117.44", "Vignette", "TOPIC: ASSET ALLOCATION TOTAL POINT VALUE OF THIS QUESTION SET IS 12 POINTS", "Lucy Dent, chief investment strategist at Arco Investments, is evaluating Arco’s framework for developing capital market expectations. She considers the following three practices in Arco’s framework. Practice 1: Analysts develop forecasts for all major asset classes, including those outside their investment universe, to ensure cross-sectional consistency. Practice 2: Analysts adjust their structural model quarterly based on recent forecast errors to maintain intertemporal consistency. Practice 3: Analysts emphasize qualitative factors and judgment in modifying their forecasting process. Dent then analyzes current macroeconomic conditions in three countries. Country has rising inflation and low unemployment. 1 Country has a small output gap and rising interest rates. 2 Country has low short-term interest rates and decelerating inflation. 3 Looking further at Country 1, Dent observes that its average annual equity return over the past 10 years was 5.4%. She performs a decomposition on this value and observes that 0.4% of the return is not accounted for by the components shown in Exhibit 1. Exhibit 1 Nominal GDP growth            3.2% Change in EPS/GDP             0.8% Dividend yield                1.0% Several of Arco’s clients own timberland because of its low correlation to other assets and its favorable volatility characteristics. Upon learning that the timber values are based on annual appraisal data, Dent considers whether this causes both the volatility and the correlation to appear artificially low."]}]}, {"topic": "ASSET ALLOCATION", "points": 12, "narrative": "<p>Lucy Dent, chief investment strategist at Arco Investments, is evaluating Arco's framework for developing capital market expectations. She considers the following three practices in Arco's framework.</p>\n<p>Practice 1: Analysts develop forecasts for all major asset classes, including those outside their investment universe, to ensure cross-sectional consistency.</p>\n<p>Practice 2: Analysts adjust their structural model quarterly based on recent forecast errors to maintain intertemporal consistency.</p>\n<p>Practice 3: Analysts emphasize qualitative factors and judgment in modifying their forecasting process.</p>\n<p>Dent then analyzes current macroeconomic conditions in three countries. Country 1 has rising inflation and low unemployment. Country 2 has a small output gap and rising interest rates. Country 3 has low short-term interest rates and decelerating inflation.</p>\n<p>Looking further at Country 1, Dent observes that its average annual equity return over the past 10 years was 5.4%. She performs a decomposition on this value and observes that 0.4% of the return is not accounted for by the components shown in Exhibit 1.</p>\n<div class=\"exhibit-title\">Exhibit 1</div>\n<table class=\"exhibit-table\"><tr><td>Nominal GDP growth</td><td>3.2%</td></tr><tr><td>Change in EPS/GDP</td><td>0.8%</td></tr><tr><td>Dividend yield</td><td>1.0%</td></tr></table>\n<p>Several of Arco's clients own timberland because of its low correlation to other assets and its favorable volatility characteristics. Upon learning that the timber values are based on annual appraisal data, Dent considers whether this causes both the volatility and the correlation to appear artificially low.</p>", "questions": [{"type": "mc", "points": 1, "prompt": "<p>Which practice best aligns with the framework of a disciplined approach to setting capital market expectations?</p>", "choices": ["Practice 1", "Practice 2", "Practice 3"], "num": 8, "correctIndex": 2, "correctText": "Practice 3", "feedback": ["Correct because when refining the forecasting process, the analyst should use experience to improve the expectations-setting process. Hence, the most valuable part of the feedback loop will often be qualitative and judgmental."]}, {"type": "mc", "points": 1, "prompt": "<p>Which country's current macroeconomic conditions are most consistent with the initial recovery phase of the business cycle?</p>", "choices": ["Country 1", "Country 2", "Country 3"], "num": 9, "correctIndex": 2, "correctText": "Country 3", "feedback": ["Correct because in the initial recovery stage, economic activity is just beginning to pick up. The demand for money is still low and inflation is not an issue and may even be falling. In such an environment, interest rates are low and inflation is typically decelerating."]}, {"type": "mc", "points": 1, "prompt": "<p>Which of the following best explains the portion of Country 1's equity return not accounted for by the components shown in Exhibit 1?</p>", "choices": ["Stock repurchases", "The real risk-free rate", "The change in the P/E ratio"], "num": 10, "correctIndex": 2, "correctText": "The change in the P/E ratio", "feedback": ["Correct because the missing component from the determinants of long-run equity return is the change in the P/E ratio:<br>Equity return = Nominal GDP growth + Change in EPS/GDP + Dividend yield + Change in P/E<br>5.4% (in vignette) = 3.2% (in Exhibit 1) + 0.8% (in Exhibit 1) + 1.0% (in Exhibit 1) + ? not given Thus, change in P/E = 5.4 – 3.2 – 0.8 – 1.0 = 0.4%."]}, {"type": "mc", "points": 1, "prompt": "<p>Does the way timberland is valued result in artificially low volatility and correlation measures?</p>", "choices": ["Yes", "No, it causes volatility to appear artificially high", "No, it causes correlation to appear artificially high"], "num": 11, "correctIndex": 0, "correctText": "Yes", "feedback": ["Correct because the measured risk-reducing benefits of timber are overstated (biased upward) by both measures. Since both measures are derived from appraisal data, both measures will be biased downward (understated) because appraisals are only done periodically. Low measures for volatility and correlation are conducive to diversification benefits (risk reduction). Thus, both measures will promote an upward bias (overstatement) of the risk-reduction benefits."]}]}, {"topic": "PORTFOLIO MANAGEMENT", "points": 12, "narrative": "<p>Larissa Costa, a global fixed-income portfolio manager, is reviewing several portfolios that she manages in different countries.</p>\n<p>Costa first reviews her Country A portfolio. Costa anticipates an economic recovery in Country A as well as an interest rate environment where short-term rates are rising more than long-term rates are rising, resulting in a flatter benchmark yield curve. The portfolio's current structured product positions are equally divided among:</p>\n<ul><li>A-rated CDOs</li><li>A-rated covered bonds with real estate collateral</li><li>BBB-rated collateralized loan obligations (CLOs)</li></ul>\n<p>Costa determines, based on her forecast, which position to overweight in order to maximize the expected return on the Country A portfolio.</p>\n<p>Costa is bullish on the debt of a capital goods manufacturer in Country B. She expects the credit default swap (CDS) spread on the debt to fall from 130 to 115 basis points and takes a position in a CDS that reflects her expectation. The notional value of the position is $15 million, and she uses a CDS with an effective spread duration of 4.25. She calculates the potential gain of taking a position in a CDS that reflects her expectation for CDS spreads.</p>\n<p>Costa is researching bonds of three companies in the energy sector of Country C. Each company had identical probabilities of default last year. Using a structural credit model, she analyzes the percentage change in several parameters over the previous year for each company, as shown in Exhibit 1. Costa determines the likely impact of these changes on the creditworthiness of the three companies.</p>\n<div class=\"exhibit-title\">Exhibit 1</div>\n<table class=\"exhibit-table\"><tr><td></td><td>Company A</td><td>Company B</td><td>Company C</td></tr><tr><td>Z-score</td><td>5%</td><td>–4%</td><td>0%</td></tr><tr><td>Leverage ratio</td><td>5%</td><td>8%</td><td>–7%</td></tr></table>", "questions": [{"type": "essay", "points": 5, "prompt": "<p><strong>Determine</strong> which structured product position Costa should overweight given her outlook for Country A. (CDOs, Covered bonds, CLOs) <strong>Explain</strong> why each of the other structured product positions should not be overweighted. <em>Note: Each justification should be in a separate paragraph.</em></p>", "num": 12, "feedback": ["Overweighting CLOs would benefit more from short-term rate rises than CDOs and covered real estate bonds. Also, in the case of economic recovery, the risk appetite increases, leading to increased demand for lower-rated instruments. CDOs are less responsive to short-term rate increases than CLO tranches because they lack the floating- rate structure of leveraged loans based on market reference rates (MRRs) plus a credit spread, which CLOs include. As a result, CDOs are more likely to experience a decline in prices. Covered bonds carry reduced credit risk due to their dual recourse and collateral substitution characteristics. In an economic recovery, Costa would likely underweight covered bonds, as the probability of default decreases. While covered bonds offer real estate cash flow exposure similar to that of ABS, given the dual recourse (i.e., to both the issuing financial institution and the underlying asset pool) as well as the substitution of non-performing assets, covered bonds usually involve lower credit risk and a lower yield – which limits price upside in an economic recovery scenario. Covered bonds perform relatively well in a downturn versus other fixed-income bonds with real estate exposure because the investor also has recourse to the issuer."]}, {"type": "essay", "points": 4, "prompt": "<p><strong>Determine</strong>, based on Costa's spread expectation, which position she should take in a CDS on the manufacturer in Country B. (Purchase protection, Sell protection) <strong>Calculate</strong> the change in the CDS contract value if the spread changes as Costa expects.</p>", "num": 13, "feedback": ["Costa should overweight the exposure to the capital goods manufacturer by selling protection in the CDS market. This long risk position will realize a gain if spreads narrow from 130 bps to 115 bps. The notional change in the value of portfolio can be estimated using the equation: ∆(CDS Price) = (−∆(CDS Spread) × EffSpreadDurCDS), and multiplying by the notional value:<br>= (0.0015 × 4.25) × $15,000,000 = $95,625"]}, {"type": "essay", "points": 3, "prompt": "<p><strong>Determine</strong> which company's creditworthiness has most likely declined over the previous year. (Company A, Company B, Company C) <strong>Justify</strong> your response with two reasons. <em>Note: Each justification should be in a separate paragraph.</em></p>", "num": 14, "feedback": ["Company B has experienced the most significant decline in its Z-score, increasing its likelihood of default. Each composite, or Z-score, was used to classify manufacturing firms into those expected to remain solvent and those anticipated to go bankrupt. Company B has actually seen an increase in its leverage ratio, indicating a higher amount of debt versus equity (or debt to EBITDA), which increases its likelihood of financial distress. Conversely, the decrease in Company C's leverage ratio represents a decline in the amount of debt versus equity, reducing the issuer’s likelihood of financial distress.", "Vignette", "TOPIC: DERIVATIVES AND RISK MANAGEMENT TOTAL POINT VALUE OF THIS QUESTION SET IS 12 POINTS", "Liga Marconi is a currency manager at an asset management firm. She is reviewing the holdings of two of her clients. Client 1 Marconi manages a currency overlay for Client 1, a US-based hedge fund that invests internationally. She analyzes a potential trade on the Philippine peso (PHP). Marconi expects that the PHP/USD (number of PHP per 1 USD) exchange rate will be more volatile in the near term than the market expects. She does not, however, have a strong view as to the direction of the PHP/USD exchange rate. The 1-year Philippine government bond yield is 2.34% and the 1-year US government bond yield is 0.12%. Client 1 has a long position in Brazilian real (BRL). Marconi recommends hedging the position with a non- deliverable forward (NDF) using the BRL/USD exchange rate. Marconi states to Client 1 that the NDF has a lower credit risk than an outright BRL/USD forward, and that any potential capital controls in Brazil will not impact the NDF's settlement process. Client 2 Client 2 is a European-based asset manager with the EUR as its domestic currency. The client has a long position in Swiss franc (CHF) government bonds, and an equal-sized short position in GBP government bonds held as a cross hedge. Marconi estimates that the standard deviation of the domestic currency return is 5.5% for the CHF bond and 3.7% for the GBP bond, and that the correlation coefficient between the two currencies is 0.86. Marconi calculates the standard deviation of return for the combined position in CHF and GBP government bonds to determine whether the cross hedge reduces portfolio risk. Client 2 also holds an investment in a Canadian equity fund. The investment is currently valued at 7 million Canadian dollars (CAD). To hedge the currency exposure of this investment, Marconi considers using a CAD/EUR forward contract, assuming a minimum-variance hedge ratio of 0.45."]}]}, {"topic": "DERIVATIVES AND RISK MANAGEMENT", "points": 12, "narrative": "<p>Liga Marconi is a currency manager at an asset management firm. She is reviewing the holdings of two of her clients.</p>\n<p><strong>Client 1</strong></p>\n<p>Marconi manages a currency overlay for Client 1, a US-based hedge fund that invests internationally. She analyzes a potential trade on the Philippine peso (PHP). Marconi expects that the PHP/USD (number of PHP per 1 USD) exchange rate will be more volatile in the near term than the market expects. She does not, however, have a strong view as to the direction of the PHP/USD exchange rate. The 1-year Philippine government bond yield is 2.34% and the 1-year US government bond yield is 0.12%.</p>\n<p>Client 1 has a long position in Brazilian real (BRL). Marconi recommends hedging the position with a non-deliverable forward (NDF) using the BRL/USD exchange rate. Marconi states to Client 1 that the NDF has a lower credit risk than an outright BRL/USD forward, and that any potential capital controls in Brazil will not impact the NDF's settlement process.</p>\n<p><strong>Client 2</strong></p>\n<p>Client 2 is a European-based asset manager with the EUR as its domestic currency. The client has a long position in Swiss franc (CHF) government bonds, and an equal-sized short position in GBP government bonds held as a cross hedge. Marconi estimates that the standard deviation of the domestic currency return is 5.5% for the CHF bond and 3.7% for the GBP bond, and that the correlation coefficient between the two currencies is 0.86. Marconi calculates the standard deviation of return for the combined position in CHF and GBP government bonds to determine whether the cross hedge reduces portfolio risk.</p>\n<p>Client 2 also holds an investment in a Canadian equity fund. The investment is currently valued at 7 million Canadian dollars (CAD). To hedge the currency exposure of this investment, Marconi considers using a CAD/EUR forward contract, assuming a minimum-variance hedge ratio of 0.45.</p>", "questions": [{"type": "mc", "points": 1, "prompt": "<p>Based on her expectation for the PHP/USD exchange rate, Marconi should:</p>", "choices": ["sell a strangle on PHP/USD.", "buy a straddle on PHP/USD.", "sell a straddle on PHP/USD."], "num": 15, "correctIndex": 1, "correctText": "buy a straddle on PHP/USD.", "feedback": ["Correct because buying (going long) a straddle would benefit from increased volatility, which is Marconi's expectation for the PHP/USD. A straddle is a combination of an at-the-money (ATM) put and an ATM call. A long straddle buys both of these options. Because their deltas are −0.5 and +0.5, respectively, the net delta of the position is zero (or very close to zero); that is, the long straddle is delta neutral. This position is profitable in more volatile markets, when either the put or the call go sufficiently in the money to cover the upfront cost of the two option premiums paid. This strategy is consistent with Marconi having no strong directional view about PHP/USD."]}, {"type": "mc", "points": 1, "prompt": "<p>Is Marconi's statement regarding the NDF correct?</p>", "choices": ["Yes", "No, she is incorrect regarding credit risk", "No, she is incorrect regarding capital controls"], "num": 16, "correctIndex": 0, "correctText": "Yes", "feedback": ["Correct because an NDF has a lower credit risk than an outright forward contract. The credit risk of an NDF is typically lower than for the outright forward because the principal sums do not move, unlike with an outright \"vanilla\" forward contract. Also, the NDF would be settled in the non-controlled currency (USD) and not the controlled currency (BRL), so capital controls that affected the convertibility of the BRL would not affect the settlement process of the NDF."]}, {"type": "mc", "points": 1, "prompt": "<p>The standard deviation of return for Client 2's combined position in CHF and GBP government bonds is closest to:</p>", "choices": ["1.5%.", "3.0%.", "5.1%."], "num": 17, "correctIndex": 1, "correctText": "3.0%.", "feedback": ["Correct because the standard deviation of the cross-hedged portfolio is 2.99% calculated using the equation below: σ2(ω1R1+ω2R2) = ω12σ2(R1) + ω22σ2(R2) + 2ω1ω2σ(R1)σ(R2)ρ(R1,R2)<br>where:", "σ2(ω1R1+ω2R2) – variance of the two-asset portfolio σ(R1) – standard deviation of the domestic currency return σ2(Ri) – variance of the domestic currency return ωi – portfolio weights of the relevant assets ρ(R1,R2) – correlation coefficient between the two assets", "As the weights are +1 for the long position and –1 for the short position, the calculation is as follows: σ2(ω1R1+ω2R2) = 5.5%2 + 3.7%2 + 2×(1)×(–1)×5.5%×3.7%×0.86 = 0.000894", "σ(ω1R1+ω2R2) = 0.0008941/2 = 0.0299 = 3.0%"]}, {"type": "mc", "points": 1, "prompt": "<p>To hedge Client 2's CAD investment, Marconi should use a:</p>", "choices": ["long contract with a notional size of CAD 3,150,000.", "short contract with a notional size of CAD 3,150,000.", "short contract with a notional size of EUR 3,150,000."], "num": 18, "correctIndex": 0, "correctText": "long contract with a notional size of CAD 3,150,000.", "feedback": ["Correct. A hedge ratio of 0.45 implies that the CAD 7,000,000 position will be hedged with short forward exposure with a notional size of CAD 3,150,000 (CAD 7,000,000 × 0.45). Selling CAD for the CAD/EUR pair implies buying the base currency (EUR). Therefore, a long CAD/EUR forward contract with a notional size of CAD 3,150,000 is the correct answer."]}]}, {"topic": "PERFORMANCE MEASUREMENT", "points": 12, "narrative": "<p>Milton Kemble was recently hired by Greenleaf Investment Partners to help the firm comply with the GIPS standards. Greenleaf has several investment divisions within the firm, including real estate, public equities, and private equities.</p>\n<p>Greenleaf's real estate group has an investment in a privately held, mixed-use building complex. The firm uses a price-to-free cash flow multiple approach to value the investment. Kemble considers which of the following two price-to-free cash flow multiples he should use in the valuation:</p>\n<p>Multiple 1: The multiple of a comprehensive dataset of comparable publicly traded properties, updated quarterly</p>\n<p>Multiple 2: The multiple of three transactions of comparable privately-owned properties that occurred two years ago</p>\n<p>Next, Kemble calculates the performance of Greenleaf's public equity composite using the aggregate return method and information in Exhibit 1 (in USD millions).</p>\n<div class=\"exhibit-title\">Exhibit 1</div>\n<table class=\"exhibit-table\"><tr><td></td><td>Portfolio A</td><td>Portfolio B</td><td>Portfolio C</td></tr><tr><td>Beginning assets</td><td>96</td><td>105</td><td>142</td></tr><tr><td>Total external cash flows</td><td>11</td><td>–12</td><td>–13</td></tr><tr><td>Ending assets</td><td>111</td><td>97</td><td>133</td></tr><tr><td>Weighted cash flows</td><td>2</td><td>–10</td><td>–11</td></tr></table>\n<p>Greenleaf also manages a private equity composite. The composite's portfolios contain numerous illiquid holdings. The investment committee is concerned that if one of the portfolios were to receive a significant cash inflow, the return for this portfolio would deviate from the returns of the other portfolios in the composite due to the amount of time needed to invest the cash. Kemble recommends a GIPS-compliant approach to address the effect of significant cash flows on the private equity composite.</p>", "questions": [{"type": "essay", "points": 4, "prompt": "<p><strong>Determine</strong> which price-to-free cash flow multiple Kemble should use to best comply with the GIPS standards. (Multiple 1, Multiple 2) <strong>Justify</strong> your response.</p>", "num": 19, "feedback": ["If objective, observable, unadjusted quoted market prices for identical investments in active markets on the measurement date are not available, the GIPS standards recommend the following alternatives, in declining order of preference: 1. quoted prices for similar investments in active markets. If such inputs are not available or appropriate, then investments should be valued based on: 2. quoted prices for identical or similar investments in markets that are not active (markets in which there are few transactions for the investment, the prices are not current, or price quotations vary substantially over time and/ or between market makers). If such inputs are not available or appropriate, then investments should be valued based on: 3. market-based inputs, other than quoted prices, that are observable for the investment. If such inputs are not available or appropriate, then investments should be valued based on: 4. subjective, unobservable inputs. In this case, the first preference of available quoted prices for similar investments in active markets is met by Multiple 1. Therefore, Multiple 1 is the price-to-free cash flow multiple that should be used."]}, {"type": "essay", "points": 4, "prompt": "<p><strong>Calculate</strong> the performance for the public equity composite using the aggregate return method.</p>", "num": 20, "feedback": ["The Aggregate Return method combines all the composite assets and external cash flows to calculate returns as if the composite were one portfolio. Beginning assets and intra-period external cash flows can", "be summed and, treating the entire composite as though it were a single portfolio, the return can be computed directly with the Modified Dietz formula. The columns should be summed to create the totals column shown below. Exhibit 1 Portfolio               A B C Totals Beginning assets        96 105 142 343 Total external cash flows 11 –12 –13 –14 Ending assets                111 97 133 341 Weighted cash flows          2      –10 –11 –19", "Using the numbers in the \"Totals\" column and the modified Dietz formula, (V1 – V0 – Σ(cash flows)) / (V0 + Σ(weighted cash flows)), the performance of the public equity composite can be calculated as: (341 – 343 – (–14)) / (343 + (–19)) = 3.70%"]}, {"type": "essay", "points": 4, "prompt": "<p><strong>Discuss</strong> two GIPS-compliant approaches that would address the investment committee's concern regarding the private equity composite.</p>", "num": 21, "feedback": ["In the event of significant cash flows, a portfolio may be temporarily removed from the composite. Alternatively, firms may use temporary new accounts to remove the effect of a significant cash flow. Firms adopting this approach place client-initiated incoming cash and securities into a temporary account that is not included in any composite until the external cash flows have been invested in accordance with the portfolio’s investment mandate, objective, or strategy, at which time they would be transferred into the main portfolio and treated as an external cash flow.", "Vignette", "TOPIC: PORTFOLIO MANAGEMENT TOTAL POINT VALUE OF THIS QUESTION SET IS 12 POINTS", "Jane Lee is the portfolio manager for a domestic equity mutual fund with a fundamental investment approach and is reviewing several trades for the fund. She is considering a trade in Stock A based on short-term alpha expectations and determines which pre-trade benchmark to use in evaluating the execution of the trade. Lee recently placed a buy order for 40,000 shares of Stock B, a small-cap stock which has a beta of 1.3 and average daily trading volume of 2 million shares. Following full execution of the order, Lee evaluates the expanded implementation shortfall and the market-adjusted cost of the trade. Total fees on the trade were $1,800. She summarizes the price information for Stock B and its relevant index in Exhibit 1. Exhibit 1 Stock B     Index Previous close                $12.15      1,320 Opening price             $12.12        1,328 Decision price            $12.10        1,318 Arrival price             $12.23        1,326 Execution price           $12.28        1,327 Closing price             $12.43        1,331 Volume-weighted $12.26        1,329 average price (VWAP)", "Lee is notified that a client will invest $50 million into her fund. She estimates that under normal market conditions, she would invest 30% of the inflow on the first trading day after receipt and use an equitization strategy for the remainder. On the first trading day after the inflow is received Lee notes that, for the broad market, average daily trading volumes for the current week are normal, volatility is comparatively low, and bid–ask spreads are relatively narrow."]}]}, {"topic": "PORTFOLIO MANAGEMENT", "points": 12, "narrative": "<p>Jane Lee is the portfolio manager for a domestic equity mutual fund with a fundamental investment approach and is reviewing several trades for the fund. She is considering a trade in Stock A based on short-term alpha expectations and determines which pre-trade benchmark to use in evaluating the execution of the trade.</p>\n<p>Lee recently placed a buy order for 40,000 shares of Stock B, a small-cap stock which has a beta of 1.3 and average daily trading volume of 2 million shares. Following full execution of the order, Lee evaluates the expanded implementation shortfall and the market-adjusted cost of the trade. Total fees on the trade were $1,800. She summarizes the price information for Stock B and its relevant index in Exhibit 1.</p>\n<div class=\"exhibit-title\">Exhibit 1</div>\n<table class=\"exhibit-table\"><tr><td></td><td>Stock B</td><td>Index</td></tr><tr><td>Previous close</td><td>$12.15</td><td>1,320</td></tr><tr><td>Opening price</td><td>$12.12</td><td>1,328</td></tr><tr><td>Decision price</td><td>$12.10</td><td>1,318</td></tr><tr><td>Arrival price</td><td>$12.23</td><td>1,326</td></tr><tr><td>Execution price</td><td>$12.28</td><td>1,327</td></tr><tr><td>Closing price</td><td>$12.43</td><td>1,331</td></tr><tr><td>Volume-weighted average price (VWAP)</td><td>$12.26</td><td>1,329</td></tr></table>\n<p>Lee is notified that a client will invest $50 million into her fund. She estimates that under normal market conditions, she would invest 30% of the inflow on the first trading day after receipt and use an equitization strategy for the remainder. On the first trading day after the inflow is received Lee notes that, for the broad market, average daily trading volumes for the current week are normal, volatility is comparatively low, and bid–ask spreads are relatively narrow.</p>", "questions": [{"type": "mc", "points": 1, "prompt": "<p>Which of the following pre-trade benchmarks is most appropriate for Lee's Stock A trade?</p>", "choices": ["Arrival price", "Opening price", "Previous close price"], "num": 22, "correctIndex": 0, "correctText": "Arrival price", "feedback": ["Correct because the arrival price is the price of a security at the time the order is entered into the market for execution. This can be appropriate for managers who are buying or selling on the basis of short-term alpha expectations. In this case, Lee will be seeking to achieve a price close to the current market price in order to realize as much alpha as possible."]}, {"type": "mc", "points": 1, "prompt": "<p>The largest component of the expanded implementation shortfall for the Stock B trade is:</p>", "choices": ["delay cost.", "trading cost.", "opportunity cost."], "num": 23, "correctIndex": 0, "correctText": "delay cost.", "feedback": ["Correct because delay cost represents the adverse price movement associated with not submitting the order to the market in a timely manner. It can be calculated as: Arrival price – Decision price", "where:<br>P0 = Arrival price<br>Pd = Decision price<br>= (40,000 × $12.23) – (40,000 × $12.10) = $5,200"]}, {"type": "mc", "points": 1, "prompt": "<p>The market-adjusted cost of the Stock B trade is closest to:</p>", "choices": ["11 bps.", "18 bps.", "40 bps."], "num": 24, "correctIndex": 0, "correctText": "11 bps.", "feedback": ["Correct because this answer is correctly calculated as: Market-adjusted cost (bps) = Arrival cost – Beta × Index cost,<br>where:<br>Arrival cost = ((Executed price – Arrival price) / Arrival price) × 104<br>= (12.28 – 12.23)/(12.23) × 104<br>= 40.88 bps<br>and<br>Index cost = ((Index VWAP – Index arrival price) / Index arrival price) × 104<br>= ((1,329 – 1,326)/1,326) × 104<br>= 22.62 bps<br>Therefore, Market-adjusted cost (bps) = 40.88 – 1.3 × 22.62<br>= 11.47 bps"]}, {"type": "mc", "points": 1, "prompt": "<p>On the first trading day after the $50 million is received, do market conditions most likely support Lee trading more than 30% of the inflow?</p>", "choices": ["Yes", "No, because of market volatility", "No, because of bid–ask spreads"], "num": 25, "correctIndex": 0, "correctText": "Yes", "feedback": ["Correct because conditions in the market are supportive of higher liquidity than in normal circumstances. Low bid–ask spreads are seen as a proxy for both market depth and trading costs. Similarly, volatility and liquidity are dynamic and generally negatively correlated, which implies that as volatility decreases, liquidity increases and vice versa. Lower bid–ask spreads and lower volatility both indicate greater market liquidity."]}]}, {"topic": "PORTFOLIO CONSTRUCTION", "points": 12, "narrative": "<p>Nate Johnson is the chief investment officer at Merrimack Money Managers (MMM), a boutique hedge fund based in the US. After a recent meme stock event that triggered price disruption, Johnson is meeting with Sergey Anosov, head trader at MMM, to review recent trading activity, trading strategies, and execution costs.</p>\n<p>One of the meme stocks, Company ABC, has surged by an astonishing 475% as retail investors have continued to buy based on its rapid gains. Johnson is concerned about the sudden rise of the stock price and asks Anosov to sell the firm's holdings of ABC stock. Anosov splits the sell order ticket into three orders executed on the same day, as shown in Exhibit 1. There were only two other trades that occurred in ABC shares that day: 30,000 shares at $32.40 and 15,000 shares at $32.25. ABC shares closed at $31.75 at the end of the day.</p>\n<div class=\"exhibit-title\">Exhibit 1</div>\n<table class=\"exhibit-table\"><tr><td>Time Executed</td><td>Shares Executed</td><td>Execution Price</td><td>Bid Price</td><td>Ask Price</td></tr><tr><td>3:15 p.m.</td><td>15,000</td><td>$32.45</td><td>$32.44</td><td>$32.49</td></tr><tr><td>3:27 p.m.</td><td>10,000</td><td>$32.37</td><td>$32.37</td><td>$32.41</td></tr><tr><td>3:49 p.m.</td><td>25,000</td><td>$31.95</td><td>$31.96</td><td>$31.99</td></tr></table>\n<p>After reviewing the data in Exhibit 1, Anosov explains the components of execution costs and effective spreads and makes the following statements:</p>\n<p>Statement 1: The effective spread is a poor estimate of actual transaction costs when small orders receive price improvement.</p>\n<p>Statement 2: Implementation shortfall compares the value of the actual portfolio with that of a paper portfolio constructed on the assumption that the trades could be executed at the volume-weighted average price.</p>", "questions": [{"type": "essay", "points": 5, "prompt": "<p><strong>Calculate</strong> the volume-weighted average price (VWAP) transaction cost estimate for the ABC shares sold by MMM.</p>", "num": 26, "feedback": ["The volume-weighted average price (VWAP) for the day is the total dollar volume divided by the total number of shares traded that day. Trade         Shares Executed Execution Price Bid Price Ask Price Total Dollar Volume Trade 1       15,000            $32.45        $32.44 $32.49 $486,750 Trade 2       10,000                   $32.37         $32.37       $32.41        $323,700 Trade 3       25,000                   $31.95         $31.96       $31.99        $798,750 Other trade 1 30,000                   $32.40         ---          ---           $972,000 Other trade 2 15,000                   $32.25         ---          ---           $483,750 TOTAL         95,000                   ---            ---          ---           $3,064,950", "VWAP for the day = $3,064,950 / 95,000 = $32.2626<br>VWAP for MMM’s trades: Trade Shares Executed Execution Price Bid Price Ask Price Total Dollar Volume Trade 1 15,000          $32.45           $32.44 $32.49 $486,750 Trade 2 10,000          $32.37           $32.37 $32.41 $323,700 Trade 3 25,000                   $31.95         $31.96       $31.99      $798,750 TOTAL 50,000                     ---            ---          ---         $1,609,200", "VWAP for MMM’s trades = $1,609,200 / 50,000 = $32.1840 The VWAP transaction cost estimate for MMM’s trades is the difference multiplied by the shares sold:", "= [$32.2626 – $32.1840] × 50,000 = $3,930"]}, {"type": "essay", "points": 4, "prompt": "<p><strong>Calculate</strong> the average effective spread of MMM's three ABC trades.</p>", "num": 27, "feedback": ["The effective spread for a sell order is 2 × (Midpoint of the market at the time of order entry − Trade price). The calculations are as follows:<br>Effective spread of Trade 1 = 2 × {[($32.44 + $32.49) / 2] – $32.45} = $0.03<br>Effective spread of Trade 2 = 2 × {[($32.37 + $32.41) / 2] – $32.37} = $0.04<br>Effective spread of Trade 3 = 2 × {[($31.96 + $31.99) / 2] – $31.95} = $0.05<br>The average effective spread is then calculated as:<br>Average effective spread = (Effective spread of Trade 1 + Effective spread of Trade 2 + Effective spread of<br>Trade 3) / 3<br>Average effective spread = ($0.03 + $0.04 + $0.05) / 3 = $0.04"]}, {"type": "essay", "points": 3, "prompt": "<p><strong>Determine</strong> which statement made by Anosov is most likely incorrect. (Statement 1, Statement 2) <strong>Justify</strong> your response.</p>", "num": 28, "feedback": ["Statement 2 is incorrect because implementation shortfall does not involve a comparison to the volume- weighted average price. Implementation shortfall compares the value of the actual portfolio with that of a paper portfolio constructed on the assumption that trades could be arranged at the prices that prevailed when the decision to trade was made. The prevailing price – also called the decision price, the arrival price, or the strike price – is generally taken to be the midquote price at the time of the trade decision. The excess of the paper value over the actual value is the implementation shortfall. Statement 1 is correct because the effective spread is a poor estimate of actual transaction costs when traders split large orders into many parts to fill over time or when small orders receive price improvement.", "Vignette", "TOPIC: PORTFOLIO MANAGEMENT TOTAL POINT VALUE OF THIS QUESTION SET IS 12 POINTS", "Robert Davison is an active equity manager primarily using quantitative factor-based strategies. As part of his normal portfolio rebalancing, Davison is planning several trades for his equity factor rotation fund. Current and expected post-trade portfolio weights of four stocks relative to the benchmark are identified in Exhibit 1. Exhibit 1 Current Weight        Expected Post-trade Stock         Industry       Relative to the       Weight Relative to Benchmark            the Benchmark", "Electric Corp.        Utilities   Overweight by 2%              Equal Power Corp.        Utilities    Underweight by 2%            Equal Computer Co. Technology                 Equal          Overweight by 1% Clothes Inc.     Consumer               Equal         Underweight by 1% Davison manages a separate fund that utilizes a statistical arbitrage approach. This fund uses a pairs trading strategy, and Davison reviews three pairs for potential investment. The ratios of the share prices in each pair are currently two standard deviations away from their respective moving averages. Pair 1 consists of an insurance conglomerate and a regional bank. A statistical analysis shows strong correlation between their share prices over the past six years. Pair 2 consists of two oil refiners. The ratio of their share prices shows mean reversion over the past six years. Pair 3 consists of two software companies that are direct competitors. One recently appointed a new CEO, who has implemented an aggressive growth strategy with increased acquisition activity. In managing the statistical arbitrage fund, Davison expects to make 30 independent investment decisions this year. He also expects a correlation of 40% between his forecasted active returns and his realized active returns. He uses the fundamental law of active management to calculate the expected active return for the fund, assuming active risk of 4% and a transfer coefficient of 0.6. Davison is starting a new quantitative factor-based strategy. He backtests the new strategy on the 100 stocks that are currently listed on a major domestic large-cap stock exchange, and is careful to avoid data mining. All forward- looking parameters were publicly known and available at the time they were used to make a simulated investment decision as part of the backtest. Davison determines that the results of the backtest are overly optimistic."]}]}, {"topic": "PORTFOLIO MANAGEMENT", "points": 12, "narrative": "<p>Robert Davison is an active equity manager primarily using quantitative factor-based strategies.</p>\n<p>As part of his normal portfolio rebalancing, Davison is planning several trades for his equity factor rotation fund. Current and expected post-trade portfolio weights of four stocks relative to the benchmark are identified in Exhibit 1.</p>\n<div class=\"exhibit-title\">Exhibit 1</div>\n<table class=\"exhibit-table\"><tr><td>Stock</td><td>Industry</td><td>Current Weight Relative to the Benchmark</td><td>Expected Post-trade Weight Relative to the Benchmark</td></tr><tr><td>Electric Corp.</td><td>Utilities</td><td>Overweight by 2%</td><td>Equal</td></tr><tr><td>Power Corp.</td><td>Utilities</td><td>Underweight by 2%</td><td>Equal</td></tr><tr><td>Computer Co.</td><td>Technology</td><td>Equal</td><td>Overweight by 1%</td></tr><tr><td>Clothes Inc.</td><td>Consumer</td><td>Equal</td><td>Underweight by 1%</td></tr></table>\n<p>Davison manages a separate fund that utilizes a statistical arbitrage approach. This fund uses a pairs trading strategy, and Davison reviews three pairs for potential investment. The ratios of the share prices in each pair are currently two standard deviations away from their respective moving averages.</p>\n<p>Pair 1 consists of an insurance conglomerate and a regional bank. A statistical analysis shows strong correlation between their share prices over the past six years.</p>\n<p>Pair 2 consists of two oil refiners. The ratio of their share prices shows mean reversion over the past six years.</p>\n<p>Pair 3 consists of two software companies that are direct competitors. One recently appointed a new CEO, who has implemented an aggressive growth strategy with increased acquisition activity.</p>\n<p>In managing the statistical arbitrage fund, Davison expects to make 30 independent investment decisions this year. He also expects a correlation of 40% between his forecasted active returns and his realized active returns. He uses the fundamental law of active management to calculate the expected active return for the fund, assuming active risk of 4% and a transfer coefficient of 0.6.</p>\n<p>Davison is starting a new quantitative factor-based strategy. He backtests the new strategy on the 100 stocks that are currently listed on a major domestic large-cap stock exchange, and is careful to avoid data mining. All forward-looking parameters were publicly known and available at the time they were used to make a simulated investment decision as part of the backtest. Davison determines that the results of the backtest are overly optimistic.</p>", "questions": [{"type": "mc", "points": 1, "prompt": "<p>As a result of Davison's rebalancing trades for the equity factor rotation fund, active share will most likely:</p>", "choices": ["decrease.", "not change.", "increase."], "num": 29, "correctIndex": 0, "correctText": "decrease.", "feedback": ["Correct because active share will decrease because the total absolute active weights decreased. The active share change for each trade is calculated using the following formula: Active Share = Active share for these 4 securities was 2 before the trades and is 1 after the trades, as follows: (Electric +2, Power      , Computer 0, Clothes 0) / 2 = 2 (Electric 0, Power 0, Computer +1, Clothes       )/2=1 Active share measures the extent to which the number and sizing positions in a manager’s portfolio differ from the benchmark."]}, {"type": "mc", "points": 1, "prompt": "<p>Which of the following is most suitable for a pairs trade in the statistical arbitrage fund?</p>", "choices": ["Pair 1", "Pair 2", "Pair 3"], "num": 30, "correctIndex": 1, "correctText": "Pair 2", "feedback": ["Correct because they have similar businesses, there is no indication of a change in either company’s strategy, and the ratio of their share prices show mean reversion. The companies’ share prices have been correlated in the past, with the share price ratio reverting to the moving average. They have similar businesses, and there is no indication of a change in either company’s strategies, as there is for Pair 3. By contrast with the price ratio for Pair 2, the past correlation of share prices for Pair 1 may have been spurious and is not described as exhibiting mean reversion."]}, {"type": "mc", "points": 1, "prompt": "<p>Based on the fundamental law of active management, the expected active return for the statistical arbitrage fund is closest to:</p>", "choices": ["5.3%.", "6.8%.", "8.3%."], "num": 31, "correctIndex": 0, "correctText": "5.3%.", "feedback": ["Correct because:", "expected information coefficient of the manager = 40% (0.4)<br>breadth = 30<br>transfer coefficient = 0.6<br>the manger's active risk = 4%", "Breadth — the number of truly independent decisions made each year. Breadth from the vignette: Davison expects to make 30 independent investment decisions this year.<br>IC = expected information coefficient of the manager — the extent to which a manager’s forecasted active<br>returns correspond to the manager's realized active returns. Information coefficient from the vignette: He also expects a correlation of 40% between his forecasted active returns and his realized active returns."]}, {"type": "mc", "points": 1, "prompt": "<p>Which of the following issues most likely affects Davison's backtest for the new quantitative factor-based strategy?</p>", "choices": ["Overfitting", "Look-ahead bias", "Survivorship bias"], "num": 32, "correctIndex": 2, "correctText": "Survivorship bias", "feedback": ["Correct because the analyst uses only the stocks currently trading on a major stock exchange, and the backtest results are overly optimistic. When backtests use only those companies that are currently in business today, they ignore the stocks that have left the investment universe due to bankruptcy, delisting, or acquisition. This approach creates a bias whereby only companies that have survived are tested and it is assumed that the strategy would never have invested in companies that have failed. Survivorship bias often leads to overly optimistic results."]}]}, {"topic": "DERIVATIVES AND RISK MANAGEMENT", "points": 12, "narrative": "<p>Puja Shan is a derivatives expert for an investment management firm. She is meeting with representatives from two companies to address concerns regarding their portfolios.</p>\n<p><strong>Company A</strong></p>\n<p>Company A has a $70 million equity fund which has a broad equity market index as its benchmark. The representative for the company is concerned that the market may decline. Company A's goal is to provide the portfolio with some protection from a downturn over the next six months. The portfolio's beta is currently 1.1 and Shan suggests decreasing it to 0.9 using futures contracts. She collects the following information in Exhibit 1.</p>\n<div class=\"exhibit-title\">Exhibit 1</div>\n<table class=\"exhibit-table\"><tr><td>Current value of equity market index</td><td>2,390</td></tr><tr><td>6-month risk-free rate (annualized)</td><td>0.75%</td></tr><tr><td>6-month equity market index futures price</td><td>2,200</td></tr><tr><td>Index futures multiplier</td><td>$250</td></tr><tr><td>Index futures beta</td><td>0.98</td></tr></table>\n<p><strong>Company B</strong></p>\n<p>Shan's firm manages a $240 million portfolio for Company B's pension plan, in which the allocation is evenly split between bonds and equities. The bond portion is invested in fixed-rate bonds, and has a portfolio duration of 3.4. The company's goal is to shorten the duration of the portfolio without selling bonds. Shan explains how a swap, based on a 6-month reference rate, could be used to adjust the duration of the bond portfolio. She considers using one of the following swaps:</p>\n<p>Swap 1: Pay-fixed, receive-floating interest rate swap</p>\n<p>Swap 2: Pay-floating, receive-fixed interest rate swap</p>\n<p>Regarding the $120 million equity portion of Company B's pension plan portfolio, the current allocation is equally split between small-cap stocks and large-cap stocks. The client wants to shift the allocation to 70% small-cap stocks and 30% large-cap stocks. Shan suggests using two 12-month equity-for-floating swaps. In particular, Shan suggests using an S&P 500 Index swap to replicate the large-cap sector and an S&P SmallCap 600 Index swap to replicate the small-cap sector. The floating legs of both swaps would use the relevant reference rate. To demonstrate the swaps' potential outcome, Shan uses the data shown in Exhibit 2.</p>\n<div class=\"exhibit-title\">Exhibit 2</div>\n<table class=\"exhibit-table\"><tr><td>Projected 1-year total return on S&P 500 Index</td><td>–1.20%</td></tr><tr><td>Projected 1-year total return on S&P SmallCap 600 Index</td><td>2.30%</td></tr><tr><td>Projected 1-year total return on existing stock portfolio</td><td>0.70%</td></tr><tr><td>6-month reference rate at initiation of swaps (annualized)</td><td>0.60%</td></tr><tr><td>12-month reference rate at initiation of swaps</td><td>0.75%</td></tr></table>", "questions": [{"type": "essay", "points": 4, "prompt": "<p><strong>Formulate</strong> the trade (number of contracts to buy or sell) that is required to implement Shan's suggested strategy for Company A's portfolio.</p>", "num": 33, "feedback": ["To determine the number of contracts needed to change the beta of the portfolio, the following equation is used: βT S = βS S + N f β f F<br>We then solve for Nf and obtain Nf = [(βT – βS) / βf)] × (S / F), where:<br>Nf is the number of futures contracts βT is the target beta of the stock portfolio βS is the current beta of the stock portfolio βf is the beta of the futures S is the value of the stock portfolio F is the value per futures contract (the futures price x the multiplier)<br>Nf = [(0.9 – 1.1) / 0.98] × $70,000,000 / (2,200 × 250)<br>= –0.204 × 127.273<br>= –25.96, or –26 contracts<br>Because the manager wants to decrease the portfolio's beta (βT is less than βS)the sign of Nf is negative and the contracts would need to be sold."]}, {"type": "essay", "points": 4, "prompt": "<p><strong>Determine</strong> which interest rate swap would best achieve Company B's goal for the bond portion of the pension plan portfolio. (Swap 1, Swap 2) <strong>Justify</strong> your response.</p>", "num": 34, "feedback": ["The modified duration of a swap is the net of the modified durations of the fixed and floating sides of the trade, which from the fixed payer's perspective is negative because the higher positive modified duration of the fixed-rate side is larger than the floating-rate side, which is near zero. The company's goal is to reduce the duration of the portfolio. Because Swap 1 has a negative duration, this trade will achieve that goal."]}, {"type": "essay", "points": 4, "prompt": "<p><strong>Calculate</strong> the combined net cash flow of the two equity-for-floating swaps for Company B.</p>", "num": 35, "feedback": ["In order to implement the desired reallocation, from 50% small-cap / 50% large-cap exposure to 70% small-cap / 30% large-cap, the required notional value of $24,000,000 ($120,000,000 × 0.2) would be applied to both swaps, as follows:", "1) To increase the portfolio's small-cap allocation from 50% to 70%, the company would go long the S&P 600® SmallCap Index and receive the total return on that index, and make payment tied to the market reference rate: ($24,000,000 × 0.023) – ($24,000,000 × 0.0075) = $552,000 – $180,000 = $372,000. 2) To decrease the portfolio's large-cap allocation from 50% to 30%, the fund would go short the S&P 500® Index and pay the total return on that index, and receive payment tied to the market reference rate: (–$24,000,000 × –0.012) + ($24,000,000 × 0.0075) = $288,000 + $180,000 = $468,000 Because the total return on the index is negative, the fund would pay a negative return (receive the return) and also receive the payment tied to the market reference rate. 3) The net cash flow of the combination of the two swaps above is: $372,000 + $468,000 = $840,000. Alternatively, the cash flows on the floating legs of the swaps cancel each other out, and the cash flows on the equity legs would be: (–$24,000,000 × –0.012) + ($24,000,000 × 0.023) = $288,000 + $552,000 = $840,000. This can also be expressed as $24,000,000 × 0.035 = $840,000.", "Vignette", "TOPIC: ASSET ALLOCATION TOTAL POINT VALUE OF THIS QUESTION SET IS 12 POINTS", "Carlos Sanchez is a portfolio manager at Deep River Associates, a wealth management firm specializing in asset allocation strategies for clients. Sanchez meets with one of his clients, Sarah Nichols, a 60-year-old graphic designer planning to retire in five years. Nichols has an investment portfolio consisting of $1,350,000 in domestic large-capitalization equities and $625,000 in investment grade corporate bonds. Nichols also owns a single-family home valued at $750,000, with remaining mortgage debt of $130,000. Sanchez estimates the present value of Nichols’s pre-retirement earnings to be $320,000. He also estimates the present value of Nichols’s expected future consumption expenditures to be $1,900,000. Sanchez uses this information to prepare an economic balance sheet. Nichols informs Sanchez that her objectives in retirement are to maintain her current lifestyle and to be able to fund each of her various interests and hobbies. She would like her overall asset allocation to reflect her required probability of achieving each individual objective. Sanchez discusses which asset allocation approach would be most appropriate for Nichols. Next, Sanchez meets with Ashley Baker, a client who has recently inherited $5,000,000. Sanchez uses mean- variance optimization (MVO) to develop an asset allocation for Baker’s portfolio. He determines that Baker is highly risk averse, with a risk aversion coefficient (λ) of 8, and uses the objective MVO utility function to determine an appropriate asset allocation. Exhibit 1 shows the expected return and standard deviation of returns for three strategic asset allocation alternatives Sanchez is considering for Baker. Exhibit 1 Standard Expected Return            Deviation of Returns Allocation A           10.0%                  10.5% Allocation B            9.0%                   9.0% Allocation C            6.0%                   5.0% Sanchez suggests to Baker that a short-term adjustment in her asset allocation would be prudent to address the uncertainty surrounding an upcoming election and its anticipated impact on economic and financial market conditions."]}]}, {"topic": "ASSET ALLOCATION", "points": 12, "narrative": "<p>Carlos Sanchez is a portfolio manager at Deep River Associates, a wealth management firm specializing in asset allocation strategies for clients.</p>\n<p>Sanchez meets with one of his clients, Sarah Nichols, a 60-year-old graphic designer planning to retire in five years. Nichols has an investment portfolio consisting of $1,350,000 in domestic large-capitalization equities and $625,000 in investment grade corporate bonds. Nichols also owns a single-family home valued at $750,000, with remaining mortgage debt of $130,000. Sanchez estimates the present value of Nichols's pre-retirement earnings to be $320,000. He also estimates the present value of Nichols's expected future consumption expenditures to be $1,900,000. Sanchez uses this information to prepare an economic balance sheet.</p>\n<p>Nichols informs Sanchez that her objectives in retirement are to maintain her current lifestyle and to be able to fund each of her various interests and hobbies. She would like her overall asset allocation to reflect her required probability of achieving each individual objective. Sanchez discusses which asset allocation approach would be most appropriate for Nichols.</p>\n<p>Next, Sanchez meets with Ashley Baker, a client who has recently inherited $5,000,000. Sanchez uses mean-variance optimization (MVO) to develop an asset allocation for Baker's portfolio. He determines that Baker is highly risk averse, with a risk aversion coefficient ($\\lambda$) of 8, and uses the objective MVO utility function to determine an appropriate asset allocation. Exhibit 1 shows the expected return and standard deviation of returns for three strategic asset allocation alternatives Sanchez is considering for Baker.</p>\n<div class=\"exhibit-title\">Exhibit 1</div>\n<table class=\"exhibit-table\"><tr><td></td><td>Expected Return</td><td>Standard Deviation of Returns</td></tr><tr><td>Allocation A</td><td>10.0%</td><td>10.5%</td></tr><tr><td>Allocation B</td><td>9.0%</td><td>9.0%</td></tr><tr><td>Allocation C</td><td>6.0%</td><td>5.0%</td></tr></table>\n<p>Sanchez suggests to Baker that a short-term adjustment in her asset allocation would be prudent to address the uncertainty surrounding an upcoming election and its anticipated impact on economic and financial market conditions.</p>", "questions": [{"type": "mc", "points": 1, "prompt": "<p>Using the economic balance sheet approach, Nichols's economic net worth is closest to:</p>", "choices": ["$695,000.", "$1,015,000.", "$1,145,000."], "num": 36, "correctIndex": 1, "correctText": "$1,015,000.", "feedback": ["Correct because an economic balance sheet includes conventional financial assets and liabilities, as well as extended portfolio assets and liabilities that are relevant in making asset allocation decisions. The economic balance sheet for Nichols is as follows: Assets                                      Liabilities and Economic Net Worth Equities                   $1,350,000 Mortgage debt                     $130,000 Present value of future Bonds                      $625,000                                     $1,900,000 consumption Residence                  $750,000         ---                         --- PV of Nichols’s pre- retirement earnings        $320,000         ---                         --- (human capital) Total economic assets      $3,045,000 Total economic liabilities $2,030,000 Economic net worth          $1,015,000", "Total economic assets = $1,350,000 + $625,000 + $750,000 + $320,000 = $3,045,000<br>Total economic liabilities = $130,000 + $1,900,000 = $2,030,000<br>Economic net worth = Total economic assets – Total economic liabilities<br>= $3,045,000 – $2,030,000 = $1,015,000"]}, {"type": "mc", "points": 1, "prompt": "<p>Which asset allocation approach would be most appropriate for Nichols?</p>", "choices": ["Asset-only", "Goals-based", "Liability-relative"], "num": 37, "correctIndex": 1, "correctText": "Goals-based", "feedback": ["Correct because Nichols has informed Sanchez that her objectives in retirement are to maintain her current lifestyle and be able to fund each of her various interests and hobbies, and that she would like her overall asset allocation to reflect her required probability of achieving each individual objective. The goals- based approach to asset allocation is used primarily for individuals and families and involves specifying asset allocations for sub-portfolios, each of which is aligned to specified goals ranging from supporting lifestyle needs to satisfying aspirations. Each goal is associated with regular, irregular, or bulleted cash flows; a distinct time horizon; and a risk tolerance level expressed as a required probability of achieving the goal. Each goal is assigned to its own sub-portfolio, and an asset allocation strategy specific to that sub-portfolio is derived. The sum of all sub- portfolio asset allocations results in an overall strategic asset allocation for the total portfolio."]}, {"type": "mc", "points": 1, "prompt": "<p>Which strategic asset allocation considered by Sanchez would be most appropriate for Baker?</p>", "choices": ["Allocation A", "Allocation B", "Allocation C"], "num": 38, "correctIndex": 1, "correctText": "Allocation B", "feedback": ["Correct because Allocation B generates the highest expected utility given Baker’s risk aversion level. The risk aversion coefficient (λ) for Baker is 8. The objective MVO utility function is as follows:<br>Um = E(Rm) – 0.005λσm2<br>where:<br>Um = the investor’s expected utility for asset allocation m<br>Rm = the return for asset allocation m<br>λ = the investor’s risk aversion coefficient σm2 = the expected variance of return for asset allocation m Baker’s expected utility for Allocation A:<br>Um = 10.0% – 0.005 × 8 × (10.5%)2 = 5.59%<br>Baker’s expected utility for Allocation B:<br>Um = 9.0% – 0.005 × 8 × (9.0%)2 = 5.76%<br>Baker’s expected utility for Allocation C:<br>Um = 6.0% – 0.005 × 8 × (5.0%)2 = 5.00%<br>Therefore, the most appropriate strategic asset allocation for Baker is Allocation B, as it generates the highest expected utility given her risk aversion level."]}, {"type": "mc", "points": 1, "prompt": "<p>The short-term adjustment Sanchez proposes to Baker is best described as:</p>", "choices": ["systematic tactical asset allocation.", "discretionary tactical asset allocation.", "trend-following tactical asset allocation."], "num": 39, "correctIndex": 1, "correctText": "discretionary tactical asset allocation.", "feedback": ["Correct because Sanchez plans to qualitatively interpret the uncertainty surrounding an upcoming election and its anticipated impact on economic and financial market conditions to make short-term adjustments in asset allocation, which describes discretionary tactical asset allocation (TAA). Discretionary TAA relies on a qualitative interpretation of political, economic, and financial market conditions. It is predicated on the existence of manager ski
